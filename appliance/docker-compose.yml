services:
  eduvent:
    build:
      context: ..
      dockerfile: appliance/Dockerfile
      args:
        VITE_SUPABASE_URL: ${EDUVENT_SUPABASE_URL:-http://eduvent.local:8000}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${EDUVENT_SUPABASE_ANON_KEY}
    restart: unless-stopped
    ports:
      - "4173:4173"
    environment:
      PORT: "4173"
      HOST: "0.0.0.0"
    labels:
      eduvent.runtime: appliance
