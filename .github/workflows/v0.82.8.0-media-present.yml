name: Verify v0.82.8.0 media presentation
on:
  push:
    branches:
      - chatgpt/v0.82.8.0-media-present
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
