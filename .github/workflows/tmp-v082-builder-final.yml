name: Temporary v0.82 builder final polish
on:
  push:
    branches: [chatgpt/v0.82-builder-controls]
permissions:
  contents: write
jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.82-builder-controls
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply polish
        run: |
          python .github/tmp_v082_builder_final_patch.py
          rm .github/tmp_v082_builder_final_patch.py
          rm .github/workflows/tmp-v082-builder-final.yml
          git config user.name stefesciberras
          git config user.email 43134239+stefesciberras@users.noreply.github.com
          git add src .github
          git commit -m "v0.82 polish dynamic builder sliders and physiology defaults"
          git push origin HEAD:chatgpt/v0.82-builder-controls
      - name: Validate
        run: |
          npm ci
          npm run build
