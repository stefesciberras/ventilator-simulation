name: Finalize v0.58
on:
  push:
    branches: [chatgpt/v0.58-monitor-ui]
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/v058_version.py
      - run: npm ci
      - run: npm run build
      - run: git checkout -- tsconfig.tsbuildinfo 2>/dev/null || true
      - run: rm -f scripts/v058_version.py .github/workflows/v058_finalize.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "v0.58 Finalize monitor UI and version"
          git push
