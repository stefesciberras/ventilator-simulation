name: Apply v0.48 teaching alarm patch

on:
  push:
    branches:
      - chatgpt/v0.48-alarms-rejoin

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply v0.48 alarm and instructor recovery patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.48-alarms-rejoin
          fetch-depth: 0
      - name: Apply source patch
        run: python3 scripts/v048_patch.py
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply v0.48 alarm and instructor recovery patch"
          git push origin HEAD:chatgpt/v0.48-alarms-rejoin
