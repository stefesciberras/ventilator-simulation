name: Scenario Builder v0.3.1 candidate overlay

on:
  push:
    branches:
      - chatgpt/scenario-builder-v0.3.1-candidate-overlay

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/scenario-builder-v0.3.1-candidate-overlay
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/patch_scenario_v031.py
      - run: npm ci
      - run: npm run build
      - name: Commit validated changes
        run: |
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add src/components/InstructorAccountControls.tsx src/account.css src/scenario-builder/version.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Scenario Builder v0.3.1 candidate scenario overlay"
          git push origin HEAD:chatgpt/scenario-builder-v0.3.1-candidate-overlay
