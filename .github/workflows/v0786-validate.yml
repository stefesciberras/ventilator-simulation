name: v0.78.6 validate

on:
  push:
    branches:
      - chatgpt/v0.78.6-responsive-collapse-controls
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/patch_v0786.py
      - name: Verify responsive collapse behavior
        run: |
          grep -q "wideInstructorLayout" src/App.tsx
          grep -q "collapsible={teachingSession.role !== 'instructor' || instructorSimulatorExpanded || !wideInstructorLayout}" src/App.tsx
          grep -q "collapsible = true" src/components/Controls.tsx
          grep -q "APP_VERSION = '0.78.6'" src/appVersion.ts
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit integrated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/Controls.tsx src/appVersion.ts
          git diff --cached --quiet && exit 0
          git commit -m "v0.78.6 refine instructor collapse controls"
          git push
