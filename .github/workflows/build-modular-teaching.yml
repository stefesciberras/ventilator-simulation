name: Build modular teaching workspace

on:
  push:
    branches:
      - chatgpt/v0.82.4-modular-teaching-library
    paths:
      - .github/workflows/build-modular-teaching.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.82.4-modular-teaching-library
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Wire EDUVENT to reusable teaching module
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()
          old = "import { TeachingPromptInstructorPanel, TeachingPromptOverlay, useTeachingPrompts } from './components/TeachingPrompts'"
          new = "import { TeachingCandidateOverlay, TeachingInstructorWorkspace, eduventTeachingHost, useTeachingPrompts, useTeachingQuestionLibrary } from './teaching'"
          assert old in text
          text = text.replace(old, new, 1)

          old = "const teachingPrompts = useTeachingPrompts(teachingSession.role, teachingSession.session?.id ?? null)"
          new = "const teachingPrompts = useTeachingPrompts(teachingSession.role, teachingSession.session?.id ?? null, eduventTeachingHost)\n  const teachingLibrary = useTeachingQuestionLibrary(eduventTeachingHost)"
          assert old in text
          text = text.replace(old, new, 1)

          text = text.replace('<TeachingPromptOverlay\n', '<TeachingCandidateOverlay\n', 1)

          old = '''                <TeachingPromptInstructorPanel
                  role={teachingSession.role}
                  activePrompt={teachingPrompts.activePrompt}
                  responses={teachingPrompts.responses}
                  candidateCount={teachingSession.members.filter((member) => member.role === 'candidate').length}
                  busy={teachingPrompts.busy}
                  error={teachingPrompts.error}
                  onPresent={teachingPrompts.presentPrompt}
                  onClose={teachingPrompts.closePrompt}
                />'''
          new = '''                <TeachingInstructorWorkspace
                  role={teachingSession.role}
                  host={eduventTeachingHost}
                  activePrompt={teachingPrompts.activePrompt}
                  responses={teachingPrompts.responses}
                  candidateCount={teachingSession.members.filter((member) => member.role === 'candidate').length}
                  promptBusy={teachingPrompts.busy}
                  promptError={teachingPrompts.error}
                  libraryItems={teachingLibrary.items}
                  libraryAvailable={Boolean(teachingLibrary.author)}
                  libraryBusy={teachingLibrary.busy}
                  libraryError={teachingLibrary.error}
                  onPresent={teachingPrompts.presentPrompt}
                  onClose={teachingPrompts.closePrompt}
                  onSaveLibrary={teachingLibrary.save}
                />'''
          assert old in text
          text = text.replace(old, new, 1)
          app.write_text(text)

          workspace = Path('src/teaching/TeachingWorkspace.tsx')
          text = workspace.read_text()
          text = text.replace("import { useMemo, useState } from 'react'", "import { useEffect, useMemo, useState } from 'react'", 1)
          marker = "  const [dismissedPromptId, setDismissedPromptId] = useState<string | null>(null)\n\n  if (role !== 'candidate'"
          replacement = "  const [dismissedPromptId, setDismissedPromptId] = useState<string | null>(null)\n\n  useEffect(() => {\n    setSelectedOptionId('')\n    setDismissedPromptId(null)\n  }, [prompt?.id])\n\n  if (role !== 'candidate'"
          assert marker in text
          workspace.write_text(text.replace(marker, replacement, 1))

          Path('src/components/TeachingPrompts.tsx').write_text("export * from '../teaching'\n")
          old_css = Path('src/components/teaching-prompts.css')
          if old_css.exists(): old_css.unlink()
          Path('src/appVersion.ts').write_text("export const APP_VERSION = '0.82.4.0'\n")
          PY
      - name: Create Supabase migration with CLI
        run: |
          npx --yes supabase@latest migration new teaching_library_items
          MIGRATION=$(ls -t supabase/migrations/*_teaching_library_items.sql | head -1)
          cat > "$MIGRATION" <<'SQL'
          create table if not exists public.teaching_library_items (
            id uuid primary key default gen_random_uuid(),
            owner_id uuid not null references auth.users(id) on delete cascade,
            source_app text not null default 'shared',
            module text not null default 'General',
            kind text not null check (kind in ('message', 'mcq', 'poll')),
            title text,
            body text not null,
            options jsonb not null default '[]'::jsonb check (jsonb_typeof(options) = 'array'),
            correct_option_id text,
            explanation text,
            tags text[] not null default '{}'::text[],
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now()
          );

          create index if not exists teaching_library_items_owner_updated_idx
            on public.teaching_library_items(owner_id, updated_at desc);
          create index if not exists teaching_library_items_owner_module_idx
            on public.teaching_library_items(owner_id, module);

          alter table public.teaching_library_items enable row level security;

          revoke all on public.teaching_library_items from anon;
          grant select, insert, update, delete on public.teaching_library_items to authenticated;

          create policy "Teaching authors can read own library"
            on public.teaching_library_items for select
            to authenticated
            using ((select auth.uid()) = owner_id);

          create policy "Teaching authors can create own library items"
            on public.teaching_library_items for insert
            to authenticated
            with check ((select auth.uid()) = owner_id);

          create policy "Teaching authors can update own library"
            on public.teaching_library_items for update
            to authenticated
            using ((select auth.uid()) = owner_id)
            with check ((select auth.uid()) = owner_id);

          create policy "Teaching authors can delete own library"
            on public.teaching_library_items for delete
            to authenticated
            using ((select auth.uid()) = owner_id);
          SQL
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit verified implementation
        run: |
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add src supabase/migrations
          git commit -m "feat: modular teaching workspace and saved question library"
          git push origin HEAD:chatgpt/v0.82.4-modular-teaching-library

# trigger 2
