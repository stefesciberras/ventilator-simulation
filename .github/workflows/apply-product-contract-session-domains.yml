name: Apply product contract session domains

on:
  push:
    branches: [refactor/product-contract-session-domains]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/product-contract-session-domains
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/apply-product-contract-session-domains.py
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/teaching/session/SharedSessionModePanel.tsx src/teaching/session/index.ts src/eduvent/EduventSessionPanel.tsx src/edumon/EdumonApp.tsx src/appVersion.ts src/edumon/appVersion.ts
          git commit -m "Adopt functional product contracts for session domains" || true
          git push origin HEAD:refactor/product-contract-session-domains
