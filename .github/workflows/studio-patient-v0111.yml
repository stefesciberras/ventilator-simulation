name: Studio patient v0.11.1

on:
  push:
    branches: [chatgpt/studio-v0.11.1-complete-profile-parameters]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/studio-v0.11.1-complete-profile-parameters
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/apply-studio-patient-v0111.py
      - run: npm ci
      - run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add src
          git commit -m "LoppjuSIM-Studio v0.11.1 complete Patient editor" || exit 0
          git push
