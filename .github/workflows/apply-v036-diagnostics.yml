name: Apply v0.36 diagnostic export
on:
  push:
    branches: [chatgpt/v0.36-diagnostics]
    paths: [.github/workflows/apply-v036-diagnostics.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.36-diagnostics
      - name: Apply source changes
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.tsx')
          text = p.read_text()

          old_import = "import { advanceSimulation, calculateMeasurements, createSimulationState } from './simulation/engine'\n"
          new_import = old_import + "import { copyDiagnosticSnapshot } from './diagnostics'\n"
          if old_import not in text:
              raise SystemExit('import marker not found')
          text = text.replace(old_import, new_import, 1)

          old_state = "  const [alarmOnsets, setAlarmOnsets] = useState<{ apnea: number | null; pressure: number | null }>({ apnea: null, pressure: null })\n"
          new_state = old_state + "  const [diagnosticCopied, setDiagnosticCopied] = useState(false)\n"
          if old_state not in text:
              raise SystemExit('state marker not found')
          text = text.replace(old_state, new_state, 1)

          marker = "\n  const resetVentilator = () => setVentilator({ ...initialVentilator })\n"
          handler = "\n".join([
              "  const copyDiagnostics = async () => {",
              "    const copied = await copyDiagnosticSnapshot({",
              "      appVersion: '0.36',",
              "      simulation: { time: currentSimulationTime, paused: frozen, activeMode, oxygenBoost, nebuliser, alarmSilenced },",
              "      settings: {",
              "        ventilator,",
              "        effectiveVentilator,",
              "        patientTarget: patient,",
              "        patientEffective: effectivePatientRef.current,",
              "        patientTransitionSeconds,",
              "        patientTransition: patientTransitionRef.current,",
              "        alarmLimits,",
              "        waveformDisplay,",
              "      },",
              "      alarms: { apneaActive: apneaAlarmActive, highPressureActive: pressureAlarmActive, level: alarmLevel, labels: alarmLabels, onsets: alarmOnsets },",
              "      measurements: {",
              "        peakPressureCmH2O: eventMeasures.peakPressure,",
              "        expiredTidalVolumeMl: eventMeasures.tidalVolume,",
              "        respiratoryRatePerMin: eventMeasures.respiratoryRate,",
              "        peepCmH2O: measures.peep,",
              "        meanPressureCmH2O: measures.meanPressure,",
              "        minuteVentilationLMin: measures.minuteVentilation,",
              "        endTidalCo2MmHg: endTidalCO2,",
              "        measuredIERatio,",
              "        totalPeepCmH2O: measures.totalPeep,",
              "        autoPeepCmH2O: measures.autoPeep,",
              "      },",
              "      cursor: { index: traceCursor, selectedSample: selectedSample ?? null },",
              "    }, samples, frozen && frozenSamples ? 'frozen' : 'live', DT)",
              "    setDiagnosticCopied(copied)",
              "    if (copied) window.setTimeout(() => setDiagnosticCopied(false), 1800)",
              "  }",
              "",
          ])
          if marker not in text:
              raise SystemExit('reset marker not found')
          text = text.replace(marker, "\n" + handler + marker, 1)

          old_button = "            <button className={`hardware-button icon-button alarm-button alarm-silence-bottom ${alarmSilenced ? 'active' : ''}`} onClick={silenceAlarm} title=\"Silence alarm sound for 2 minutes\" aria-label=\"Silence alarm sound for 2 minutes\"><AlarmSilenceIcon /></button>\n"
          new_button = "            <button className={`hardware-button diagnostic-button ${diagnosticCopied ? 'active blue' : ''}`} onClick={copyDiagnostics} title=\"Copy current settings and visible raw waveform as diagnostic JSON\" aria-label=\"Copy diagnostic JSON\">{diagnosticCopied ? 'Copied' : 'Diagnostic'}</button>\n" + old_button
          if old_button not in text:
              raise SystemExit('alarm button marker not found')
          text = text.replace(old_button, new_button, 1)

          old_version = '<span className="version">v0.35</span>'
          if old_version not in text:
              raise SystemExit('version marker not found')
          text = text.replace(old_version, '<span className="version">v0.36</span>', 1)
          p.write_text(text)

      - name: Install
        run: npm install --no-package-lock
      - name: Build
        run: npm run build
      - name: Commit v0.36
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/diagnostics.ts
          git commit -m "v0.36: add diagnostic JSON waveform export"
          git push origin HEAD:chatgpt/v0.36-diagnostics
