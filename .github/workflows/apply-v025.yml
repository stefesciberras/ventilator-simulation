name: Apply v0.25 BIPAP synchronization

on:
  push:
    branches:
      - chatgpt/v0.25-bipap-sync
    paths:
      - .github/workflows/apply-v025.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.25-bipap-sync
      - name: Apply source patch
        run: python3 scripts/apply_v025.py
      - name: Install
        run: npm install --no-package-lock
      - name: Build
        run: npm run build
      - name: Commit v0.25
        run: |
          rm .github/workflows/apply-v025.yml scripts/apply_v025.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.25: synchronize BIPAP timing and revise controls"
          git push origin HEAD:chatgpt/v0.25-bipap-sync
