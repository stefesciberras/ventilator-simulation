name: Fix v0.71 VTe hyphen

on:
  push:
    branches:
      - chatgpt/v0.71-apnea-alarm-vte

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.71-apnea-alarm-vte
          fetch-depth: 0
      - name: Use literal hyphen for unavailable VTe
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          old = "<Metric label=\"VTe\" value={tidalVolumeDisplayAvailable ? eventMeasures.tidalVolume.toFixed(0) : '—'} unit={tidalVolumeDisplayAvailable ? 'mL' : ''} />"
          new = "<Metric label=\"VTe\" value={tidalVolumeDisplayAvailable ? eventMeasures.tidalVolume.toFixed(0) : '-'} unit={tidalVolumeDisplayAvailable ? 'mL' : ''} />"
          if old not in s:
              raise SystemExit('VTe em dash anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npm ci
      - run: npm run build
      - name: Remove temporary workflow
        run: rm -f .github/workflows/v071_hyphen_fix.yml
      - name: Restore generated TypeScript build cache
        run: git checkout -- tsconfig.app.tsbuildinfo 2>/dev/null || true
      - name: Commit
        run: |
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add -A
          git commit -m "v0.71 Use hyphen for unavailable VTe"
          git push origin HEAD:chatgpt/v0.71-apnea-alarm-vte
