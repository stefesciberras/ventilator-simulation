name: Apply v0.53 instructor accounts

on:
  push:
    branches:
      - chatgpt/v0.53-instructor-accounts-presets
    paths:
      - scripts/v053_patch.py
      - .github/workflows/v053_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.53-instructor-accounts-presets
      - name: Apply source patch
        run: python3 scripts/v053_patch.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Remove temporary patch harness
        run: rm -f scripts/v053_patch.py .github/workflows/v053_patch.yml
      - name: Commit patched sources
        run: |
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add instructor cloud accounts and scenario presets"
          git push origin HEAD:chatgpt/v0.53-instructor-accounts-presets
