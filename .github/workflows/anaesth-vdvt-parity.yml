name: Anaesth VDVT parity
on:
  push:
    branches: [chatgpt/anaesth-vdvt-parity]
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/anaesth-vdvt-parity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/apply-anaesth-vdvt-parity.py
      - run: npm ci
      - run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/edumon/EdumonWorkspacePanel.tsx
          git commit -m "Use VDVT in Anaesth physiology controls"
          git push
