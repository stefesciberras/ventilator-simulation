name: Apply v0.28 Pes cardiac Ptp

on:
  push:
    branches:
      - chatgpt/v0.28-pes-cardiac-ptp

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.28-pes-cardiac-ptp
      - name: Apply source patch
        run: python .github/v028_patch.py
      - name: Install
        run: npm install --no-package-lock
      - name: Build
        run: npm run build
      - name: Commit v0.28
        run: |
          rm -f .github/v028_patch.py .github/workflows/apply-v028.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github
          git commit -m "v0.28: add Pes cardiac oscillations and Ptp readout"
          git push origin HEAD:chatgpt/v0.28-pes-cardiac-ptp
