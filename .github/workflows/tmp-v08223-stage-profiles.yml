name: Temporary v0.82.2.3 stage profiles
on:
  push:
    branches: [chatgpt/v0.82.2.3-stage-profiles]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.82.2.3-stage-profiles
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply stage patient profile templates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/DynamicScenarioBuilder.tsx')
          s = p.read_text()
          s = s.replace("import { calculatePredictedBodyWeight } from '../patientMetrics'\n", "import { calculatePredictedBodyWeight } from '../patientMetrics'\nimport { ARDS_PROFILES, ARDS_SEVERITIES, PATIENT_PROFILES, PATIENT_PROFILE_NAMES, patientMatchesProfile, type ArdsSeverity, type PatientProfileName } from '../patientProfiles'\n")
          s = s.replace("type StageDraft = DynamicScenarioStage & { sourcePresetId?: string }", "type StageDraft = DynamicScenarioStage & { sourcePresetId?: string; patientProfile?: PatientProfileName; ardsSeverity?: ArdsSeverity }")
          marker = "function defaultMask(snapshot: InstructorScenarioSnapshot): DynamicScenarioApplyMask {\n"
          helper = '''function inferPatientTemplate(patient: PatientSettings): { profile: PatientProfileName; ardsSeverity?: ArdsSeverity } | null {\n  for (const severity of ARDS_SEVERITIES) {\n    if (patientMatchesProfile(patient, ARDS_PROFILES[severity])) return { profile: 'ARDS', ardsSeverity: severity }\n  }\n  for (const profile of PATIENT_PROFILE_NAMES) {\n    if (profile === 'ARDS') continue\n    if (patientMatchesProfile(patient, PATIENT_PROFILES[profile])) return { profile }\n  }\n  return null\n}\n\nfunction selectedPatientTemplate(stage: StageDraft): { profile: PatientProfileName; ardsSeverity?: ArdsSeverity } | null {\n  if (stage.patientProfile) return { profile: stage.patientProfile, ardsSeverity: stage.ardsSeverity }\n  return inferPatientTemplate(stage.snapshot.patient)\n}\n\n'''
          if helper not in s:
              s = s.replace(marker, helper + marker)
          old = """  return {\n    ...cloneScenario(stage),\n    name: stage.name || `Stage ${index + 1}`,\n    advanceTrigger: stage.advanceTrigger ?? defaultAdvanceTrigger(),\n    apply: {\n"""
          new = """  const cloned = cloneScenario(stage) as StageDraft\n  const inferredTemplate = selectedPatientTemplate({ ...cloned, snapshot })\n  return {\n    ...cloned,\n    name: stage.name || `Stage ${index + 1}`,\n    patientProfile: cloned.patientProfile ?? inferredTemplate?.profile,\n    ardsSeverity: cloned.ardsSeverity ?? inferredTemplate?.ardsSeverity,\n    advanceTrigger: stage.advanceTrigger ?? defaultAdvanceTrigger(),\n    apply: {\n"""
          if old not in s: raise SystemExit('normaliseStage pattern not found')
          s = s.replace(old, new)
          old = """function newStage(base: InstructorScenarioSnapshot, index: number): StageDraft {\n  const snapshot = normalisePhysiologyDefaults(asStaticScenario(cloneScenario(base), ''))\n  return {\n    name: `Stage ${index + 1}`,\n    snapshot,\n"""
          new = """function newStage(base: InstructorScenarioSnapshot, index: number): StageDraft {\n  const snapshot = normalisePhysiologyDefaults(asStaticScenario(cloneScenario(base), ''))\n  const inferredTemplate = inferPatientTemplate(snapshot.patient)\n  return {\n    name: `Stage ${index + 1}`,\n    snapshot,\n    patientProfile: inferredTemplate?.profile,\n    ardsSeverity: inferredTemplate?.ardsSeverity,\n"""
          if old not in s: raise SystemExit('newStage pattern not found')
          s = s.replace(old, new)
          old = """    updateStage(index, (stage) => ({\n      ...stage,\n      snapshot,\n      apply: defaultMask(snapshot),\n      sourcePresetId: preset.id,\n      sourceName: preset.name,\n    }))\n"""
          new = """    const inferredTemplate = inferPatientTemplate(snapshot.patient)\n    updateStage(index, (stage) => ({\n      ...stage,\n      snapshot,\n      apply: defaultMask(snapshot),\n      sourcePresetId: preset.id,\n      sourceName: preset.name,\n      patientProfile: inferredTemplate?.profile,\n      ardsSeverity: inferredTemplate?.ardsSeverity,\n    }))\n"""
          if old not in s: raise SystemExit('selectStageSource pattern not found')
          s = s.replace(old, new)
          marker2 = "  const toggleField = (\n"
          func = '''  const applyStagePatientProfile = (index: number, profile: PatientProfileName) => {\n    updateStage(index, (stage) => {\n      let patient: PatientSettings\n      let ardsSeverity: ArdsSeverity | undefined\n\n      if (profile === 'ARDS') {\n        const selected = selectedPatientTemplate(stage)\n        if (selected?.profile === 'ARDS' && selected.ardsSeverity) {\n          const currentIndex = ARDS_SEVERITIES.indexOf(selected.ardsSeverity)\n          ardsSeverity = ARDS_SEVERITIES[(currentIndex + 1) % ARDS_SEVERITIES.length]\n        } else {\n          ardsSeverity = 'mild'\n        }\n        patient = { ...ARDS_PROFILES[ardsSeverity] }\n      } else {\n        patient = { ...PATIENT_PROFILES[profile] }\n      }\n\n      const apply = stage.apply ?? defaultMask(stage.snapshot)\n      return {\n        ...stage,\n        sourcePresetId: undefined,\n        sourceName: `Patient profile: ${profile}${ardsSeverity ? ` · ${ardsSeverity}` : ''}`,\n        patientProfile: profile,\n        ardsSeverity,\n        snapshot: { ...stage.snapshot, patient },\n        apply: { ...apply, patient: [...PATIENT_KEYS] },\n      }\n    })\n  }\n\n'''
          if func not in s:
              s = s.replace(marker2, func + marker2)
          old = """                  <div className=\"dynamic-control-columns\">\n"""
          new = """                  <div className=\"dynamic-stage-profile-strip\" role=\"group\" aria-label={`Stage ${index + 1} patient profiles`}>\n                    {PATIENT_PROFILE_NAMES.map((profile) => {\n                      const selectedTemplate = selectedPatientTemplate(stage)\n                      const selected = selectedTemplate?.profile === profile\n                      const selectedProfile = profile === 'ARDS'\n                        ? (selectedTemplate?.ardsSeverity ? ARDS_PROFILES[selectedTemplate.ardsSeverity] : ARDS_PROFILES.mild)\n                        : PATIENT_PROFILES[profile]\n                      const modified = selected && !patientMatchesProfile(stage.snapshot.patient, selectedProfile)\n                      const label = profile === 'ARDS' && selected && selectedTemplate?.ardsSeverity\n                        ? `ARDS · ${selectedTemplate.ardsSeverity[0].toUpperCase() + selectedTemplate.ardsSeverity.slice(1)}`\n                        : profile\n                      return (\n                        <button\n                          type=\"button\"\n                          key={profile}\n                          className={selected ? (modified ? 'profile-modified' : 'profile-selected') : ''}\n                          aria-pressed={selected}\n                          title={profile === 'ARDS'\n                            ? (selected && selectedTemplate?.ardsSeverity\n                              ? `ARDS ${selectedTemplate.ardsSeverity} · click for ${ARDS_SEVERITIES[(ARDS_SEVERITIES.indexOf(selectedTemplate.ardsSeverity) + 1) % ARDS_SEVERITIES.length]}`\n                              : 'Apply mild ARDS profile')\n                            : selected && modified ? `${profile} template selected · settings modified` : `Apply ${profile} profile template`}\n                          onClick={() => applyStagePatientProfile(index, profile)}\n                        >\n                          {label}\n                        </button>\n                      )\n                    })}\n                  </div>\n\n                  <div className=\"dynamic-control-columns\">\n"""
          if old not in s: raise SystemExit('control columns marker not found')
          s = s.replace(old, new)
          p.write_text(s)
          css = Path('src/components/DynamicScenarioBuilder.css')
          c = css.read_text()
          add = '''\n/* v0.82.2.3 per-stage patient profile templates */\n.dynamic-stage-profile-strip {\n  display: grid;\n  grid-template-columns: repeat(5, minmax(0, 1fr));\n  gap: 6px;\n  margin-top: 12px;\n}\n\n.dynamic-stage-profile-strip button {\n  min-height: 34px;\n  padding: 6px 8px;\n  border: 1px solid #43535b;\n  border-radius: 0;\n  background: #252c30;\n  color: #b7c2c7;\n  font-size: 10px;\n  font-weight: 750;\n}\n\n.dynamic-stage-profile-strip button.profile-selected {\n  border-color: #73b986;\n  background: #1d4930;\n  color: #e3f7e9;\n}\n\n.dynamic-stage-profile-strip button.profile-modified {\n  border-color: #c28a42;\n  background: #5a3d18;\n  color: #ffe8c6;\n}\n'''
          if add.strip() not in c:
              c += add
          css.write_text(c)
          v = Path('src/appVersion.ts')
          v.write_text(v.read_text().replace("0.82.2.2", "0.82.2.3"))
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit product changes and remove temporary workflow
        run: |
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          rm .github/workflows/tmp-v08223-stage-profiles.yml
          git add src/components/DynamicScenarioBuilder.tsx src/components/DynamicScenarioBuilder.css src/appVersion.ts .github/workflows/tmp-v08223-stage-profiles.yml
          git commit -m "v0.82.2.3 add patient profile templates to scenario stages"
          git push origin HEAD:chatgpt/v0.82.2.3-stage-profiles
