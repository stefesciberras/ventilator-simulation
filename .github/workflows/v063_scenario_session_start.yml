name: Build v0.63 scenario session start

on:
  push:
    branches:
      - chatgpt/v0.63-scenario-session-start

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Apply v0.63 patch
        run: python scripts/patch_v063.py
      - name: Build
        run: npm run build
      - name: Scenario-start source checks
        run: |
          grep -q "Choose starting state" src/components/SessionPanel.tsx
          grep -q "Saved scenario" src/components/SessionPanel.tsx
          grep -q "Load into standalone to adjust" src/components/SessionPanel.tsx
          grep -q "InstructorSessionInitialState" src/session/useTeachingSession.ts
          grep -q "startingTransitionSeconds" src/session/useTeachingSession.ts
          grep -q "startInstructorSession" src/App.tsx
          grep -q "v0.63" src/components/SessionPanel.tsx
      - name: Commit implementation
        run: |
          rm scripts/patch_v063.py
          rm .github/workflows/v063_scenario_session_start.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.63 Add scenario selection before instructor session"
          git push
