name: v0.80 validate

on:
  push:
    branches:
      - chatgpt/v0.80-multi-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify transport integration
        run: |
          grep -q "WebRtcRuntimeTransport" src/session/useTeachingSession.ts
          grep -q "runtimeTransportKind" src/session/useTeachingSession.ts
          grep -q "Peer-to-peer" src/components/SessionPanel.tsx
          grep -q "APP_VERSION = '0.80.0'" src/appVersion.ts
          grep -q "eduvent.local" appliance/bootstrap.sh
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
