name: Build v0.68 mode order and CO2 apnoea

on:
  push:
    branches:
      - chatgpt/v0.68-mode-order-co2-apnoea

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply patch
        run: python scripts/v068_patch.py
      - name: Build
        run: npm run build
      - name: Semantic checks
        run: |
          python - <<'PY'
          from pathlib import Path
          controls = Path('src/components/Controls.tsx').read_text()
          engine = Path('src/simulation/engine.ts').read_text()
          diag = Path('src/diagnostics.ts').read_text()
          expected = "['VC-AC', 'SIMV-VC', 'PC-AC', 'SIMV-PC', 'BIPAP', 'VG-PC', 'APRV', 'PSV']"
          assert expected in controls
          assert "riseMmHgPerMinute = 0.863 * vco2 / co2DistributionVolumeL" in engine
          assert "if (elapsedSinceInspiration > Math.max(3, expectedCycle * 2)) return 0" in engine
          assert "export const APP_VERSION = '0.68'" in diag
          PY
      - name: Remove temporary files
        run: rm -f scripts/v068_patch.py .github/workflows/v068_build.yml
      - name: Commit implementation
        run: |
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add -A
          git commit -m "v0.68 Reorder modes and fix CO2 accumulation during apnoea"
          git push
