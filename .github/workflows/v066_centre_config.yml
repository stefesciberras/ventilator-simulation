name: Build v0.66 centre config
on:
  push:
    branches: [chatgpt/v0.66-centre-supabase-settings]
jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.66-centre-supabase-settings
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply patch
        run: python scripts/patch_v066.py
      - name: Build
        run: npm run build
      - name: Semantic checks
        run: |
          grep -q "eduvent.supabase-config" src/session/supabase.ts
          grep -q "Save & reconnect" src/components/InstructorAccountControls.tsx
          grep -q "Use deployment default" src/components/InstructorAccountControls.tsx
          grep -q "v0.66" src/App.tsx
      - name: Remove temporary files
        run: rm -f scripts/patch_v066.py .github/workflows/v066_centre_config.yml
      - name: Commit implementation
        run: |
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add -A
          git commit -m "v0.66 Add centre-specific Supabase settings" || exit 0
          git push origin HEAD:chatgpt/v0.66-centre-supabase-settings
