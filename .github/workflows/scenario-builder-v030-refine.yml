name: Scenario Builder v0.3.0 refine

on:
  push:
    branches:
      - chatgpt/scenario-builder-v0.3.0-self-directed

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/scenario-builder-v0.3.0-self-directed
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply refinements
        run: node scripts/fix-v030-self-directed.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit validated refinements
        run: |
          git checkout origin/main -- tsconfig.app.tsbuildinfo || true
          rm -f scripts/fix-v030-self-directed.mjs .github/workflows/scenario-builder-v030-refine.yml
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add -A
          git commit -m "Refine v0.3 self-directed scenario runtime"
          git push origin HEAD:chatgpt/scenario-builder-v0.3.0-self-directed
