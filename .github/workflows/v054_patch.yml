name: Apply v0.54 physiology measurements

on:
  push:
    branches:
      - chatgpt/v0.54-physiology-measurements

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run v0.54 physiology patch and build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.54-physiology-measurements
          fetch-depth: 0
      - name: Apply source patch
        run: python .github/v054_patch.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Remove temporary patch harness
        run: rm .github/v054_patch.py .github/workflows/v054_patch.yml
      - name: Revert generated TypeScript build info
        run: git checkout HEAD -- tsconfig.app.tsbuildinfo || true
      - name: Commit patched sources
        run: |
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add -A
          git commit -m "Implement v0.54 patient effort and physiology measurements"
          git push origin HEAD:chatgpt/v0.54-physiology-measurements
