name: Scenario Builder v0.8.1 shared editor fix

on:
  push:
    branches: [chatgpt/fix-real-scenario-builder-v0.8.1]

permissions:
  contents: write

jobs:
  implement-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-real-scenario-builder-v0.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/fix-shared-scenario-builder-v081.py
      - run: npm ci
      - run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add src
          git commit -m "Fix standalone Scenario Builder v0.8.1" || exit 0
          git push
