name: Refactor shared alarm limits
on:
  push:
    branches: [refactor/shared-alarm-limit-editor]
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/refactor-shared-alarm-limits.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit implementation and remove temporary tooling
        run: |
          rm scripts/refactor-shared-alarm-limits.mjs .github/workflows/refactor-shared-alarm-limits.yml
          git config user.name stefesciberras
          git config user.email 43134239+stefesciberras@users.noreply.github.com
          git add -A
          git commit -m "Extract shared vertical dual-handle alarm limit editor"
          git push
