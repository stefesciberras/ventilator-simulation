name: Wire EDUVENT alarm sync
on:
  push:
    branches: [edusim/shared-instructor-teaching-semantics]
    paths:
      - 'scripts/wire_eduvent_alarm_sync.py'
      - '.github/workflows/wire-eduvent-alarm-sync.yml'
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edusim/shared-instructor-teaching-semantics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/wire_eduvent_alarm_sync.py
      - run: npm ci
      - run: npm run build
      - name: Commit and remove temporary tooling
        run: |
          rm scripts/wire_eduvent_alarm_sync.py .github/workflows/wire-eduvent-alarm-sync.yml
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize instructor alarm silence through EDUSIM core"
          git push origin HEAD:edusim/shared-instructor-teaching-semantics
