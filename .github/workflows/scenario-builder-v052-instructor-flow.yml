name: Scenario Builder v0.5.2 instructor flow

on:
  push:
    branches: [chatgpt/scenario-builder-v0.5.2-instructor-flow]

permissions:
  contents: write

jobs:
  implement-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/scenario-builder-v0.5.2-instructor-flow
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/apply-v052-state.py
      - run: python3 scripts/apply-v052-flow-ui.py
      - run: python3 scripts/apply-v052-flow-style.py
      - run: npm ci
      - run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add src
          git commit -m "Implement Scenario Builder v0.5.2 instructor flow navigation"
          git push
