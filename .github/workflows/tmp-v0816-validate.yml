name: Temporary v0.81.6 PEEP validation

on:
  push:
    branches:
      - chatgpt/v0.81.6-peep-alveolar-measurements

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.81.6-peep-alveolar-measurements
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply v0.81.6 fixes
        run: |
          python .github/tmp_v0816_patch.py
          npm ci
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/appVersion.ts src/components/PhysiologyMeasurementsDialog.tsx src/physiologyMeasurements.ts
          git commit -m "Implement v0.81.6 live PEEP and alveolar ventilation fixes"
          git push
      - name: Validate committed tree
        run: npm run build
