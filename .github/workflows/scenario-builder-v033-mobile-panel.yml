name: Scenario Builder v0.3.3 compact movable panel

on:
  push:
    branches:
      - chatgpt/scenario-builder-v0.3.3-compact-movable-panel

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/scenario-builder-v0.3.3-compact-movable-panel
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch candidate scenario panel
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/InstructorAccountControls.tsx')
          s = p.read_text()

          anchor = "  const [selfDirectedError, setSelfDirectedError] = useState<string | null>(null)\n"
          addition = anchor + "  const [selfDirectedPanelPosition, setSelfDirectedPanelPosition] = useState({ x: 0, y: 0 })\n  const selfDirectedPanelDragRef = useRef<{ pointerId: number; startX: number; startY: number; originX: number; originY: number; baseLeft: number; baseTop: number; width: number; height: number } | null>(null)\n"
          if 'selfDirectedPanelPosition' not in s:
              if anchor not in s: raise SystemExit('state anchor not found')
              s = s.replace(anchor, addition, 1)

          start = s.index('      {selfDirectedRun && activeRuntimePreset && createPortal((() => {')
          end = s.index('      {runtimeHost && selfDirectedError', start)
          new_block = '''      {selfDirectedRun && activeRuntimePreset && createPortal((() => {
        const stages = activeRuntimePreset.scenario.stages ?? []
        const index = Math.min(activeDynamicStage, Math.max(0, stages.length - 1))
        const stage = stages[index]
        const triggers: DynamicScenarioTrigger[] = stage ? dynamicStageTriggers(stage) : [{ type: 'manual' }]
        const completed = index >= stages.length - 1
        const manualTrigger = !completed && triggers.some((trigger) => trigger.type === 'manual')
        const exitSelfDirectedScenario = () => {
          setSelfDirectedRun(null)
          setActiveDynamicId(null)
          setActiveDynamicStage(0)
          setSelfDirectedPanelPosition({ x: 0, y: 0 })
          const url = new URL(window.location.href)
          url.searchParams.delete('assignment')
          window.history.replaceState({}, '', `${url.pathname}${url.search}${url.hash}`)
          setPresetMessage('Self-directed scenario closed.')
        }
        const startPanelDrag = (event: React.PointerEvent<HTMLDivElement>) => {
          if ((event.target as HTMLElement).closest('button')) return
          const panel = event.currentTarget.closest('.self-directed-scenario-modal') as HTMLElement | null
          if (!panel) return
          const rect = panel.getBoundingClientRect()
          selfDirectedPanelDragRef.current = {
            pointerId: event.pointerId,
            startX: event.clientX,
            startY: event.clientY,
            originX: selfDirectedPanelPosition.x,
            originY: selfDirectedPanelPosition.y,
            baseLeft: rect.left - selfDirectedPanelPosition.x,
            baseTop: rect.top - selfDirectedPanelPosition.y,
            width: rect.width,
            height: rect.height,
          }
          event.currentTarget.setPointerCapture?.(event.pointerId)
          event.preventDefault()
        }
        const movePanelDrag = (event: React.PointerEvent<HTMLDivElement>) => {
          const drag = selfDirectedPanelDragRef.current
          if (!drag || drag.pointerId !== event.pointerId) return
          const margin = 8
          const x = drag.originX + event.clientX - drag.startX
          const y = drag.originY + event.clientY - drag.startY
          setSelfDirectedPanelPosition({
            x: Math.max(margin - drag.baseLeft, Math.min(window.innerWidth - margin - drag.baseLeft - drag.width, x)),
            y: Math.max(margin - drag.baseTop, Math.min(window.innerHeight - margin - drag.baseTop - drag.height, y)),
          })
          event.preventDefault()
        }
        const endPanelDrag = (event: React.PointerEvent<HTMLDivElement>) => {
          if (selfDirectedPanelDragRef.current?.pointerId === event.pointerId) selfDirectedPanelDragRef.current = null
          if (event.currentTarget.hasPointerCapture?.(event.pointerId)) event.currentTarget.releasePointerCapture?.(event.pointerId)
        }
        return <div className="teaching-media-overlay self-directed-scenario-overlay" role="presentation">
          <section className="teaching-media-modal self-directed-scenario-modal" role="dialog" aria-modal="false" aria-label="Active scenario" style={{ transform: `translate(${selfDirectedPanelPosition.x}px, ${selfDirectedPanelPosition.y}px)` }}>
            <div className="teaching-media-header self-directed-scenario-header" onPointerDown={startPanelDrag} onPointerMove={movePanelDrag} onPointerUp={endPanelDrag} onPointerCancel={endPanelDrag} title="Drag to move">
              <div><span>Active scenario</span></div>
              <button type="button" onClick={exitSelfDirectedScenario}>Exit</button>
            </div>
            <div className="self-directed-scenario-body">
              {completed ? (
                <div className="self-directed-scenario-status complete"><strong>Scenario complete</strong><span>You have reached the end of this scenario.</span></div>
              ) : manualTrigger ? (
                <button type="button" className="self-directed-scenario-continue" onClick={() => loadDynamicStage(activeRuntimePreset, index + 1)}>Continue</button>
              ) : (
                <div className="self-directed-scenario-status"><strong>Scenario active</strong><span>Continue working with the simulator.</span></div>
              )}
            </div>
          </section>
        </div>
      })(), document.body)}
'''
          s = s[:start] + new_block + s[end:]
          p.write_text(s)

          css = Path('src/account.css')
          c = css.read_text()
          c += '''\n\n/* Scenario Builder v0.3.3 compact movable self-directed panel */
.self-directed-scenario-overlay { z-index: 4998; }
.self-directed-scenario-modal {
  width: min(360px, 25vw);
  max-width: calc(100vw - 16px);
}
.self-directed-scenario-header {
  min-height: 44px;
  cursor: grab;
  user-select: none;
  touch-action: none;
}
.self-directed-scenario-header:active { cursor: grabbing; }
.self-directed-scenario-header > div { display: grid; gap: 2px; min-width: 0; }
.self-directed-scenario-body { padding: 12px; background: #071014; }
.self-directed-scenario-continue {
  width: 100%; min-height: 42px; border: 0; border-radius: 8px;
  background: #ef8a27; color: #111; font-size: .95rem; font-weight: 800; cursor: pointer;
}
.self-directed-scenario-status { display: grid; gap: 4px; padding: 2px; }
.self-directed-scenario-status strong { color: #eef5f7; font-size: .88rem; }
.self-directed-scenario-status span { color: #9dafb7; font-size: .76rem; line-height: 1.35; }
.self-directed-scenario-status.complete strong { color: #9ee9b3; }
@media (min-width: 641px) and (max-width: 1199px) {
  .self-directed-scenario-modal { width: 25vw; min-width: 220px; }
}
@media (max-width: 640px) {
  .self-directed-scenario-modal { width: min(88vw, 320px); right: 8px; bottom: auto; top: 74px; border: 2px solid #ef8a27; border-radius: 16px; }
}
'''
          css.write_text(c)

          v = Path('src/scenario-builder/version.ts')
          v.write_text(v.read_text().replace("SCENARIO_BUILDER_VERSION = '0.3.2'", "SCENARIO_BUILDER_VERSION = '0.3.3'"))
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit validated changes
        run: |
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add src/components/InstructorAccountControls.tsx src/account.css src/scenario-builder/version.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Scenario Builder v0.3.3 compact movable candidate panel"
          git push origin HEAD:chatgpt/scenario-builder-v0.3.3-compact-movable-panel
