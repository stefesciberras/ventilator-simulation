name: Validate v0.29 waveform autoscale

on:
  push:
    branches:
      - chatgpt/v0.28-waveform-autoscale

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.28-waveform-autoscale
      - name: Bump version
        run: sed -i 's/<span className="version">v0\.28<\//<span className="version">v0.29<\//' src/App.tsx
      - name: Install
        run: npm install --no-package-lock
      - name: Build
        run: npm run build
      - name: Commit validated change
        run: |
          rm -f .github/workflows/validate-v029-autoscale.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/validate-v029-autoscale.yml
          git commit -m "v0.29: validate waveform autoscaling"
          git push origin HEAD:chatgpt/v0.28-waveform-autoscale
