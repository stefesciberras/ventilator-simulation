name: Studio v0.11.4 module routing and style
on:
  push:
    branches: [chatgpt/studio-v0.11.4-module-routing-style]
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/studio-v0.11.4-module-routing-style
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/apply-studio-v0114-module-routing-style.py
      - run: npm ci
      - run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scenario-builder/ScenarioBuilderApp.tsx src/components/LoppjuSimPlatformMenu.tsx src/scenario-builder/modules/ventilator/definition.ts src/scenario-builder/scenarioBuilder.css src/teaching/instructor/InstructorScenarioLibraryController.tsx src/scenario-builder/version.ts
          git commit -m "LoppjuSIM-Studio v0.11.4 align modules and routing"
          git push
