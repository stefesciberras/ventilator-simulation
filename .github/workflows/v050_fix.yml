name: Finalize v0.50 join permission fix

on:
  push:
    branches:
      - chatgpt/v0.50-waveform-permissions-live-room-layout

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Finalize v0.50 join permission fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.50-waveform-permissions-live-room-layout
          fetch-depth: 0
      - name: Apply edge-case fix
        run: python3 scripts/v050_fix_join_default.py
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Remove temporary patch harness
        run: |
          rm scripts/v050_fix_join_default.py
          rm .github/workflows/v050_fix.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize v0.50 join permission fix"
          git push origin HEAD:chatgpt/v0.50-waveform-permissions-live-room-layout
