name: Scenario Builder v0.4 recovery build

on:
  push:
    branches:
      - chatgpt/scenario-builder-v0.4.0-stage-content

permissions:
  contents: write

jobs:
  recover-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/scenario-builder-v0.4.0-stage-content
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply staged v0.4 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/scenario-builder-v040-stage-content.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          code_lines = workflow[start:end]
          indents = [len(line) - len(line.lstrip()) for line in code_lines if line.strip()]
          trim = min(indents) if indents else 0
          code = '\n'.join(line[trim:] for line in code_lines)
          exec(compile(code, '<v040-patch>', 'exec'), {})

          p = Path('src/components/DynamicScenarioBuilder.tsx')
          s = p.read_text()
          s = s.replace(
              "question: { libraryItemId: item.id, kind: item.kind, title: item.title, body: item.body, options: item.options, correctOptionId: item.correct_option_id, explanation: item.explanation },",
              "question: { libraryItemId: item.id, kind: item.kind as 'mcq' | 'poll', title: item.title, body: item.body, options: item.options, correctOptionId: item.correct_option_id, explanation: item.explanation },"
          )
          p.write_text(s)

          p = Path('src/components/InstructorAccountControls.tsx')
          s = p.read_text()
          anchor = "  const [selfDirectedError, setSelfDirectedError] = useState<string | null>(null)\n"
          if 'const [selfDirectedPanelPosition' not in s:
              addition = anchor + "  const [selfDirectedPanelPosition, setSelfDirectedPanelPosition] = useState({ x: 0, y: 0 })\n  const selfDirectedPanelDragRef = useRef<{ pointerId: number; startX: number; startY: number; originX: number; originY: number; baseLeft: number; baseTop: number; width: number; height: number } | null>(null)\n"
              if anchor not in s: raise SystemExit('self-directed panel state anchor not found')
              s = s.replace(anchor, addition, 1)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit validated implementation
        run: |
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add src/instructorAccount.ts src/components/DynamicScenarioBuilder.tsx src/components/DynamicScenarioBuilder.css src/components/InstructorAccountControls.tsx src/account.css src/selfDirectedAssignments.ts src/App.tsx src/scenario-builder/version.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Scenario Builder v0.4.0 stage media and questions"
          git push origin HEAD:chatgpt/scenario-builder-v0.4.0-stage-content
