name: v0.73 candidate invitations

on:
  push:
    branches:
      - chatgpt/v0.73-candidate-invitations

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.73-candidate-invitations
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply v0.73 patch
        run: python3 scripts/patch_v073.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit generated patch
        run: |
          if git diff --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SessionPanel.tsx
          git commit -m "v0.73 Wire candidate invitations into instructor dashboard"
          git push origin HEAD:chatgpt/v0.73-candidate-invitations
