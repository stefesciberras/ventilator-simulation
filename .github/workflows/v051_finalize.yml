name: Finalize v0.51 AutoFlow safety

on:
  push:
    branches:
      - chatgpt/v0.51-vc-timing-autoflow
    paths:
      - scripts/v051_finalize.py
      - .github/workflows/v051_finalize.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.51-vc-timing-autoflow
          fetch-depth: 0
      - name: Apply safety patch
        run: python scripts/v051_finalize.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Remove temporary harness
        run: |
          rm scripts/v051_finalize.py
          rm .github/workflows/v051_finalize.yml
          git checkout -- tsconfig.app.tsbuildinfo || true
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize v0.51 AutoFlow safety" || exit 0
          git push origin HEAD:chatgpt/v0.51-vc-timing-autoflow
