name: Verify v0.82.5 laser pointer

on:
  push:
    branches:
      - chatgpt/v0.82.5-teaching-laser-pointer
    paths:
      - .github/workflows/verify-v0825.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.82.5-teaching-laser-pointer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/apply_laser_pointer_patch.py
      - run: npm ci
      - run: npm run build
      - name: Commit verified implementation
        run: |
          rm -f .github/workflows/verify-v0825.yml .github/workflows/v0.82.5-teaching-laser-pointer.yml scripts/apply_laser_pointer_patch.py
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add -A
          git commit -m "feat: add reusable live teaching laser pointer"
          git push origin HEAD:chatgpt/v0.82.5-teaching-laser-pointer
