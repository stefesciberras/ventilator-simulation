name: Scenario Builder v0.4 final validation

on:
  push:
    branches:
      - chatgpt/scenario-builder-v0.4.0-stage-content

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/scenario-builder-v0.4.0-stage-content
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Final schema cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/DynamicScenarioBuilder.tsx')
          s = p.read_text()
          s = s.replace("const scenario: InstructorScenarioSnapshot = { ...cloneScenario(parsed.scenario), schemaVersion: 5, kind: 'dynamic'", "const scenario: InstructorScenarioSnapshot = { ...cloneScenario(parsed.scenario), schemaVersion: 6, kind: 'dynamic'")
          old = "      const trigger: DynamicScenarioTrigger = { type: 'manual' }\n      return { ...stage, stageType, question: undefined, advanceTrigger: trigger, advanceTriggers: [trigger] }\n"
          new = "      const trigger: DynamicScenarioTrigger = { type: 'manual' }\n      return stageType === 'controls'\n        ? { ...stage, stageType, media: undefined, question: undefined, advanceTrigger: trigger, advanceTriggers: [trigger] }\n        : { ...stage, stageType, question: undefined, advanceTrigger: trigger, advanceTriggers: [trigger] }\n"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit final cleanup
        run: |
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add src/components/DynamicScenarioBuilder.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finalize Scenario Builder v0.4 schema handling"
          git push origin HEAD:chatgpt/scenario-builder-v0.4.0-stage-content
