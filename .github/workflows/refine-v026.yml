name: Refine v0.26 ineffective triggering

on:
  push:
    branches:
      - chatgpt/v0.26-autopeep-ineffective-trigger

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.26-autopeep-ineffective-trigger
      - name: Refine trigger model
        run: python3 scripts/refine-v026.py
      - name: Install
        run: npm install --no-package-lock
      - name: Build
        run: npm run build
      - name: Commit refinement
        run: |
          rm scripts/refine-v026.py
          rm .github/workflows/refine-v026.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine auto-PEEP ineffective trigger gating"
          git push origin HEAD:chatgpt/v0.26-autopeep-ineffective-trigger
