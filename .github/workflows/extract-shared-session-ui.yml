name: Extract shared session UI

on:
  push:
    branches:
      - edusim/shared-session-testing-shell

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edusim/shared-session-testing-shell
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply refactor
        run: node scripts/extract-shared-session-ui.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit refactor and remove temporary tooling
        run: |
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git rm scripts/extract-shared-session-ui.mjs .github/workflows/extract-shared-session-ui.yml
          git add -A
          git commit -m "Extract shared session testing UI"
          git push origin HEAD:edusim/shared-session-testing-shell
