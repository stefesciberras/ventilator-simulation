name: Scenario Builder v0.5.1 stage order

on:
  push:
    branches: [chatgpt/scenario-builder-v0.5.1-stage-order]

permissions:
  contents: write

jobs:
  implement-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/scenario-builder-v0.5.1-stage-order
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply stage ordering implementation
        run: python3 scripts/apply-v051-stage-order.py
      - run: npm ci
      - run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add src
          git commit -m "Implement Scenario Builder v0.5.1 stage ordering"
          git push
