name: Build v0.59 instructor QR and lung marker

'on':
  push:
    branches:
      - chatgpt/v0.59-instructor-qr

jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add QR dependency
        run: npm install qrcode.react@latest --save
      - name: Apply v0.59 patch
        run: python scripts/v059_patch.py
      - name: Build
        run: npm run build
      - name: Commit implementation
        run: |
          git checkout -- tsconfig.tsbuildinfo 2>/dev/null || true
          rm -f scripts/v059_patch.py .github/workflows/v059_qr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.59 Add instructor QR and supplied lung marker"
          git push
