name: Apply v0.83.0.48 hold button touch selection

on:
  push:
    branches:
      - chatgpt/v0.83.0.48-hold-button-touch-selection
    paths:
      - .github/workflows/apply-v0.83.0.48-hold-button-touch-selection.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.83.0.48-hold-button-touch-selection
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/apply-v0.83.0.48-hold-button-touch-selection.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit transformed source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles.css src/appVersion.ts
          git diff --cached --quiet && exit 0
          git commit -m "v0.83.0.48 prevent hold button text selection"
          git push origin HEAD:chatgpt/v0.83.0.48-hold-button-touch-selection
