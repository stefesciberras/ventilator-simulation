name: Fix shared account sign-in reference

on:
  push:
    branches: [edusim/shared-account-and-edumon-scenarios]
    paths: [.github/workflows/fix-shared-account-ref.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edusim/shared-account-and-edumon-scenarios
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/InstructorAccountControls.tsx')
          s = p.read_text()
          old = "setScenarioOpen(false); setAccountOpen(true)"
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old, "setScenarioOpen(false); accountAuth.setOpen(true)", 1))
          PY
          rm .github/workflows/fix-shared-account-ref.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix scenario sign-in handoff to shared account dialog"
          git push origin HEAD:edusim/shared-account-and-edumon-scenarios
