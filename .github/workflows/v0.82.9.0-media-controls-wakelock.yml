name: Verify v0.82.9.0 media controls and wake lock

on:
  push:
    branches:
      - chatgpt/v0.82.9.0-media-controls-wakelock

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.82.9.0-media-controls-wakelock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/apply-v08290.py
      - name: Commit applied changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/App.tsx src/styles.css src/instructor.css src/appVersion.ts src/components/SessionPanel.tsx src/session/supabase.ts src/session/useTeachingSession.ts src/session/localRuntimeTransport.ts src/teaching/TeachingLaserPointer.tsx
            git commit -m "implement v0.82.9.0 teaching sync and tablet refinements"
            git push origin HEAD:chatgpt/v0.82.9.0-media-controls-wakelock
          fi
      - run: npm ci
      - name: Build and capture diagnostics
        run: |
          set +e
          npm run build > /tmp/v08290-build.log 2>&1
          status=$?
          cat /tmp/v08290-build.log
          if [ $status -ne 0 ]; then
            cp /tmp/v08290-build.log .github/v08290-build.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/v08290-build.log
            if ! git diff --cached --quiet; then
              git commit -m "capture v0.82.9.0 build diagnostics"
              git push origin HEAD:chatgpt/v0.82.9.0-media-controls-wakelock
            fi
            exit $status
          fi
