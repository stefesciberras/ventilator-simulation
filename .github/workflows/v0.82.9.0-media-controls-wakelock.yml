name: Verify v0.82.9.0 media controls and wake lock

on:
  push:
    branches:
      - chatgpt/v0.82.9.0-media-controls-wakelock

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.82.9.0-media-controls-wakelock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Normalize branch sources
        run: python .github/scripts/apply-v08290.py
      - name: Commit normalized sources
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/App.tsx src/styles.css src/instructor.css src/components/SessionPanel.tsx src/teaching/TeachingLaserPointer.tsx
            git commit -m "normalize v0.82.9.0 teaching refinements"
            git push origin HEAD:chatgpt/v0.82.9.0-media-controls-wakelock
          fi
      - run: npm ci
      - run: npm run build
