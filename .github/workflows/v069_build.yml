name: Build v0.69 EtCO2 buffering

on:
  push:
    branches:
      - chatgpt/v0.69-etco2-buffering

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply patch
        run: |
          python scripts/v069_patch.py
          python scripts/v069_fix_twolevel.py
      - name: Build
        run: npm run build
      - name: Semantic checks
        run: |
          python - <<'PY'
          from pathlib import Path
          eng = Path('src/simulation/engine.ts').read_text()
          app = Path('src/App.tsx').read_text()
          phys = Path('src/physiologyMeasurements.ts').read_text()
          dlg = Path('src/components/PhysiologyMeasurementsDialog.tsx').read_text()
          diag = Path('src/diagnostics.ts').read_text()

          assert 'co2BufferCapacityL = Math.max(30, pbw * 1.1)' in eng
          assert 'eliminatedCo2MlMin = alveolarVentilation * state.alveolarCo2 / 0.863' in eng
          assert 'sensorResponseSeconds = activeExpiratoryFlow ? 0.10 : expiratory ? 4.0 : 0.15' in eng
          assert 'airwayCo2' in eng
          assert 'capnogramValue(' not in eng
          assert 'responseTime = 8' not in eng
          assert 'latestTime - lastExpiratoryFlowTime > 20' in app
          assert 'latestTime - lastExpiratoryFlowTime > 20' in phys
          assert "etco2={endTidalCO2 == null ? '-'" in app
          assert 'empty="-"' in dlg
          assert "APP_VERSION = '0.69'" in diag
          assert "appVersion: '0.69'" in app

          pbw = 50 + 0.91 * (170 - 152.4)
          slope = 0.863 * 250 / (pbw * 1.1)
          assert 2.8 < slope < 3.2, slope
          print(f'apnoeic CO2 slope at 170 cm male, VCO2 250: {slope:.2f} mmHg/min')
          PY
      - name: Remove temporary files
        run: |
          rm -f .github/workflows/v069_build.yml scripts/v069_patch.py scripts/v069_fix_twolevel.py
      - name: Restore generated TypeScript build cache
        run: git checkout HEAD -- tsconfig.app.tsbuildinfo 2>/dev/null || true
      - name: Commit implementation
        run: |
          git config user.name 'stefesciberras'
          git config user.email '43134239+stefesciberras@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'v0.69 Refine EtCO2 and buffered CO2 dynamics'
            git push
          fi
