name: Fix EDUMON mobile workspace

on:
  push:
    branches:
      - fix/edumon-mobile-workspace-diagnostics-dismiss
    paths:
      - scripts/fix_mobile_workspace_diagnostics.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/edumon-mobile-workspace-diagnostics-dismiss
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/fix_mobile_workspace_diagnostics.py
      - run: npm ci
      - run: npm run build
      - name: Commit fix and remove temporary tooling
        run: |
          rm scripts/fix_mobile_workspace_diagnostics.py
          rm .github/workflows/fix-edumon-mobile-workspace.yml
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add -A
          git commit -m "Fix EDUMON mobile workspace and dismiss diagnostics on outside interaction"
          git push origin HEAD:fix/edumon-mobile-workspace-diagnostics-dismiss
