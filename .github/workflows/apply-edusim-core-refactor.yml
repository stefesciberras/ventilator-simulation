name: Apply EDUSIM core refactor

on:
  push:
    branches: [fix/remove-transition-value-label]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-transition-value-label
          fetch-depth: 0
      - run: python scripts/refactor_edusim_core.py
      - run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/edumon/EdumonApp.tsx
          git commit -m "Adopt shared persistence and secondary surfaces"
          git push origin HEAD:fix/remove-transition-value-label
