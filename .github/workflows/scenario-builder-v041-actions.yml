name: Scenario Builder v0.4.1 actions

on:
  push:
    branches:
      - chatgpt/scenario-builder-v0.4.1-actions

permissions:
  contents: write

jobs:
  implement-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/scenario-builder-v0.4.1-actions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Implement generalized trigger actions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new, label):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'{label}: anchor not found')
              p.write_text(s.replace(old,new,1))

          # instructorAccount.ts: generic patient/action trigger types
          path='src/instructorAccount.ts'
          rep(path,
          "export type DynamicScenarioTrigger =\n  | { type: 'manual' }\n  | { type: 'time'; seconds: number }\n  | { type: 'condition'; metric: DynamicScenarioMetric; operator: 'lt' | 'eq' | 'gt'; value: number }\n  | { type: 'action'; parameter: keyof VentilatorSettings; actor: 'candidate' | 'instructor' | 'either' }\n  | { type: 'question-any' }\n  | { type: 'question-correct' }\n",
          "export type DynamicScenarioActor = 'candidate' | 'instructor' | 'either'\n\nexport type DynamicScenarioActionId =\n  | 'freeze-waveform'\n  | 'inspiratory-hold'\n  | 'expiratory-hold'\n  | 'oxygen-flush'\n  | 'nebulisation'\n\nexport type DynamicScenarioTrigger =\n  | { type: 'manual' }\n  | { type: 'time'; seconds: number }\n  | { type: 'condition'; metric: DynamicScenarioMetric; operator: 'lt' | 'eq' | 'gt'; value: number }\n  | { type: 'action'; parameter: keyof VentilatorSettings; actor: DynamicScenarioActor }\n  | { type: 'patient-change'; parameter: keyof PatientSettings; actor: DynamicScenarioActor }\n  | { type: 'device-action'; action: DynamicScenarioActionId; actor: DynamicScenarioActor }\n  | { type: 'question-any' }\n  | { type: 'question-correct' }\n",
          'trigger types')

          # supabase.ts: live candidate action event fields + recorder
          path='src/session/supabase.ts'
          rep(path,
          "  state_updated_at: string | null\n  alarm_level: CandidateAlarmLevel\n}\n",
          "  state_updated_at: string | null\n  alarm_level: CandidateAlarmLevel\n  last_scenario_action: string | null\n  scenario_action_revision: number\n  scenario_action_at: string | null\n}\n",
          'session member action fields')
          rep(path,
          "export async function findActiveInstructorSession() {\n",
          "export async function recordSessionScenarioAction(sessionId: string, action: string) {\n  const { error } = await supabase.rpc('record_scenario_action', { p_session_id: sessionId, p_action: action })\n  if (error) throw error\n}\n\nexport async function findActiveInstructorSession() {\n",
          'record action RPC')

          # DynamicScenarioBuilder.tsx: trigger defaults/summaries/editor
          path='src/components/DynamicScenarioBuilder.tsx'
          rep(path,
          "  if (type === 'question-any') return { type: 'question-any' }\n  if (type === 'question-correct') return { type: 'question-correct' }\n  return { type: 'action', parameter: 'fio2', actor: 'either' }\n",
          "  if (type === 'question-any') return { type: 'question-any' }\n  if (type === 'question-correct') return { type: 'question-correct' }\n  if (type === 'patient-change') return { type: 'patient-change', parameter: 'compliance', actor: 'either' }\n  if (type === 'device-action') return { type: 'device-action', action: 'freeze-waveform', actor: 'either' }\n  return { type: 'action', parameter: 'fio2', actor: 'either' }\n",
          'builder default trigger')
          rep(path,
          "  const field = VENT_FIELDS.find((item) => item.key === value.parameter)\n  const actor = value.actor === 'either' ? 'candidate or instructor' : value.actor\n  return `${field?.label ?? String(value.parameter)} changed by ${actor}`\n",
          "  const actor = value.actor === 'either' ? 'candidate or instructor' : value.actor\n  if (value.type === 'action') {\n    const field = VENT_FIELDS.find((item) => item.key === value.parameter)\n    return `${field?.label ?? String(value.parameter)} changed by ${actor}`\n  }\n  if (value.type === 'patient-change') {\n    const field = [...PATIENT_FIELDS, ...PHYSIO_FIELDS].find((item) => item.key === value.parameter)\n    return `${field?.label ?? String(value.parameter)} changed by ${actor}`\n  }\n  const labels: Record<string, string> = { 'freeze-waveform': 'Freeze waveform', 'inspiratory-hold': 'Inspiratory hold', 'expiratory-hold': 'Expiratory hold', 'oxygen-flush': 'Oxygen flush', nebulisation: 'Nebulisation' }\n  return `${labels[value.action] ?? value.action} by ${actor}`\n",
          'builder trigger summary')
          rep(path,
          "                    const actionTrigger = triggers.find((trigger): trigger is Extract<DynamicScenarioTrigger, { type: 'action' }> => trigger.type === 'action')\n                    const triggerTypes: DynamicScenarioTrigger['type'][] = stageType === 'question' ? ['question-any', 'question-correct', 'time'] : ['manual', 'time', 'condition', 'action']\n",
          "                    const actionTrigger = triggers.find((trigger): trigger is Extract<DynamicScenarioTrigger, { type: 'action' }> => trigger.type === 'action')\n                    const patientTrigger = triggers.find((trigger): trigger is Extract<DynamicScenarioTrigger, { type: 'patient-change' }> => trigger.type === 'patient-change')\n                    const deviceActionTrigger = triggers.find((trigger): trigger is Extract<DynamicScenarioTrigger, { type: 'device-action' }> => trigger.type === 'device-action')\n                    const triggerTypes: DynamicScenarioTrigger['type'][] = stageType === 'question' ? ['question-any', 'question-correct', 'time'] : ['manual', 'time', 'condition', 'action', 'patient-change', 'device-action']\n",
          'builder trigger vars')
          rep(path,
          "                            {type === 'manual' ? 'Manual' : type === 'time' ? 'Time passed' : type === 'condition' ? 'Condition' : type === 'action' ? 'Action' : type === 'question-correct' ? 'Correct answer' : 'Any answer'}\n",
          "                            {type === 'manual' ? 'Manual' : type === 'time' ? 'Time passed' : type === 'condition' ? 'Measured value' : type === 'action' ? 'Ventilator change' : type === 'patient-change' ? 'Patient change' : type === 'device-action' ? 'Action' : type === 'question-correct' ? 'Correct answer' : 'Any answer'}\n",
          'builder trigger labels')
          rep(path,
          "                      {actionTrigger && <div className=\"dynamic-trigger-condition\">\n                        <label><span>Ventilator parameter</span><select value={String(actionTrigger.parameter)} onChange={(event) => updateAdvanceTrigger(index, { ...actionTrigger, parameter: event.target.value as keyof VentilatorSettings })}>{VENT_FIELDS.map((field) => <option key={field.key} value={field.key}>{field.label}</option>)}</select></label>\n                        <label><span>Changed by</span><select value={actionTrigger.actor} onChange={(event) => updateAdvanceTrigger(index, { ...actionTrigger, actor: event.target.value as 'candidate' | 'instructor' | 'either' })}><option value=\"either\">Candidate or instructor</option><option value=\"candidate\">Candidate</option><option value=\"instructor\">Instructor</option></select></label>\n                      </div>}\n",
          "                      {actionTrigger && <div className=\"dynamic-trigger-condition\">\n                        <label><span>Ventilator parameter</span><select value={String(actionTrigger.parameter)} onChange={(event) => updateAdvanceTrigger(index, { ...actionTrigger, parameter: event.target.value as keyof VentilatorSettings })}>{VENT_FIELDS.map((field) => <option key={field.key} value={field.key}>{field.label}</option>)}</select></label>\n                        <label><span>Changed by</span><select value={actionTrigger.actor} onChange={(event) => updateAdvanceTrigger(index, { ...actionTrigger, actor: event.target.value as 'candidate' | 'instructor' | 'either' })}><option value=\"either\">Candidate or instructor</option><option value=\"candidate\">Candidate</option><option value=\"instructor\">Instructor</option></select></label>\n                      </div>}\n                      {patientTrigger && <div className=\"dynamic-trigger-condition\">\n                        <label><span>Patient / physiology parameter</span><select value={String(patientTrigger.parameter)} onChange={(event) => updateAdvanceTrigger(index, { ...patientTrigger, parameter: event.target.value as keyof PatientSettings })}>{[...PATIENT_FIELDS, ...PHYSIO_FIELDS].map((field) => <option key={field.key} value={field.key}>{field.label}</option>)}</select></label>\n                        <label><span>Changed by</span><select value={patientTrigger.actor} onChange={(event) => updateAdvanceTrigger(index, { ...patientTrigger, actor: event.target.value as 'candidate' | 'instructor' | 'either' })}><option value=\"either\">Candidate or instructor</option><option value=\"candidate\">Candidate</option><option value=\"instructor\">Instructor</option></select></label>\n                      </div>}\n                      {deviceActionTrigger && <div className=\"dynamic-trigger-condition\">\n                        <label><span>Action</span><select value={deviceActionTrigger.action} onChange={(event) => updateAdvanceTrigger(index, { ...deviceActionTrigger, action: event.target.value as typeof deviceActionTrigger.action })}><option value=\"freeze-waveform\">Freeze waveform</option><option value=\"inspiratory-hold\">Inspiratory hold</option><option value=\"expiratory-hold\">Expiratory hold</option><option value=\"oxygen-flush\">Oxygen flush</option><option value=\"nebulisation\">Nebulisation</option></select></label>\n                        <label><span>Performed by</span><select value={deviceActionTrigger.actor} onChange={(event) => updateAdvanceTrigger(index, { ...deviceActionTrigger, actor: event.target.value as 'candidate' | 'instructor' | 'either' })}><option value=\"either\">Candidate or instructor</option><option value=\"candidate\">Candidate</option><option value=\"instructor\">Instructor</option></select></label>\n                      </div>}\n",
          'builder trigger editors')

          # InstructorAccountControls.tsx: baselines + runtime handling
          path='src/components/InstructorAccountControls.tsx'
          rep(path,
          "  type DynamicScenarioApplyMask,\n  type DynamicScenarioMetric,\n  type DynamicScenarioTrigger,\n",
          "  type DynamicScenarioActionId,\n  type DynamicScenarioApplyMask,\n  type DynamicScenarioMetric,\n  type DynamicScenarioTrigger,\n",
          'runtime type import')
          rep(path,
          "  onScenarioDiagnosticChange?: (context: DynamicScenarioDiagnosticContext | null) => void\n}\n",
          "  onScenarioDiagnosticChange?: (context: DynamicScenarioDiagnosticContext | null) => void\n  scenarioActionEvent?: { action: DynamicScenarioActionId; sequence: number } | null\n}\n",
          'runtime prop')
          rep(path,
          "export function InstructorAccountControls({ role, sessionId, currentScenario, onLoadScenario, simulationPaused, onSimulationPausedChange, physiologyMeasurements, scenarioElapsedSeconds, sessionMembers, runtimeHost, onStartInstructorSession, onAccountConnectionChange, onDynamicScenarioStarted, onStaticScenarioLoaded, onScenarioDiagnosticChange }: InstructorAccountControlsProps) {\n",
          "export function InstructorAccountControls({ role, sessionId, currentScenario, onLoadScenario, simulationPaused, onSimulationPausedChange, physiologyMeasurements, scenarioElapsedSeconds, sessionMembers, runtimeHost, onStartInstructorSession, onAccountConnectionChange, onDynamicScenarioStarted, onStaticScenarioLoaded, onScenarioDiagnosticChange, scenarioActionEvent = null }: InstructorAccountControlsProps) {\n",
          'runtime props destructure')
          rep(path,
          "  const actionBaselineInstructorRef = useRef<VentilatorSettings | null>(null)\n  const actionBaselineCandidatesRef = useRef(new Map<string, VentilatorSettings>())\n",
          "  const actionBaselineInstructorRef = useRef<VentilatorSettings | null>(null)\n  const actionBaselineCandidatesRef = useRef(new Map<string, VentilatorSettings>())\n  const patientBaselineInstructorRef = useRef<PatientSettings | null>(null)\n  const patientBaselineCandidatesRef = useRef(new Map<string, PatientSettings>())\n  const localScenarioActionBaselineRef = useRef(0)\n  const candidateScenarioActionBaselineRef = useRef(new Map<string, number>())\n",
          'runtime baseline refs')
          rep(path,
          "    actionBaselineInstructorRef.current = { ...nextScenario.ventilator }\n    actionBaselineCandidatesRef.current = new Map(sessionMembers.filter((member) => member.role === 'candidate').flatMap((member) => {\n      const settings = member.ventilator_settings as Partial<VentilatorSettings>\n      return settings && Object.keys(settings).length ? [[member.id, { ...settings } as VentilatorSettings] as const] : []\n    }))\n",
          "    actionBaselineInstructorRef.current = { ...nextScenario.ventilator }\n    actionBaselineCandidatesRef.current = new Map(sessionMembers.filter((member) => member.role === 'candidate').flatMap((member) => {\n      const settings = member.ventilator_settings as Partial<VentilatorSettings>\n      return settings && Object.keys(settings).length ? [[member.id, { ...settings } as VentilatorSettings] as const] : []\n    }))\n    patientBaselineInstructorRef.current = { ...nextScenario.patient }\n    patientBaselineCandidatesRef.current = new Map(sessionMembers.filter((member) => member.role === 'candidate').flatMap((member) => {\n      const settings = member.patient_settings as Partial<PatientSettings>\n      return settings && Object.keys(settings).length ? [[member.id, { ...settings } as PatientSettings] as const] : []\n    }))\n    localScenarioActionBaselineRef.current = scenarioActionEvent?.sequence ?? 0\n    candidateScenarioActionBaselineRef.current = new Map(sessionMembers.filter((member) => member.role === 'candidate').map((member) => [member.id, member.scenario_action_revision ?? 0]))\n",
          'runtime activate baselines')
          rep(path,
          "      actionBaselineInstructorRef.current = { ...firstScenario.ventilator }\n      actionBaselineCandidatesRef.current = new Map()\n",
          "      actionBaselineInstructorRef.current = { ...firstScenario.ventilator }\n      actionBaselineCandidatesRef.current = new Map()\n      patientBaselineInstructorRef.current = { ...firstScenario.patient }\n      patientBaselineCandidatesRef.current = new Map()\n      localScenarioActionBaselineRef.current = scenarioActionEvent?.sequence ?? 0\n      candidateScenarioActionBaselineRef.current = new Map()\n",
          'runtime self directed baselines')
          rep(path,
          "      } else if (trigger.type === 'action') {\n",
          "      } else if (trigger.type === 'patient-change') {\n        if (selfDirectedRun) {\n          if (trigger.actor === 'candidate' || trigger.actor === 'either') {\n            const baseline=patientBaselineInstructorRef.current\n            if (baseline && settingChanged(currentScenario.patient[trigger.parameter],baseline[trigger.parameter])) shouldAdvance=true\n          }\n        } else {\n          if (trigger.actor === 'instructor' || trigger.actor === 'either') {\n            const baseline=patientBaselineInstructorRef.current\n            if (baseline && settingChanged(currentScenario.patient[trigger.parameter],baseline[trigger.parameter])) shouldAdvance=true\n          }\n          if (!shouldAdvance && (trigger.actor === 'candidate' || trigger.actor === 'either')) {\n            for (const member of sessionMembers) {\n              if (member.role !== 'candidate') continue\n              const baseline=patientBaselineCandidatesRef.current.get(member.id), settings=member.patient_settings as Partial<PatientSettings>\n              if (!baseline || !settings || !(trigger.parameter in settings)) continue\n              if (settingChanged(settings[trigger.parameter],baseline[trigger.parameter])) { shouldAdvance=true; break }\n            }\n          }\n        }\n      } else if (trigger.type === 'device-action') {\n        if (selfDirectedRun) {\n          shouldAdvance = (trigger.actor === 'candidate' || trigger.actor === 'either') && Boolean(scenarioActionEvent && scenarioActionEvent.sequence > localScenarioActionBaselineRef.current && scenarioActionEvent.action === trigger.action)\n        } else {\n          if ((trigger.actor === 'instructor' || trigger.actor === 'either') && scenarioActionEvent && scenarioActionEvent.sequence > localScenarioActionBaselineRef.current && scenarioActionEvent.action === trigger.action) shouldAdvance=true\n          if (!shouldAdvance && (trigger.actor === 'candidate' || trigger.actor === 'either')) {\n            for (const member of sessionMembers) {\n              if (member.role !== 'candidate') continue\n              const baseline=candidateScenarioActionBaselineRef.current.get(member.id) ?? 0\n              if ((member.scenario_action_revision ?? 0) > baseline && member.last_scenario_action === trigger.action) { shouldAdvance=true; break }\n            }\n          }\n        }\n      } else if (trigger.type === 'action') {\n",
          'runtime new trigger branches')
          rep(path,
          "  }, [role, activeRuntimePreset, activeDynamicStage, activeDynamicStageStartedAt, scenarioElapsedSeconds, physiologyMeasurements, currentScenario.ventilator, sessionMembers, selfDirectedRun, selfDirectedQuestionAnswer, scenarioPromptRuntime.responses])\n",
          "  }, [role, activeRuntimePreset, activeDynamicStage, activeDynamicStageStartedAt, scenarioElapsedSeconds, physiologyMeasurements, currentScenario.ventilator, currentScenario.patient, sessionMembers, selfDirectedRun, selfDirectedQuestionAnswer, scenarioPromptRuntime.responses, scenarioActionEvent])\n",
          'runtime effect dependencies')

          # App.tsx: local action event + candidate publication
          path='src/App.tsx'
          rep(path,
          "import { useTeachingSession } from './session/useTeachingSession'\nimport type { InstructorScenarioSnapshot } from './instructorAccount'\n",
          "import { useTeachingSession } from './session/useTeachingSession'\nimport { recordSessionScenarioAction } from './session/supabase'\nimport type { DynamicScenarioActionId, InstructorScenarioSnapshot } from './instructorAccount'\n",
          'app action imports')
          rep(path,
          "  const [nebuliser, setNebuliser] = useState(false)\n  const [alarmSilenced, setAlarmSilenced] = useState(false)\n",
          "  const [nebuliser, setNebuliser] = useState(false)\n  const [scenarioActionEvent, setScenarioActionEvent] = useState<{ action: DynamicScenarioActionId; sequence: number } | null>(null)\n  const scenarioActionSequenceRef = useRef(0)\n  const [alarmSilenced, setAlarmSilenced] = useState(false)\n",
          'app action state')
          rep(path,
          "  const toggleFreeze = () => {\n",
          "  const recordScenarioAction = (action: DynamicScenarioActionId) => {\n    const sequence = scenarioActionSequenceRef.current + 1\n    scenarioActionSequenceRef.current = sequence\n    setScenarioActionEvent({ action, sequence })\n    if (teachingSession.role === 'candidate' && teachingSession.session?.id) void recordSessionScenarioAction(teachingSession.session.id, action).catch(() => undefined)\n  }\n\n  const toggleFreeze = () => {\n",
          'app action recorder')
          rep(path,
          "    if (!waveformFrozen) {\n      setFrozenSamples(movingSamples)\n",
          "    if (!waveformFrozen) {\n      recordScenarioAction('freeze-waveform')\n      setFrozenSamples(movingSamples)\n",
          'freeze action')
          rep(path,
          "      const next = !sharedWaveformFreeze.active\n      if (next && !waveformFrozen) {\n",
          "      const next = !sharedWaveformFreeze.active\n      if (next) recordScenarioAction('freeze-waveform')\n      if (next && !waveformFrozen) {\n",
          'shared freeze action')
          rep(path,
          "  const beginInspiratoryHold = () => {\n    if (waveformFrozen || simulationPaused || !manualHoldAvailable || inspiratoryHoldPressed) return\n",
          "  const beginInspiratoryHold = () => {\n    if (waveformFrozen || simulationPaused || !manualHoldAvailable || inspiratoryHoldPressed) return\n    recordScenarioAction('inspiratory-hold')\n",
          'insp hold action')
          rep(path,
          "  const beginExpiratoryHold = () => {\n    if (waveformFrozen || simulationPaused || activeMode === 'APRV' || expiratoryHoldPressed) return\n",
          "  const beginExpiratoryHold = () => {\n    if (waveformFrozen || simulationPaused || activeMode === 'APRV' || expiratoryHoldPressed) return\n    recordScenarioAction('expiratory-hold')\n",
          'exp hold action')
          rep(path,
          "    oxygenBoostDeadlineRef.current = Date.now() + 60_000\n",
          "    recordScenarioAction('oxygen-flush')\n    oxygenBoostDeadlineRef.current = Date.now() + 60_000\n",
          'oxygen action')
          rep(path,
          "  const oxygenBoostTimer = `0:${String(oxygenBoostSecondsRemaining).padStart(2, '0')}`\n",
          "  const toggleNebuliser = () => {\n    setNebuliser((active) => {\n      if (!active) recordScenarioAction('nebulisation')\n      return !active\n    })\n  }\n\n  const oxygenBoostTimer = `0:${String(oxygenBoostSecondsRemaining).padStart(2, '0')}`\n",
          'nebuliser handler')
          p=Path(path); s=p.read_text(); s=s.replace("onClick={() => setNebuliser((v) => !v)} title=\"Nebuliser\"", "onClick={toggleNebuliser} title=\"Nebuliser\"")
          if s.count('onClick={toggleNebuliser}') < 1: raise SystemExit('nebuliser button replacement failed')
          p.write_text(s)
          rep(path,
          "            onScenarioDiagnosticChange={setDynamicScenarioDiagnostic}\n          />\n",
          "            onScenarioDiagnosticChange={setDynamicScenarioDiagnostic}\n            scenarioActionEvent={scenarioActionEvent}\n          />\n",
          'app runtime prop')

          Path('src/scenario-builder/version.ts').write_text("export const SCENARIO_BUILDER_VERSION = '0.4.1'\n")
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add src supabase/migrations/20261019_scenario_action_events.sql
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Scenario Builder v0.4.1 generalized triggers"
          git push origin HEAD:chatgpt/scenario-builder-v0.4.1-actions
