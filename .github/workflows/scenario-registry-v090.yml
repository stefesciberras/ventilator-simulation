name: Scenario Builder v0.9.0 registry integration

on:
  push:
    branches: [chatgpt/scenario-builder-v0.9.0-registry]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/scenario-builder-v0.9.0-registry
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/apply-scenario-registry-v090.py
      - run: npm ci
      - run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add src
          git commit -m "Scenario Builder v0.9.0 registry-driven parameters" || exit 0
          git push
