name: Build v0.61 explicit shunt
on:
  push:
    branches: [chatgpt/v0.61-explicit-shunt]
jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Apply v0.61 patch
        run: python scripts/v061_explicit_shunt_patch.py
      - name: Build
        run: npm run build
      - name: Shunt source checks
        run: |
          python - <<'PY'
          from pathlib import Path
          types = Path('src/simulation/types.ts').read_text()
          engine = Path('src/simulation/engine.ts').read_text()
          controls = Path('src/components/Controls.tsx').read_text()
          app = Path('src/App.tsx').read_text()
          assert 'shuntFraction: number' in types
          assert 'baselineShunt = clamp(patient.shuntFraction ?? 0.03, 0, 0.5)' in engine
          assert 'compliancePenalty' not in engine
          assert 'venousLikeSaturation = 75' in engine
          assert 'label="Shunt"' in controls
          assert 'ARDS: { shuntFraction: 0.25' in controls
          assert 'Normal: { shuntFraction: 0.03' in controls
          assert 'shuntFraction: lerp(' in app
          assert '>v0.61</span>' in app
          print('v0.61 shunt semantic checks passed')
          PY
      - name: Commit implementation
        run: |
          git checkout -- tsconfig.tsbuildinfo 2>/dev/null || true
          rm -f .github/workflows/v061_explicit_shunt.yml scripts/v061_explicit_shunt_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.61 Add explicit physiological shunt"
          git push
