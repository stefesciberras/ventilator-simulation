name: v0.77.2 oxygen and pressure limitation

on:
  push:
    branches:
      - chatgpt/v0.77.2-oxygen-pressure-limit

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.77.2-oxygen-pressure-limit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply v0.77.2 patch
        run: python3 scripts/patch_v0772.py
      - name: Verify requested behavior is present
        run: |
          grep -q "pressureLimit: 60" src/App.tsx
          grep -q "PRESSURE LIMIT" src/App.tsx
          grep -q "pressureLimitHit" src/simulation/engine.ts
          grep -q "mixedContent" src/simulation/engine.ts
          grep -q "fio2BoostActive" src/components/Controls.tsx
          grep -q "oxygen-boosted" src/components/InteractiveVentilatorStrip.tsx
          grep -q "font-size: 10px" src/interactive-vent-controls.css
          grep -q "v0.77.2" src/App.tsx
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit integrated changes
        run: |
          if git diff --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/alarmTypes.ts src/alarm.css src/styles.css src/interactive-vent-controls.css src/components/Controls.tsx src/components/InteractiveVentilatorStrip.tsx src/components/SessionPanel.tsx src/simulation/types.ts src/simulation/engine.ts
          git commit -m "v0.77.2 Link oxygen enrichment and add pressure limitation"
          git push origin HEAD:chatgpt/v0.77.2-oxygen-pressure-limit
