name: Temporary v0.83.0.53 spontaneous mechanics transform

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/tmp-v053-spontaneous.mjs
      - .github/workflows/tmp-v053-spontaneous.yml
      - src/simulation/spontaneousBreathing.ts

permissions:
  contents: write

jobs:
  transform-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/tmp-v053-spontaneous.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit generated source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/simulation/engineLegacy.ts src/appVersion.ts
          git diff --cached --quiet || git commit -m "Refactor spontaneous pressure-assist mechanics"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
