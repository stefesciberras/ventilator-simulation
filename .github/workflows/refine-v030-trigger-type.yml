name: Refine v0.30 trigger type
on:
  push:
    branches: [chatgpt/v0.30-trigger-type]
    paths: [.github/workflows/refine-v030-trigger-type.yml]
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.30-trigger-type
      - name: Refine trigger display
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/simulation/engine.ts')
          text = p.read_text()
          old = '''  const targetPressure = high ? pHigh : pLow\n  const spontaneousPressureDeflection = mode === 'BIPAP'\n    ? clamp(pmus * 0.35, 0, 6)\n    : high\n      ? clamp(pmus * 0.35, 0, 6)\n      : 0\n\n  const distendingPressure = high ? pHigh - pLow : 0\n  const elasticPressure = state.volume / complianceL\n'''
          new = '''  const targetPressure = high ? pHigh : pLow\n  const elasticPressure = state.volume / complianceL\n  const spontaneousPressureDeflection = mode === 'BIPAP'\n    ? high\n      ? clamp(pmus * 0.35, 0, 6)\n      : Math.max(0, pmus - elasticPressure)\n    : high\n      ? clamp(pmus * 0.35, 0, 6)\n      : 0\n\n  const distendingPressure = high ? pHigh - pLow : 0\n'''
          if old not in text:
              raise SystemExit('BIPAP pressure display block not found')
          p.write_text(text.replace(old, new, 1))

          p = Path('src/styles.css')
          text = p.read_text()
          marker = '.control-row { display: block; margin: 12px 0; }\n'
          css = '''.trigger-controls { margin: 10px 0 2px; }\n.trigger-type-selector { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 6px; margin-bottom: 6px; }\n.trigger-type-selector button { min-height: 36px; padding: 7px 8px; font-size: 10px; font-weight: 700; letter-spacing: .04em; }\n'''
          if marker not in text:
              raise SystemExit('styles control-row marker not found')
          p.write_text(text.replace(marker, css + marker, 1))
      - name: Install
        run: npm install --no-package-lock
      - name: Build
        run: npm run build
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/simulation/engine.ts src/styles.css
          git commit -m "v0.30: align trigger display with detector"
          git push origin HEAD:chatgpt/v0.30-trigger-type
