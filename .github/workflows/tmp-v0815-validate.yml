name: Temporary v0.81.5 VdVt validation

on:
  push:
    branches:
      - chatgpt/v0.81.5-vdvt

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.81.5-vdvt
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply v0.81.5 patches
        run: |
          python .github/tmp_v0815_patch.py
          python .github/tmp_v0815_fix.py
          npm ci
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/appVersion.ts src/components/Controls.tsx src/components/PhysiologyMeasurementsDialog.tsx src/patientMetrics.ts src/physiologyMeasurements.ts src/simulation/engine.ts src/simulation/types.ts
          git commit -m "Implement v0.81.5 VdVt physiology model"
          git push
      - name: Validate committed tree
        run: npm run build
