name: Temporary v0.81.5 VdVt validation

on:
  push:
    branches:
      - chatgpt/v0.81.5-vdvt

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.81.5-vdvt
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Capture patch/build diagnostics
        run: |
          set +e
          : > .github/tmp_v0815_debug2.txt
          python .github/tmp_v0815_patch.py >> .github/tmp_v0815_debug2.txt 2>&1
          echo "PATCH_STATUS=$?" >> .github/tmp_v0815_debug2.txt
          python .github/tmp_v0815_fix.py >> .github/tmp_v0815_debug2.txt 2>&1
          echo "FIX_STATUS=$?" >> .github/tmp_v0815_debug2.txt
          npm ci >> .github/tmp_v0815_debug2.txt 2>&1
          echo "NPM_CI_STATUS=$?" >> .github/tmp_v0815_debug2.txt
          npm run build >> .github/tmp_v0815_debug2.txt 2>&1
          echo "BUILD_STATUS=$?" >> .github/tmp_v0815_debug2.txt
          git restore src/App.tsx src/appVersion.ts src/components/Controls.tsx src/components/PhysiologyMeasurementsDialog.tsx src/patientMetrics.ts src/physiologyMeasurements.ts src/simulation/engine.ts src/simulation/types.ts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/tmp_v0815_debug2.txt
          git commit -m "Record v0.81.5 second validation error [skip ci]"
          git push
