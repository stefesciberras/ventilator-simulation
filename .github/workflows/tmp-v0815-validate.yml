name: Temporary v0.81.5 VdVt validation

on:
  push:
    branches:
      - chatgpt/v0.81.5-vdvt

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.81.5-vdvt
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Diagnose patch/build
        run: |
          set +e
          : > .github/tmp_v0815_debug.txt
          python .github/tmp_v0815_patch.py >> .github/tmp_v0815_debug.txt 2>&1
          PATCH_STATUS=$?
          echo "PATCH_STATUS=$PATCH_STATUS" >> .github/tmp_v0815_debug.txt
          if [ "$PATCH_STATUS" -eq 0 ]; then
            npm ci >> .github/tmp_v0815_debug.txt 2>&1
            NPM_STATUS=$?
            echo "NPM_CI_STATUS=$NPM_STATUS" >> .github/tmp_v0815_debug.txt
            if [ "$NPM_STATUS" -eq 0 ]; then
              npm run build >> .github/tmp_v0815_debug.txt 2>&1
              echo "BUILD_STATUS=$?" >> .github/tmp_v0815_debug.txt
            fi
          fi
          git restore src/App.tsx src/appVersion.ts src/components/Controls.tsx src/components/PhysiologyMeasurementsDialog.tsx src/patientMetrics.ts src/physiologyMeasurements.ts src/simulation/engine.ts src/simulation/types.ts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/tmp_v0815_debug.txt
          git commit -m "Record v0.81.5 validation error [skip ci]"
          git push
