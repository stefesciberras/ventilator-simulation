name: Apply v0.82.9.4

on:
  push:
    branches:
      - chatgpt/v0.82.9.4-teaching-interaction-fixes

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.82.9.4-teaching-interaction-fixes
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/apply-v0.82.9.4.mjs
      - run: node scripts/apply-v0.82.9.4-laser-metrics.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit generated source changes
        run: |
          rm -f scripts/apply-v0.82.9.4.mjs scripts/apply-v0.82.9.4-laser-metrics.mjs .github/workflows/apply-v0.82.9.4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement v0.82.9.4 teaching interaction fixes"
          git push origin HEAD:chatgpt/v0.82.9.4-teaching-interaction-fixes
