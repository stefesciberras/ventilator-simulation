name: Refactor shared runtime and alarms

on:
  push:
    branches: [refactor/shared-runtime-and-alarms]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-runtime-and-alarms
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply refactor
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/refactor-shared-runtime-alarms.mjs')
          s = p.read_text()
          old = "s = replaceOnce(s, \"    if (alarmSilenceTimeoutRef.current != null) window.clearTimeout(alarmSilenceTimeoutRef.current)\\n\", '', 'App cleanup alarm timeout')"
          new = "s = s.replace(\"    if (alarmSilenceTimeoutRef.current != null) window.clearTimeout(alarmSilenceTimeoutRef.current)\\n\", '')"
          if old not in s:
              raise SystemExit('timeout assertion patch not found')
          s = s.replace(old, new, 1)
          anchor = "  const alarmLabels = alarmController.labels\n`"
          metrics = """  const alarmLabels = alarmController.labels
  const ppeakMetricAlarm: MetricAlarmLevel = measurementAlarmNeedsAttention('pressureLimit', 'pressure') ? 'yellow' : null
  const tidalVolumeMetricAlarm: MetricAlarmLevel = measurementAlarmNeedsAttention('tidalVolumeLow', 'tidalVolumeHigh') ? 'yellow' : null
  const minuteVentilationMetricAlarm: MetricAlarmLevel = measurementAlarmNeedsAttention('minuteVentilationLow', 'minuteVentilationHigh') ? 'yellow' : null
  const respiratoryRateMetricAlarm: MetricAlarmLevel = apneaAlarmActive && !alarmLifecycle.apnea?.acknowledged
    ? 'red'
    : measurementAlarmNeedsAttention('respiratoryRateLow', 'respiratoryRateHigh') ? 'yellow' : null
  const spo2MetricAlarm: MetricAlarmLevel = latestSample?.spo2 != null && latestSample.spo2 < 85 ? 'red' : null
`"""
          if anchor not in s:
              raise SystemExit('alarm metric insertion anchor not found')
          p.write_text(s.replace(anchor, metrics, 1))
          PY
          node scripts/refactor-shared-runtime-alarms.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit refactor and remove temporary tooling
        run: |
          rm scripts/refactor-shared-runtime-alarms.mjs
          rm .github/workflows/refactor-shared-runtime-alarms.yml
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add -A
          git commit -m "Promote runtime presentation and alarms into EDUSIM core"
          git push origin HEAD:refactor/shared-runtime-and-alarms
