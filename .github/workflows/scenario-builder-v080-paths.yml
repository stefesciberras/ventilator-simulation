name: Scenario Builder v0.8.0 paths

on:
  push:
    branches: [chatgpt/scenario-builder-v0.8.0-paths]

permissions:
  contents: write

jobs:
  implement-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/scenario-builder-v0.8.0-paths
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/apply-v080-paths.py
      - run: python3 scripts/fix-v080-types.py
      - run: npm ci
      - run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add src
          git commit -m "Implement Scenario Builder v0.8.0 unified paths" || exit 0
          git push
