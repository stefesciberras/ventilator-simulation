name: Refactor shared session core

on:
  push:
    branches:
      - edusim/shared-session-scenario-core

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edusim/shared-session-scenario-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/refactor-shared-session-core.mjs
      - name: Commit generated refactor
        run: |
          if git diff --quiet; then
            echo "No refactor changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SessionPanel.tsx src/edumon/EdumonApp.tsx
          git commit -m "Reuse shared EDUSIM session launcher and lifecycle"
          git push
