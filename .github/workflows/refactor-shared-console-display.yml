name: Refactor shared console and display controls

on:
  workflow_dispatch:
  push:
    branches:
      - fix/edumon-freeze-mobile-control-strip
    paths:
      - scripts/refactor-shared-console-display.mjs
      - .github/workflows/refactor-shared-console-display.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/edumon-freeze-mobile-control-strip
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/refactor-shared-console-display.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit refactor and remove temporary tooling
        run: |
          rm scripts/refactor-shared-console-display.mjs
          rm .github/workflows/refactor-shared-console-display.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Extract shared simulator console and display controls"
          git push origin HEAD:fix/edumon-freeze-mobile-control-strip
