name: Refactor product-aware scenarios

on:
  push:
    branches:
      - edusim/product-aware-scenarios

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edusim/product-aware-scenarios
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply refactor
        run: node scripts/refactor-product-aware-scenarios.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit refactor and remove temporary tooling
        run: |
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git rm scripts/refactor-product-aware-scenarios.mjs .github/workflows/refactor-product-aware-scenarios.yml
          git add -A
          git commit -m "Make saved scenarios product-aware"
          git push origin HEAD:edusim/product-aware-scenarios
