name: Temporary v0.82.2 patient mechanics
on:
  push:
    branches: [chatgpt/v0.82.2-chestwall-ards-severity]
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.82.2-chestwall-ards-severity
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Implement chest-wall compliance and ARDS severity profiles
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # Version
          Path('src/appVersion.ts').write_text("export const APP_VERSION = '0.82.2'\n")

          # Patient setting type
          replace('src/simulation/types.ts',
                  "  compliance: number\n  resistance: number",
                  "  compliance: number\n  /** Chest-wall compliance used to translate tidal displacement into pleural/Pes change. */\n  chestWallCompliance: number\n  resistance: number")

          # Patient profiles, including ARDS severity presets.
          Path('src/patientProfiles.ts').write_text("""import type { PatientSettings } from './simulation/types'\nimport { calculatePredictedBodyWeight } from './patientMetrics'\n\nexport const PATIENT_PROFILE_NAMES = ['Normal', 'ARDS', 'COPD', 'Asthma', 'Paed'] as const\nexport type PatientProfileName = typeof PATIENT_PROFILE_NAMES[number]\nexport const ARDS_SEVERITIES = ['mild', 'moderate', 'severe'] as const\nexport type ArdsSeverity = typeof ARDS_SEVERITIES[number]\n\nconst normalAdultPbw = calculatePredictedBodyWeight('male', 170)\nconst normalAdultFrc = Math.round(normalAdultPbw * 30)\nconst normalAdultChestWallCompliance = Math.round(normalAdultPbw * 3)\nconst paediatricChestWallCompliance = Math.round(calculatePredictedBodyWeight('male', 110) * 3)\n\nconst normalPhysiology = {\n  sex: 'male' as const,\n  heightCm: 170,\n  oxygenConsumption: 250,\n  frc: normalAdultFrc,\n  maxSpO2: 100,\n  co2Production: 250,\n  vdVt: 0.4,\n}\n\nconst ardsBase = {\n  ...normalPhysiology,\n  resistance: 8,\n  expiratoryResistance: 10,\n  expiratoryFlowLimitation: 0,\n  spontaneousRate: 0,\n  neuralInspiratoryTime: 0.8,\n  effortRisePercent: 20,\n  effortRelaxationPercent: 25,\n  endExpiratoryOesophagealPressure: -5,\n  chestWallCompliance: normalAdultChestWallCompliance,\n}\n\n/** Teaching defaults: severity primarily changes shunt, lung compliance and dead-space burden. */\nexport const ARDS_PROFILES: Record<ArdsSeverity, PatientSettings> = {\n  mild: { ...ardsBase, vdVt: 0.5, shuntFraction: 0.15, compliance: 40, effort: 8 },\n  moderate: { ...ardsBase, vdVt: 0.6, shuntFraction: 0.25, compliance: 25, effort: 10 },\n  severe: { ...ardsBase, vdVt: 0.65, shuntFraction: 0.35, compliance: 15, resistance: 10, expiratoryResistance: 12, effort: 12 },\n}\n\nexport const PATIENT_PROFILES: Record<PatientProfileName, PatientSettings> = {\n  Normal: { ...normalPhysiology, shuntFraction: 0.03, compliance: 60, chestWallCompliance: normalAdultChestWallCompliance, resistance: 6, expiratoryResistance: 8, expiratoryFlowLimitation: 0, spontaneousRate: 12, effort: 5, neuralInspiratoryTime: 1, effortRisePercent: 50, effortRelaxationPercent: 50, endExpiratoryOesophagealPressure: -5 },\n  // Moderate remains the compatibility value for code/scenarios that refer to the generic ARDS profile.\n  ARDS: { ...ARDS_PROFILES.moderate },\n  COPD: { ...normalPhysiology, vdVt: 0.5, shuntFraction: 0.05, compliance: 80, chestWallCompliance: normalAdultChestWallCompliance, resistance: 16, expiratoryResistance: 28, expiratoryFlowLimitation: 0.8, spontaneousRate: 18, effort: 8, neuralInspiratoryTime: 0.9, effortRisePercent: 30, effortRelaxationPercent: 40, endExpiratoryOesophagealPressure: -5 },\n  Asthma: { ...normalPhysiology, vdVt: 0.5, shuntFraction: 0.04, compliance: 70, chestWallCompliance: normalAdultChestWallCompliance, resistance: 25, expiratoryResistance: 40, expiratoryFlowLimitation: 0.95, spontaneousRate: 24, effort: 11, neuralInspiratoryTime: 0.8, effortRisePercent: 20, effortRelaxationPercent: 30, endExpiratoryOesophagealPressure: -5 },\n  Paed: { sex: 'male', heightCm: 110, oxygenConsumption: 120, frc: 500, shuntFraction: 0.03, maxSpO2: 100, co2Production: 100, vdVt: 0.4, compliance: 20, chestWallCompliance: paediatricChestWallCompliance, resistance: 8, expiratoryResistance: 10, expiratoryFlowLimitation: 0, spontaneousRate: 22, effort: 5, neuralInspiratoryTime: 0.7, effortRisePercent: 40, effortRelaxationPercent: 40, endExpiratoryOesophagealPressure: -4 },\n}\n\nexport function patientMatchesProfile(settings: PatientSettings, profile: PatientSettings): boolean {\n  for (const key of Object.keys(profile) as Array<keyof PatientSettings>) {\n    const actual = settings[key]\n    const expected = profile[key]\n    if (typeof actual === 'number' && typeof expected === 'number') {\n      if (Math.abs(actual - expected) > 1e-6) return false\n    } else if (actual !== expected) {\n      return false\n    }\n  }\n  return true\n}\n""")

          # Patient settings slider.
          replace('src/components/Controls.tsx',
                  '      <Slider label="Compliance" value={settings.compliance} unit=" mL/cmH₂O" min={15} max={100} onChange={(v) => patch({ compliance: v })} />\n      <Slider label="Airway resistance"',
                  '      <Slider label="Compliance" value={settings.compliance} unit=" mL/cmH₂O" min={15} max={100} onChange={(v) => patch({ compliance: v })} />\n      <Slider label="Chest wall compliance" value={settings.chestWallCompliance ?? Math.round(predictedBodyWeight * 3)} unit=" mL/cmH₂O" min={40} max={400} step={5} onChange={(v) => patch({ chestWallCompliance: v })} />\n      <Slider label="Airway resistance"')

          # Oesophageal mechanics use configurable Ccw, retaining PBW fallback for old data.
          replace('src/simulation/engine.ts',
                  "  // A normal adult chest-wall compliance is roughly 200 mL/cmH2O. Scale the\n  // teaching approximation to predicted body weight so paediatric patients do\n  // not receive an adult-sized chest wall. The current simulation volume is the\n  // volume above the end-expiratory reference, so intrinsic trapping naturally\n  // leaves Pes above baseline at end expiration.\n  const heightCm = patient.heightCm ?? 170\n  const predictedBodyWeightKg = Math.max(\n    20,\n    (patient.sex === 'female' ? 45.5 : 50) + 0.91 * (heightCm - 152.4),\n  )\n  const chestWallComplianceMlPerCmH2O = clamp(predictedBodyWeightKg * 3, 40, 250)\n  const passiveChestWallPressure = Math.max(0, lungVolumeL * 1000) / chestWallComplianceMlPerCmH2O",
                  "  // Chest-wall compliance is now an explicit patient/scenario property. Keep\n  // a PBW-scaled fallback so older saved patients and scenarios remain valid.\n  const heightCm = patient.heightCm ?? 170\n  const predictedBodyWeightKg = Math.max(\n    20,\n    (patient.sex === 'female' ? 45.5 : 50) + 0.91 * (heightCm - 152.4),\n  )\n  const fallbackChestWallCompliance = clamp(predictedBodyWeightKg * 3, 40, 250)\n  const chestWallComplianceMlPerCmH2O = clamp(\n    patient.chestWallCompliance ?? fallbackChestWallCompliance,\n    40,\n    400,\n  )\n  const passiveChestWallPressure = Math.max(0, lungVolumeL * 1000) / chestWallComplianceMlPerCmH2O")

          # Scenario builder: expose Ccw and backfill old snapshots.
          replace('src/components/DynamicScenarioBuilder.tsx',
                  "import type { PatientSettings, VentilatorMode, VentilatorSettings } from '../simulation/types'\n",
                  "import type { PatientSettings, VentilatorMode, VentilatorSettings } from '../simulation/types'\nimport { calculatePredictedBodyWeight } from '../patientMetrics'\n")
          replace('src/components/DynamicScenarioBuilder.tsx',
                  "  { key: 'compliance', label: 'Compliance', min: 15, max: 100, unit: ' mL/cmH₂O' },\n",
                  "  { key: 'compliance', label: 'Compliance', min: 15, max: 100, unit: ' mL/cmH₂O' },\n  { key: 'chestWallCompliance', label: 'Chest wall compliance', step: 5, min: 40, max: 400, unit: ' mL/cmH₂O' },\n")
          replace('src/components/DynamicScenarioBuilder.tsx',
                  "  if (!Number.isFinite(patient.maxSpO2 ?? Number.NaN)) patient.maxSpO2 = 100\n  if (!Number.isFinite(patient.vdVt ?? Number.NaN)) patient.vdVt = 0.4\n",
                  "  if (!Number.isFinite(patient.maxSpO2 ?? Number.NaN)) patient.maxSpO2 = 100\n  if (!Number.isFinite(patient.vdVt ?? Number.NaN)) patient.vdVt = 0.4\n  if (!Number.isFinite(patient.chestWallCompliance ?? Number.NaN)) {\n    patient.chestWallCompliance = Math.round(calculatePredictedBodyWeight(patient.sex ?? 'male', patient.heightCm ?? 170) * 3)\n  }\n")

          # Account-level scenario normalization protects old static and dynamic presets.
          replace('src/instructorAccount.ts',
                  "import type { PatientSettings, VentilatorSettings } from './simulation/types'\n",
                  "import type { PatientSettings, VentilatorSettings } from './simulation/types'\nimport { calculatePredictedBodyWeight } from './patientMetrics'\n")
          replace('src/instructorAccount.ts',
                  "function normaliseScenario(scenario: InstructorScenarioSnapshot): InstructorScenarioSnapshot {\n  return {\n",
                  "function normalisePatientSettings(patient: PatientSettings): PatientSettings {\n  const chestWallCompliance = Number.isFinite(patient.chestWallCompliance ?? Number.NaN)\n    ? patient.chestWallCompliance\n    : Math.round(calculatePredictedBodyWeight(patient.sex ?? 'male', patient.heightCm ?? 170) * 3)\n  return { ...patient, chestWallCompliance }\n}\n\nfunction normaliseScenario(scenario: InstructorScenarioSnapshot): InstructorScenarioSnapshot {\n  return {\n")
          replace('src/instructorAccount.ts',
                  "    mediaIds: [...new Set((scenario.mediaIds ?? []).filter((id) => typeof id === 'string' && id.length > 0))],\n    stages: scenario.kind === 'dynamic' ? (scenario.stages ?? []).map((stage, index) => ({\n",
                  "    mediaIds: [...new Set((scenario.mediaIds ?? []).filter((id) => typeof id === 'string' && id.length > 0))],\n    patient: normalisePatientSettings(scenario.patient),\n    stages: scenario.kind === 'dynamic' ? (scenario.stages ?? []).map((stage, index) => ({\n")
          replace('src/instructorAccount.ts',
                  "      snapshot: { ...stage.snapshot, kind: 'static', stages: undefined },\n",
                  "      snapshot: { ...stage.snapshot, patient: normalisePatientSettings(stage.snapshot.patient), kind: 'static', stages: undefined },\n")

          # App: ARDS cycling, persistence, interpolation, and labels.
          replace('src/App.tsx',
                  "import { PATIENT_PROFILES, PATIENT_PROFILE_NAMES, patientMatchesProfile, type PatientProfileName } from './patientProfiles'",
                  "import { ARDS_PROFILES, ARDS_SEVERITIES, PATIENT_PROFILES, PATIENT_PROFILE_NAMES, patientMatchesProfile, type ArdsSeverity, type PatientProfileName } from './patientProfiles'")
          replace('src/App.tsx',
                  "const PATIENT_PROFILE_STORAGE_KEY = 'eduvent.patient-preset'\n",
                  "const PATIENT_PROFILE_STORAGE_KEY = 'eduvent.patient-preset'\nconst ARDS_SEVERITY_STORAGE_KEY = 'eduvent.ards-severity'\n")
          replace('src/App.tsx',
                  "    compliance: lerp(from.compliance, to.compliance),\n    resistance: lerp(from.resistance, to.resistance),",
                  "    compliance: lerp(from.compliance, to.compliance),\n    chestWallCompliance: lerp(from.chestWallCompliance ?? 200, to.chestWallCompliance ?? 200),\n    resistance: lerp(from.resistance, to.resistance),")
          marker = "  const [patientTransitionSeconds, setPatientTransitionSeconds] = useState<number>(() => {"
          insertion = """  const [ardsSeverity, setArdsSeverity] = useState<ArdsSeverity | 'off'>(() => {\n    if (typeof window === 'undefined') return 'off'\n    const stored = window.localStorage.getItem(ARDS_SEVERITY_STORAGE_KEY)\n    if (stored && ARDS_SEVERITIES.includes(stored as ArdsSeverity)) return stored as ArdsSeverity\n    return window.localStorage.getItem(PATIENT_PROFILE_STORAGE_KEY) === 'ARDS' ? 'moderate' : 'off'\n  })\n"""
          replace('src/App.tsx', marker, insertion + marker)
          old_logic = """  const selectedPatientProfileModified = selectedPatientProfile != null\n    ? !patientMatchesProfile(patient, PATIENT_PROFILES[selectedPatientProfile])\n    : false\n  const applyPatientProfile = (profile: PatientProfileName) => {\n    setSelectedPatientProfile(profile)\n    try { window.localStorage.setItem(PATIENT_PROFILE_STORAGE_KEY, profile) } catch { /* optional UI preference */ }\n    setPatient({ ...PATIENT_PROFILES[profile] })\n  }\n"""
          new_logic = """  const selectedProfileSettings = selectedPatientProfile === 'ARDS' && ardsSeverity !== 'off'\n    ? ARDS_PROFILES[ardsSeverity]\n    : selectedPatientProfile != null ? PATIENT_PROFILES[selectedPatientProfile] : null\n  const selectedPatientProfileModified = selectedProfileSettings != null\n    ? !patientMatchesProfile(patient, selectedProfileSettings)\n    : false\n  const persistPatientProfile = (profile: PatientProfileName) => {\n    setSelectedPatientProfile(profile)\n    try { window.localStorage.setItem(PATIENT_PROFILE_STORAGE_KEY, profile) } catch { /* optional UI preference */ }\n  }\n  const setArdsSeverityAndPersist = (severity: ArdsSeverity | 'off') => {\n    setArdsSeverity(severity)\n    try { window.localStorage.setItem(ARDS_SEVERITY_STORAGE_KEY, severity) } catch { /* optional UI preference */ }\n  }\n  const applyPatientProfile = (profile: PatientProfileName) => {\n    if (profile === 'ARDS') {\n      const cycle: Array<ArdsSeverity | 'off'> = ['off', 'mild', 'moderate', 'severe']\n      const currentIndex = Math.max(0, cycle.indexOf(ardsSeverity))\n      const next = cycle[(currentIndex + 1) % cycle.length]\n      setArdsSeverityAndPersist(next)\n      if (next === 'off') {\n        persistPatientProfile('Normal')\n        setPatient({ ...PATIENT_PROFILES.Normal })\n      } else {\n        persistPatientProfile('ARDS')\n        setPatient({ ...ARDS_PROFILES[next] })\n      }\n      return\n    }\n    setArdsSeverityAndPersist('off')\n    persistPatientProfile(profile)\n    setPatient({ ...PATIENT_PROFILES[profile] })\n  }\n"""
          replace('src/App.tsx', old_logic, new_logic)
          old_button = """                  <button\n                    key={profile}\n                    type=\"button\"\n                    className={stateClass}\n                    disabled={teachingSession.candidatePatientLocked}\n                    aria-pressed={selected}\n                    title={selected && selectedPatientProfileModified ? `${profile} selected · settings modified` : `Apply ${profile} profile`}\n                    onClick={() => applyPatientProfile(profile)}\n                  >{profile}</button>\n"""
          new_button = """                  <button\n                    key={profile}\n                    type=\"button\"\n                    className={stateClass}\n                    disabled={teachingSession.candidatePatientLocked}\n                    aria-pressed={selected}\n                    title={profile === 'ARDS'\n                      ? `ARDS ${ardsSeverity === 'off' ? 'off' : ardsSeverity} · click for ${ardsSeverity === 'off' ? 'mild' : ardsSeverity === 'mild' ? 'moderate' : ardsSeverity === 'moderate' ? 'severe' : 'off'}`\n                      : selected && selectedPatientProfileModified ? `${profile} selected · settings modified` : `Apply ${profile} profile`}\n                    onClick={() => applyPatientProfile(profile)}\n                  >{profile === 'ARDS' ? `ARDS · ${ardsSeverity === 'off' ? 'Off' : ardsSeverity[0].toUpperCase() + ardsSeverity.slice(1)}` : profile}</button>\n"""
          replace('src/App.tsx', old_button, new_button)

          PY
      - run: npm ci
      - run: npm run build
      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-v0822-patient-mechanics.yml
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add -A
          git commit -m "v0.82.2 add chest wall compliance and ARDS severity profiles"
          git push origin HEAD:chatgpt/v0.82.2-chestwall-ards-severity
