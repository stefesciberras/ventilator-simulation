name: Verify v0.82.8.5 tablet landscape

on:
  push:
    branches:
      - chatgpt/v0.82.8.5-tablet-landscape

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.82.8.5-tablet-landscape
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/apply-v08285.py
      - run: npm ci
      - run: npm run build
      - name: Commit applied changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/App.tsx src/styles.css src/appVersion.ts
            git commit -m "implement tablet landscape workspace"
            git push origin HEAD:chatgpt/v0.82.8.5-tablet-landscape
          fi
