name: Apply clean EDUMON core migration

on:
  push:
    branches: [refactor/edusim-core-clean]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/edusim-core-clean
      - run: python scripts/apply-clean-edumon-core.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/edumon/EdumonApp.tsx
          git commit -m "Apply EDUMON core integration on v0.8.5" || exit 0
          git push origin HEAD:refactor/edusim-core-clean
