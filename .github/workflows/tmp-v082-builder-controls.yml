name: Temporary v0.82 builder controls validation
on:
  push:
    branches: [chatgpt/v0.82-builder-controls]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.82-builder-controls
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm ci
          npm run build
          rm .github/workflows/tmp-v082-builder-controls.yml
          git config user.name stefesciberras
          git config user.email 43134239+stefesciberras@users.noreply.github.com
          git add .github
          git commit -m "Remove temporary v0.82 builder controls validation" || true
          git push origin HEAD:chatgpt/v0.82-builder-controls
