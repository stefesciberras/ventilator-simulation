name: Refactor shared teaching tab

on:
  push:
    branches:
      - edusim/shared-teaching-scenario-runtime

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edusim/shared-teaching-scenario-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/refactor-shared-teaching-tab.mjs
      - name: Commit refactor and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/edumon/EdumonWorkspacePanel.tsx
          git rm scripts/refactor-shared-teaching-tab.mjs .github/workflows/refactor-shared-teaching-tab.yml
          git commit -m "Reuse shared EDUSIM Teaching tab in EDUVENT and EDUMON"
          git push
