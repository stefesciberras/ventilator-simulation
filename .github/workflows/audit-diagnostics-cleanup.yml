name: Audit diagnostics cleanup

on:
  push:
    branches: [refactor/diagnostics-legacy-cleanup-final2]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit legacy references
        run: |
          for term in CandidateInvitation SessionPanel InstructorLiveRoom DynamicScenarioBuilder DynamicScenarioRuntimeLibrary; do
            echo "===== $term ====="
            grep -RIn --exclude-dir=node_modules --exclude='*.map' "$term" src || true
          done
          echo "===== diagnostics ====="
          grep -RIn --exclude-dir=node_modules --exclude='*.map' -E "copyEdumonMonitorDiagnostics|copyEdumonSessionDiagnostics|SimulationDiagnostics" src || true
