name: Fix teaching media and EDUMON alarms

on:
  push:
    branches: [fix/teaching-media-edumon-alarms]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/teaching-media-edumon-alarms
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/fix-teaching-media-edumon-alarms.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit fix and remove temporary tooling
        run: |
          rm scripts/fix-teaching-media-edumon-alarms.mjs
          rm .github/workflows/fix-teaching-media-edumon-alarms.yml
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add -A
          git commit -m "Fix teaching media layout and EDUMON candidate presentations"
          git push origin HEAD:fix/teaching-media-edumon-alarms
