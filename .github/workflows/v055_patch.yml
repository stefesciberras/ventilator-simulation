name: Apply v0.55 measurement layout

on:
  push:
    branches:
      - chatgpt/v0.55-measurement-layout

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.55-measurement-layout
          fetch-depth: 0
      - name: Apply source patch
        run: python scripts/v055_refine_measurements.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Remove temporary patch harness
        run: rm -f scripts/v055_refine_measurements.py .github/workflows/v055_patch.yml
      - name: Revert generated TypeScript build info
        run: git checkout -- tsconfig.app.tsbuildinfo tsconfig.node.tsbuildinfo 2>/dev/null || true
      - name: Commit patched sources
        run: |
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add -A
          git commit -m "v0.55 refine patient effort and measurement layout"
          git push origin HEAD:chatgpt/v0.55-measurement-layout
