name: Apply v0.32 patient transition
on:
  push:
    branches: [chatgpt/v0.32-patient-transition]
    paths: [.github/workflows/apply-v032-patient-transition.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.32-patient-transition
      - name: Apply source changes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if text.count(old) < count:
                  raise SystemExit(f'{path}: marker not found: {old[:120]!r}')
              p.write_text(text.replace(old, new, count))

          # App: interpolation helper and persistence key.
          replace('src/App.tsx',
              "const WAVEFORM_STORAGE_KEY = 'eduvent.waveform-display'\n",
              "const WAVEFORM_STORAGE_KEY = 'eduvent.waveform-display'\nconst PATIENT_TRANSITION_STORAGE_KEY = 'eduvent.patient-transition-seconds'\n")

          marker = '''function Metric({ label, value, unit }: { label: string; value: string; unit: string }) {\n  return <div className="metric"><span>{label}</span><strong>{value}</strong><small>{unit}</small></div>\n}\n\n'''
          helper = marker + '''function interpolatePatientSettings(from: PatientSettings, to: PatientSettings, fraction: number): PatientSettings {\n  const f = Math.max(0, Math.min(1, fraction))\n  const lerp = (a: number, b: number) => a + (b - a) * f\n  return {\n    compliance: lerp(from.compliance, to.compliance),\n    resistance: lerp(from.resistance, to.resistance),\n    expiratoryResistance: lerp(from.expiratoryResistance, to.expiratoryResistance),\n    spontaneousRate: lerp(from.spontaneousRate, to.spontaneousRate),\n    effort: lerp(from.effort, to.effort),\n    neuralInspiratoryTime: lerp(from.neuralInspiratoryTime, to.neuralInspiratoryTime),\n    endExpiratoryOesophagealPressure: lerp(from.endExpiratoryOesophagealPressure, to.endExpiratoryOesophagealPressure),\n    co2Production: lerp(from.co2Production, to.co2Production),\n    deadSpaceVolume: lerp(from.deadSpaceVolume, to.deadSpaceVolume),\n  }\n}\n\n'''
          replace('src/App.tsx', marker, helper)

          replace('src/App.tsx',
              "  const [patient, setPatient] = useState<PatientSettings>(() => loadStoredSettings(PATIENT_STORAGE_KEY, initialPatient))\n",
              "  const [patient, setPatient] = useState<PatientSettings>(() => loadStoredSettings(PATIENT_STORAGE_KEY, initialPatient))\n  const [patientTransitionSeconds, setPatientTransitionSeconds] = useState<number>(() => {\n    if (typeof window === 'undefined') return 0\n    const stored = Number(window.localStorage.getItem(PATIENT_TRANSITION_STORAGE_KEY) ?? 0)\n    return [0, 5, 10, 30, 60].includes(stored) ? stored : 0\n  })\n")

          replace('src/App.tsx',
              "  const simulationStateRef = useRef(createSimulationState())\n  const simulationTimeRef = useRef(0)\n",
              "  const simulationStateRef = useRef(createSimulationState())\n  const simulationTimeRef = useRef(0)\n  const effectivePatientRef = useRef<PatientSettings>({ ...patient })\n  const patientTransitionRef = useRef<{ from: PatientSettings; to: PatientSettings; start: number; duration: number } | null>(null)\n")

          replace('src/App.tsx',
              "  useEffect(() => {\n    window.localStorage.setItem(PATIENT_STORAGE_KEY, JSON.stringify(patient))\n  }, [patient])\n\n",
              "  useEffect(() => {\n    window.localStorage.setItem(PATIENT_STORAGE_KEY, JSON.stringify(patient))\n  }, [patient])\n\n  useEffect(() => {\n    window.localStorage.setItem(PATIENT_TRANSITION_STORAGE_KEY, String(patientTransitionSeconds))\n  }, [patientTransitionSeconds])\n\n  useEffect(() => {\n    if (patientTransitionSeconds <= 0) {\n      effectivePatientRef.current = { ...patient }\n      patientTransitionRef.current = null\n      return\n    }\n    patientTransitionRef.current = {\n      from: { ...effectivePatientRef.current },\n      to: { ...patient },\n      start: simulationTimeRef.current,\n      duration: patientTransitionSeconds,\n    }\n  }, [patient, patientTransitionSeconds])\n\n")

          old_timer = '''    const timer = window.setInterval(() => {\n      const startTime = simulationTimeRef.current\n      const nextSamples = advanceSimulation(\n        simulationStateRef.current,\n        effectiveVentilator,\n        patient,\n        startTime,\n        TICK_STEPS,\n        DT,\n        holdOptions,\n      )\n'''
          new_timer = '''    const timer = window.setInterval(() => {\n      const startTime = simulationTimeRef.current\n      const transition = patientTransitionRef.current\n      let simulationPatient = patient\n      if (transition) {\n        const progress = (startTime - transition.start) / Math.max(transition.duration, 0.001)\n        simulationPatient = interpolatePatientSettings(transition.from, transition.to, progress)\n        effectivePatientRef.current = simulationPatient\n        if (progress >= 1) {\n          simulationPatient = { ...transition.to }\n          effectivePatientRef.current = simulationPatient\n          patientTransitionRef.current = null\n        }\n      } else {\n        effectivePatientRef.current = { ...patient }\n      }\n      const nextSamples = advanceSimulation(\n        simulationStateRef.current,\n        effectiveVentilator,\n        simulationPatient,\n        startTime,\n        TICK_STEPS,\n        DT,\n        holdOptions,\n      )\n'''
          replace('src/App.tsx', old_timer, new_timer)

          replace('src/App.tsx', '<span className="version">v0.31</span>', '<span className="version">v0.32</span>')
          replace('src/App.tsx',
              '          <PatientControls settings={patient} onChange={setPatient} onReset={resetPatient} />',
              '          <PatientControls settings={patient} onChange={setPatient} onReset={resetPatient} transitionSeconds={patientTransitionSeconds} onTransitionSecondsChange={setPatientTransitionSeconds} />')

          # Patient control UI.
          replace('src/components/Controls.tsx',
              'export function PatientControls({ settings, onChange, onReset }: { settings: PatientSettings; onChange: (next: PatientSettings) => void; onReset: () => void }) {',
              'export function PatientControls({ settings, onChange, onReset, transitionSeconds, onTransitionSecondsChange }: { settings: PatientSettings; onChange: (next: PatientSettings) => void; onReset: () => void; transitionSeconds: number; onTransitionSecondsChange: (seconds: number) => void }) {')

          old_title = '''      <div className="control-section-title">\n        <h2>Patient settings</h2>\n        <button className="reset-settings-button patient-reset-button" type="button" onClick={onReset}>Reset patient</button>\n      </div>\n      <div className="preset-row">'''
          new_title = '''      <div className="control-section-title">\n        <h2>Patient settings</h2>\n        <button className="reset-settings-button patient-reset-button" type="button" onClick={onReset}>Reset patient</button>\n      </div>\n      <div className="patient-transition-control">\n        <label htmlFor="patient-transition-select">\n          <span>Patient transition</span>\n          <select id="patient-transition-select" value={transitionSeconds} onChange={(event) => onTransitionSecondsChange(Number(event.target.value))}>\n            <option value={0}>Now</option>\n            <option value={5}>5 s</option>\n            <option value={10}>10 s</option>\n            <option value={30}>30 s</option>\n            <option value={60}>60 s</option>\n          </select>\n        </label>\n        <small>{transitionSeconds === 0 ? 'Changes apply immediately' : `Patient physiology transitions smoothly over ${transitionSeconds} s`}</small>\n      </div>\n      <div className="preset-row">'''
          replace('src/components/Controls.tsx', old_title, new_title)

          # Compact styling consistent with control panel.
          p = Path('src/styles.css')
          text = p.read_text()
          marker = '.patient-rr-control {'
          css = '''.patient-transition-control { margin: 8px 0 12px; padding: 9px 10px; border: 1px solid #294337; border-radius: 8px; background: rgba(50,104,73,.08); }\n.patient-transition-control label { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: #9fc7aa; font-size: 11px; }\n.patient-transition-control select { min-width: 92px; padding: 6px 8px; border: 1px solid #456151; border-radius: 6px; color: #e5f2e8; background: #111b17; }\n.patient-transition-control small { display: block; margin-top: 5px; color: #708c79; font-size: 9px; }\n\n'''
          if marker not in text:
              raise SystemExit('styles marker missing')
          p.write_text(text.replace(marker, css + marker, 1))

      - name: Install
        run: npm install --no-package-lock
      - name: Build
        run: npm run build
      - name: Commit v0.32
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/Controls.tsx src/styles.css
          git commit -m "v0.32: add smooth patient-setting transitions"
          git push origin HEAD:chatgpt/v0.32-patient-transition
