name: Apply VG-PC mechanics refactor once

on:
  push:
    branches:
      - chatgpt/v0.83.0.57-vgpc-shared-mechanics

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.head_commit.message != 'Apply VG-PC shared mechanics refactor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.83.0.57-vgpc-shared-mechanics
      - name: Apply focused VG-PC refactor
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/simulation/engineLegacy.ts')
          text = path.read_text()

          old_test = '''        const remainingVolume = Math.max(0, targetVolume - state.inspiredThisBreath)
        flowLs = Math.min(testFlow, remainingVolume / Math.max(dt, 0.001))
        const elasticPressure = state.volume / complianceL
        const resistivePressure = patient.resistance * flowLs
        pressure = ventilator.peep + elasticPressure + resistivePressure - pmus
'''
          new_test = '''        const remainingVolume = Math.max(0, targetVolume - state.inspiredThisBreath)
        flowLs = Math.min(testFlow, remainingVolume / Math.max(dt, 0.001))
        const testBreathPressure = solveFlowControlledPressure({
          peepCmH2O: ventilator.peep,
          commandedFlowLs: flowLs,
          musclePressureCmH2O: pmus,
          volumeAbovePeepL: state.volume,
          complianceLPerCmH2O: complianceL,
          airwayResistanceCmH2OPerLs: patient.resistance,
        })
        pressure = testBreathPressure.airwayPressureCmH2O
'''

          old_pc = '''      const appliedDrivingPressure = state.vgPressureControl * pressureRiseFraction(elapsed)
      pressure = ventilator.peep + appliedDrivingPressure
      const elasticPressure = state.volume / complianceL
      const availableDrivingPressure = appliedDrivingPressure - elasticPressure + pmus
      flowLs = Math.max(0, availableDrivingPressure / Math.max(patient.resistance, 0.5))
'''
          new_pc = '''      const appliedDrivingPressure = state.vgPressureControl * pressureRiseFraction(elapsed)
      const demand = solvePressureDemand({
        peepCmH2O: ventilator.peep,
        targetAssistPressureCmH2O: appliedDrivingPressure,
        musclePressureCmH2O: pmus,
        volumeAbovePeepL: state.volume,
        complianceLPerCmH2O: complianceL,
        airwayResistanceCmH2OPerLs: patient.resistance,
      })
      pressure = demand.airwayPressureCmH2O
      flowLs = demand.flowLs
'''

          if old_test not in text:
              raise SystemExit('VG-PC test-breath mechanics block not found')
          if old_pc not in text:
              raise SystemExit('VG-PC pressure-controlled mechanics block not found')

          text = text.replace(old_test, new_test, 1).replace(old_pc, new_pc, 1)
          path.write_text(text)
      - name: Commit refactor
        run: |
          git config user.name 'stefesciberras'
          git config user.email '43134239+stefesciberras@users.noreply.github.com'
          git add src/simulation/engineLegacy.ts
          git commit -m 'Apply VG-PC shared mechanics refactor'
          git push origin HEAD:chatgpt/v0.83.0.57-vgpc-shared-mechanics
