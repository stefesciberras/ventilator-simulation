name: Scenario Builder v0.2.0.4 refinements

on:
  push:
    branches:
      - chatgpt/scenario-builder-v0.2.0.4-trigger-refinements

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/scenario-builder-v0.2.0.4-trigger-refinements
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply source patches
        run: |
          python scripts/patch_v0204_account_model.py
          python scripts/patch_v0204_builder_core.py
          python scripts/patch_v0204_builder_ui.py
          python scripts/patch_v0204_runtime.py
          python scripts/patch_v0204_diagnostics.py
      - run: npm ci
      - run: npm run build
      - name: Commit validated source
        run: |
          git checkout origin/main -- tsconfig.app.tsbuildinfo || true
          rm .github/workflows/scenario-builder-v0204-refinements.yml
          rm scripts/patch_v0204_*.py
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add -A
          git commit -m "Scenario Builder v0.2.0.4 runtime and sharing refinements"
          git push origin HEAD:chatgpt/scenario-builder-v0.2.0.4-trigger-refinements
