name: v040 run
"on":
  push:
    branches:
      - chatgpt/v0.40-rolling-minute-measurements
    paths:
      - .github/workflows/v040-run.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.40-rolling-minute-measurements
      - name: Apply patch
        run: |
          echo '' | base64 -d > /tmp/patch_v040.py
          python /tmp/patch_v040.py
      - name: Install
        run: npm install --no-package-lock
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/simulation/engine.ts
          git commit -m "v0.40: add rolling minute ventilation and one-minute Pmean"
          git push origin HEAD:chatgpt/v0.40-rolling-minute-measurements
