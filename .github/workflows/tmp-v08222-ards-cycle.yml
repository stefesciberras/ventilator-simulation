name: Temporary v0.82.2.2 ARDS cycle
on:
  push:
    branches: [chatgpt/v0.82.2.2-ards-cycle]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply ARDS cycle change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          old = """    if (profile === 'ARDS') {\n      const cycle: Array<ArdsSeverity | 'off'> = ['off', 'mild', 'moderate', 'severe']\n      const currentIndex = Math.max(0, cycle.indexOf(ardsSeverity))\n      const next = cycle[(currentIndex + 1) % cycle.length]\n      setArdsSeverityAndPersist(next)\n      if (next === 'off') {\n        persistPatientProfile('Normal')\n        setPatient({ ...PATIENT_PROFILES.Normal })\n      } else {\n        persistPatientProfile('ARDS')\n        setPatient({ ...ARDS_PROFILES[next] })\n      }\n      return\n    }\n"""
          new = """    if (profile === 'ARDS') {\n      const currentIndex = ARDS_SEVERITIES.indexOf(ardsSeverity as ArdsSeverity)\n      const next = currentIndex < 0\n        ? 'mild'\n        : ARDS_SEVERITIES[(currentIndex + 1) % ARDS_SEVERITIES.length]\n      setArdsSeverityAndPersist(next)\n      persistPatientProfile('ARDS')\n      setPatient({ ...ARDS_PROFILES[next] })\n      return\n    }\n"""
          if old not in s:
              raise SystemExit('Expected ARDS cycle block not found')
          p.write_text(s.replace(old, new, 1))
          v = Path('src/appVersion.ts')
          vs = v.read_text()
          if "0.82.2.1" not in vs:
              raise SystemExit('Expected app version 0.82.2.1 not found')
          v.write_text(vs.replace("0.82.2.1", "0.82.2.2", 1))
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit product changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add src/App.tsx src/appVersion.ts
          git commit -m "v0.82.2.2 cycle ARDS severity without off state"
          git rm .github/workflows/tmp-v08222-ards-cycle.yml
          git commit -m "Remove temporary v0.82.2.2 workflow"
          git push
