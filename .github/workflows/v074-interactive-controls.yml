name: v0.74 interactive ventilator controls

on:
  push:
    branches:
      - chatgpt/v0.74-interactive-vent-controls

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.74-interactive-vent-controls
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply v0.74 patch
        run: python3 scripts/patch_v074.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit integrated changes
        run: |
          if git diff --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/SessionPanel.tsx
          git commit -m "v0.74 Integrate interactive ventilator controls"
          git push origin HEAD:chatgpt/v0.74-interactive-vent-controls
