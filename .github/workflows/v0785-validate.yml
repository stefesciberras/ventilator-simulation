name: v0.78.5 validate

on:
  push:
    branches:
      - chatgpt/v0.78.5-three-column-instructor-layout
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/patch_v0785.py
      - name: Verify requested layout
        run: |
          grep -q "repeat(3, minmax(0, 1fr))" src/instructor.css
          grep -q "patient-settings-fieldset" src/App.tsx
          grep -q "patient-physiology-column" src/components/Controls.tsx
          grep -q "SHOW VENTILATOR" src/App.tsx
          grep -q "grid-template-columns: 48px minmax(0, 1fr)" src/instructor.css
          grep -q "APP_VERSION = '0.78.5'" src/appVersion.ts
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit integrated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/Controls.tsx src/instructor.css src/appVersion.ts
          git diff --cached --quiet && exit 0
          git commit -m "v0.78.5 use three-column instructor settings layout"
          git push
