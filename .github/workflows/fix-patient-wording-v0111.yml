name: Fix Patient wording v0.11.1

on:
  push:
    branches: [chatgpt/studio-v0.11.1-complete-profile-parameters]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/studio-v0.11.1-complete-profile-parameters
      - run: python3 scripts/fix-patient-wording-v0111.py
      - name: Commit wording
        run: |
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add src/scenario-builder/ProfileEditor.tsx
          git commit -m "Finish Patient terminology in Studio" || exit 0
          git push
