name: Verify v0.82.6 teaching UI refinements

on:
  push:
    branches:
      - chatgpt/v0.82.6-shared-teaching-session
    paths:
      - .github/workflows/v0.82.6-teaching-ui-refinements.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.82.6-shared-teaching-session
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/refine_teaching_ui.py
      - run: npm ci
      - run: npm run build
      - name: Commit verified teaching UI refinements
        run: |
          rm scripts/refine_teaching_ui.py
          rm .github/workflows/v0.82.6-teaching-ui-refinements.yml
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add -A
          git commit -m "feat: refine teaching laser and candidate question dock"
          git push origin HEAD:chatgpt/v0.82.6-shared-teaching-session
