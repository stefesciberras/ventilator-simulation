name: Build v0.60 oxygenation engine
on:
  push:
    branches: [chatgpt/v0.60-oxygenation-engine]
jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Apply v0.60 patch
        run: |
          python scripts/v060_oxygenation_patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path('src/physiologyMeasurements.ts')
          text = path.read_text()
          line = '    oxygenSaturation: window.length ? window[window.length - 1].spo2 : null,\n'
          if line not in text:
              anchor = '    oxygenPercent: ventilator.fio2 * 100,\n'
              if anchor not in text:
                  raise SystemExit('oxygen saturation return anchor not found')
              text = text.replace(anchor, anchor + line, 1)
              path.write_text(text)
          PY
      - name: Build
        run: npm run build
      - name: Oxygenation source checks
        run: |
          python - <<'PY'
          from pathlib import Path
          engine = Path('src/simulation/engine.ts').read_text()
          app = Path('src/App.tsx').read_text()
          dialog = Path('src/components/PhysiologyMeasurementsDialog.tsx').read_text()
          phys = Path('src/physiologyMeasurements.ts').read_text()
          lower = engine.lower()
          assert 'updateOxygenation(state, ventilator, patient, t, dt, complianceL)' in engine
          assert 'metabolicDepletionPerSecond' in engine
          assert 'patient.frc' in engine
          assert 'patient.oxygenConsumption' in engine
          assert 'label="SpO₂"' in app
          assert '>SpO₂</button>' in dialog
          assert 'oxygenSaturation: window.length ? window[window.length - 1].spo2 : null' in phys
          assert 'const pao2' not in lower and 'let pao2' not in lower and 'pao2:' not in lower
          print('oxygenation semantic checks passed')
          PY
      - name: Commit implementation
        run: |
          git checkout -- tsconfig.tsbuildinfo 2>/dev/null || true
          rm -f .github/workflows/v060_oxygenation.yml scripts/v060_oxygenation_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.60 Add stateful SpO2 oxygenation engine"
          git push
