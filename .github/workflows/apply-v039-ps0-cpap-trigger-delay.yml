name: Apply v0.39 PS0 CPAP and trigger delay
"on":
  push:
    branches:
      - chatgpt/v0.39-ps0-cpap-trigger-delay
    paths:
      - .github/workflows/apply-v039-ps0-cpap-trigger-delay.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.39-ps0-cpap-trigger-delay
      - name: Apply source changes
        run: |
          echo '' | base64 -d > /tmp/patch_v039.py
          python /tmp/patch_v039.py
      - name: Install
        run: npm install --no-package-lock
      - name: Build
        run: npm run build
      - name: Commit v0.39
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/Controls.tsx src/simulation/engine.ts
          git commit -m "v0.39: make zero support untriggered CPAP and delay all triggers"
          git push origin HEAD:chatgpt/v0.39-ps0-cpap-trigger-delay
