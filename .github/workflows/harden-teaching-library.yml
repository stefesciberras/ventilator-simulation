name: Harden teaching library

on:
  push:
    branches:
      - chatgpt/v0.82.4-modular-teaching-library
    paths:
      - .github/workflows/harden-teaching-library.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.82.4-modular-teaching-library
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Create hardening migration with Supabase CLI
        run: |
          npx --yes supabase@latest migration new teaching_library_permanent_instructors
          MIGRATION=$(ls -t supabase/migrations/*_teaching_library_permanent_instructors.sql | head -1)
          cat > "$MIGRATION" <<'SQL'
          create policy "Teaching library requires permanent instructor"
            on public.teaching_library_items
            as restrictive
            for all
            to authenticated
            using (((select auth.jwt())->>'is_anonymous')::boolean is false)
            with check (((select auth.jwt())->>'is_anonymous')::boolean is false);
          SQL
      - run: npm ci
      - run: npm run build
      - name: Commit verified migration
        run: |
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "security: restrict teaching library to permanent instructors"
          git push origin HEAD:chatgpt/v0.82.4-modular-teaching-library
