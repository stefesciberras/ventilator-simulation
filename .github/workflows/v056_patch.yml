name: Apply v0.56 effort and trigger markers

on:
  push:
    branches:
      - chatgpt/v0.56-effort-trigger-markers

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.56-effort-trigger-markers

      - name: Correct patch guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/v056_patch.py')
          text = p.read_text()
          old = 'if "patientTriggerAllowed\\n  let triggerSignalMet" not in engine:'
          new = 'if "patientTriggerAllowed" not in engine:'
          if old not in text:
              raise SystemExit('Expected guard anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Apply source patch
        run: python .github/scripts/v056_patch.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify event-marker semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          engine = Path('src/simulation/engine.ts').read_text()
          waveform = Path('src/components/Waveform.tsx').read_text()
          app = Path('src/App.tsx').read_text()
          assert 'ventilatorTriggerDetected = true' in engine
          assert 'triggerDetectionEligible' in engine and 'patientTriggerAllowed' in engine
          assert 'ventilatorTriggerBaseline: ventilatorTriggerDetected ? ventilator.peep : undefined' in engine
          assert 'sample.ventilatorTriggerDetected' in waveform
          assert 'sample.patientEffortStart' in waveform
          assert "sample.breathTrigger !== 'patient'" not in waveform
          assert 'patient-effort-strip' not in app
          assert 'showPatientEffortMarkers={patientEffortVisible}' in app
          print('v0.56 semantic checks passed')
          PY

      - name: Remove temporary patch harness
        run: rm -f .github/workflows/v056_patch.yml .github/scripts/v056_patch.py

      - name: Revert generated TypeScript build info
        run: |
          git checkout -- tsconfig.app.tsbuildinfo tsconfig.node.tsbuildinfo 2>/dev/null || true

      - name: Commit patched sources
        run: |
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "v0.56 align patient effort and trigger markers to waveform"
          git push origin HEAD:chatgpt/v0.56-effort-trigger-markers
