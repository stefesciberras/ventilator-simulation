name: Patch EDUVENT SpO2 critical alarm

on:
  push:
    branches:
      - fix/eduvent-spo2-critical-alarm-v0.83.0.69

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[spo2-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/eduvent-spo2-critical-alarm-v0.83.0.69
          fetch-depth: 0
      - name: Wire SpO2 into shared critical alarm lifecycle
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "    co2High: null,\n    minuteVentilationLow: null,",
              "    co2High: null,\n    spo2Low: null,\n    minuteVentilationLow: null,",
              'alarm onset state',
          )

          replace_once(
              "  const respiratoryRateHighAlarmActive = respiratoryRateAvailable && eventMeasures.respiratoryRate > alarmLimits.respiratoryRateMax\n  // Reserved for upcoming scenario/instructor controls.",
              "  const respiratoryRateHighAlarmActive = respiratoryRateAvailable && eventMeasures.respiratoryRate > alarmLimits.respiratoryRateMax\n  const spo2LowAlarmActive = latestSample?.spo2 != null && latestSample.spo2 < 85\n  // Reserved for upcoming scenario/instructor controls.",
              'SpO2 active condition',
          )

          replace_once(
              "    respiratoryRateHigh: !suppressSecondaryAlarmsForApnea && respiratoryRateHighAlarmActive,\n    oxygenFailure: oxygenFailureActive,",
              "    respiratoryRateHigh: !suppressSecondaryAlarmsForApnea && respiratoryRateHighAlarmActive,\n    spo2Low: spo2LowAlarmActive,\n    oxygenFailure: oxygenFailureActive,",
              'alarm conditions',
          )

          replace_once(
              "    { key: 'respiratoryRateHigh', label: 'HIGH RESPIRATORY RATE', active: respiratoryRateHighAlarmActive, visible: !suppressSecondaryAlarmsForApnea },\n    { key: 'oxygenFailure', label: 'OXYGEN FAILURE', active: oxygenFailureActive, priority: 'critical' },",
              "    { key: 'respiratoryRateHigh', label: 'HIGH RESPIRATORY RATE', active: respiratoryRateHighAlarmActive, visible: !suppressSecondaryAlarmsForApnea },\n    { key: 'spo2Low', label: 'LOW SpO₂', active: spo2LowAlarmActive, priority: 'critical', immediateCritical: true },\n    { key: 'oxygenFailure', label: 'OXYGEN FAILURE', active: oxygenFailureActive, priority: 'critical' },",
              'shared alarm evaluation',
          )

          replace_once(
              "respiratoryRateLowAlarmActive, respiratoryRateHighAlarmActive, oxygenFailureActive, suppressSecondaryAlarmsForApnea])",
              "respiratoryRateLowAlarmActive, respiratoryRateHighAlarmActive, spo2LowAlarmActive, oxygenFailureActive, suppressSecondaryAlarmsForApnea])",
              'alarm evaluation dependencies',
          )

          replace_once(
              "respiratoryRateLowAlarmActive, respiratoryRateHighAlarmActive, oxygenFailureActive, currentSimulationTime])",
              "respiratoryRateLowAlarmActive, respiratoryRateHighAlarmActive, spo2LowAlarmActive, oxygenFailureActive, currentSimulationTime])",
              'alarm lifecycle dependencies',
          )

          replace_once(
              "  const spo2MetricAlarm: MetricAlarmLevel = latestSample?.spo2 != null && latestSample.spo2 < 85 ? 'red' : null",
              "  const spo2MetricAlarm: MetricAlarmLevel = spo2LowAlarmActive ? 'red' : null",
              'metric alarm source',
          )

          path.write_text(text)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Wire low SpO2 into critical alarm lifecycle [spo2-patched]"
          git push origin HEAD:fix/eduvent-spo2-critical-alarm-v0.83.0.69
