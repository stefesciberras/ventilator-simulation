name: Temporary v0.81.2 teaching layout and clock sync

on:
  push:
    branches:
      - chatgpt/v0.81.2-teaching-layout-clock-sync

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.81.2-teaching-layout-clock-sync
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply v0.81.2 fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {actual}: {old[:160]!r}')
              p.write_text(text.replace(old, new))

          app = 'src/App.tsx'
          replace(app,
              "  const [instructorSimulatorExpanded, setInstructorSimulatorExpanded] = useState(false)\n",
              "")

          toggle = """        {teachingSession.role === 'instructor' && (\n          <button\n            type=\"button\"\n            className={`instructor-ventilator-toggle ${instructorSimulatorExpanded ? 'expanded' : 'collapsed'}`}\n            onClick={() => setInstructorSimulatorExpanded((current) => !current)}\n            aria-expanded={instructorSimulatorExpanded}\n            title={instructorSimulatorExpanded ? 'Hide ventilator display' : 'Show ventilator display'}\n          >\n            <span>{instructorSimulatorExpanded ? 'HIDE VENTILATOR' : 'SHOW VENTILATOR'}</span>\n          </button>\n        )}\n"""
          replace(app, toggle, "")

          replace(app,
              "                  simulatorExpanded={instructorSimulatorExpanded}\n                  onSimulatorExpandedChange={setInstructorSimulatorExpanded}\n",
              "                  simulatorExpanded={teachingSession.role === 'instructor'}\n                  onSimulatorExpandedChange={() => undefined}\n")

          replace(app,
              "  const scenarioElapsedTime = Math.max(0, currentSimulationTime - scenarioClockOriginRef.current)\n  const eventMeasures = useMemo(\n",
              "  const scenarioElapsedTime = Math.max(0, currentSimulationTime - scenarioClockOriginRef.current)\n  const scenarioClockSync = teachingSession.scenarioClockSync\n  const displayedScenarioElapsedTime = teachingSession.role === 'candidate' && scenarioClockSync\n    ? Math.max(0, scenarioClockSync.elapsedMs / 1000 + (scenarioClockSync.paused ? 0 : (Date.now() - scenarioClockSync.receivedAt) / 1000))\n    : scenarioElapsedTime\n\n  useEffect(() => {\n    if (teachingSession.role !== 'candidate') teachingSession.updateScenarioElapsedMs(scenarioElapsedTime * 1000)\n  }, [teachingSession.role, scenarioElapsedTime])\n\n  const eventMeasures = useMemo(\n")

          replace(app,
              "          <div className={`simulation-clock ${simulationPaused ? 'paused' : ''}`} aria-label={`Simulation time ${formatSimulationClock(scenarioElapsedTime)}`}>\n            <span>TIME</span>\n            <strong>{formatSimulationClock(scenarioElapsedTime)}</strong>\n",
              "          <div className={`simulation-clock ${simulationPaused ? 'paused' : ''}`} aria-label={`Simulation time ${formatSimulationClock(displayedScenarioElapsedTime)}`}>\n            <span>TIME</span>\n            <strong>{formatSimulationClock(displayedScenarioElapsedTime)}</strong>\n")

          runtime = 'src/session/localRuntimeTransport.ts'
          replace(runtime,
              "  sentAt: number\n  patient: PatientSettings\n",
              "  sentAt: number\n  scenarioElapsedMs?: number\n  patient: PatientSettings\n")

          hook = 'src/session/useTeachingSession.ts'
          replace(hook,
              "  const [runtimeTransportKind, setRuntimeTransportKind] = useState<RuntimeTransportKind>(() => getDefaultLocalRuntimeUrl() ? getLocalRuntimeProfile() : 'webrtc')\n",
              "  const [runtimeTransportKind, setRuntimeTransportKind] = useState<RuntimeTransportKind>(() => getDefaultLocalRuntimeUrl() ? getLocalRuntimeProfile() : 'webrtc')\n  const [scenarioClockSync, setScenarioClockSync] = useState<{ elapsedMs: number; receivedAt: number; paused: boolean } | null>(null)\n")

          replace(hook,
              "  const simulationPausedRef = useRef(simulationPaused)\n",
              "  const simulationPausedRef = useRef(simulationPaused)\n  const scenarioElapsedMsRef = useRef(0)\n")

          replace(hook,
              "  useEffect(() => {\n    if (role !== 'standalone') return\n    simulationPausedRef.current = false\n    setSimulationPaused(false)\n  }, [role])\n",
              "  useEffect(() => {\n    if (role !== 'standalone') return\n    simulationPausedRef.current = false\n    setSimulationPaused(false)\n    setScenarioClockSync(null)\n  }, [role])\n")

          replace(hook,
              "      sentAt: Date.now(),\n      patient: patientRef.current,\n",
              "      sentAt: Date.now(),\n      scenarioElapsedMs: Math.max(0, Math.round(scenarioElapsedMsRef.current)),\n      patient: patientRef.current,\n")

          replace(hook,
              "    if (snapshot.policy.syncAlarms) setAlarmLimits(snapshot.alarmLimits)\n    setSimulationPaused(snapshot.simulationPaused)\n  }\n",
              "    if (snapshot.policy.syncAlarms) setAlarmLimits(snapshot.alarmLimits)\n    setSimulationPaused(snapshot.simulationPaused)\n    if (typeof snapshot.scenarioElapsedMs === 'number' && Number.isFinite(snapshot.scenarioElapsedMs)) {\n      setScenarioClockSync({\n        elapsedMs: Math.max(0, snapshot.scenarioElapsedMs),\n        receivedAt: Date.now(),\n        paused: snapshot.simulationPaused,\n      })\n    }\n  }\n")

          replace(hook,
              "  const subscribeRuntimeEvents = (listener: (envelope: LocalRuntimeEnvelope) => void) => {\n    runtimeEventListenersRef.current.add(listener)\n    return () => runtimeEventListenersRef.current.delete(listener)\n  }\n\n",
              "  const subscribeRuntimeEvents = (listener: (envelope: LocalRuntimeEnvelope) => void) => {\n    runtimeEventListenersRef.current.add(listener)\n    return () => runtimeEventListenersRef.current.delete(listener)\n  }\n\n  const updateScenarioElapsedMs = (elapsedMs: number) => {\n    if (!Number.isFinite(elapsedMs)) return\n    scenarioElapsedMsRef.current = Math.max(0, elapsedMs)\n  }\n\n")

          replace(hook,
              "    setConnection('idle')\n    setError(null)\n    if (leavingRole === 'candidate') {\n",
              "    setConnection('idle')\n    setError(null)\n    setScenarioClockSync(null)\n    if (leavingRole === 'candidate') {\n")

          replace(hook,
              "    runtimeTransportKind,\n    session,\n",
              "    runtimeTransportKind,\n    scenarioClockSync,\n    session,\n")

          replace(hook,
              "    broadcastNow,\n    broadcastRuntimeEvent,\n    subscribeRuntimeEvents,\n",
              "    broadcastNow,\n    broadcastRuntimeEvent,\n    subscribeRuntimeEvents,\n    updateScenarioElapsedMs,\n")

          instructor = Path('src/instructor.css')
          text = instructor.read_text()
          text += """

/* v0.81.2 fixed instructor workspace: ventilator remains visible outside narrow mobile paging */
body.eduvent-instructor-mode .instructor-ventilator-toggle { display: none !important; }

@media (min-width: 1101px) {
  body.eduvent-instructor-mode.eduvent-instructor-simulator-open .workspace {
    grid-template-columns: minmax(0, 1fr) 430px;
    gap: 14px;
  }
  body.eduvent-instructor-mode.eduvent-instructor-simulator-open .ventilator-console {
    display: block !important;
    grid-column: 1;
    grid-row: 1;
  }
  body.eduvent-instructor-mode.eduvent-instructor-simulator-open .control-panel {
    display: block;
    grid-column: 2;
    grid-row: 1;
    max-height: calc(100vh - 92px);
    overflow-y: auto;
  }
}

@media (min-width: 681px) and (max-width: 1100px) {
  body.eduvent-instructor-mode.eduvent-instructor-simulator-open .workspace {
    grid-template-columns: 1fr;
  }
  body.eduvent-instructor-mode.eduvent-instructor-simulator-open .ventilator-console {
    display: block !important;
    grid-column: 1;
    grid-row: 1;
  }
  body.eduvent-instructor-mode.eduvent-instructor-simulator-open .control-panel {
    display: block;
    grid-column: 1;
    grid-row: 2;
    max-height: none;
    overflow: visible;
  }
}
"""
          instructor.write_text(text)

          Path('src/appVersion.ts').write_text("export const APP_VERSION = '0.81.2'\n")
          PY
          npm ci
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/session/localRuntimeTransport.ts src/session/useTeachingSession.ts src/instructor.css src/appVersion.ts
          git commit -m "Fix instructor layout and sync candidate clock"
          git push origin HEAD:chatgpt/v0.81.2-teaching-layout-clock-sync
      - name: Validate committed tree
        shell: bash
        run: npm run build
