name: Apply scenario/account refactor

on:
  push:
    branches: [refactor/scenario-core-account-repository]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/scenario-core-account-repository
      - run: python scripts/apply-scenario-account-refactor.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/instructorAccount.ts src/components/InstructorAccountAuth.tsx src/teaching/scenario/runtimeCore.ts src/teaching/scenario/authoringTypes.ts
          git commit -m "Complete scenario core and instructor service extraction" || exit 0
          git push origin HEAD:refactor/scenario-core-account-repository
