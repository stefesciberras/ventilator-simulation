name: v0.77.4 technical debt cleanup

on:
  push:
    branches:
      - chatgpt/v0.77.4-technical-debt

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.77.4-technical-debt
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply v0.77.4 patch
        run: python scripts/patch_v0774.py
      - name: Verify technical debt cleanup
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat src/appVersion.ts)" = "export const APP_VERSION = '0.77.4'"
          ! grep -R -n -E "v?0\.[0-9]+\.[0-9]+" src --include='*.ts' --include='*.tsx' --exclude='appVersion.ts'
          ! grep -R -n "waveform-options-bar select" src/components/PhysiologyMeasurementsDialog.tsx
          grep -q "oesophagealEnabled={oesophagealMonitoringEnabled}" src/App.tsx
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit integrated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No integrated source changes to commit"
          else
            git commit -m "v0.77.4 Centralize version and explicit monitor state"
            git push origin HEAD:chatgpt/v0.77.4-technical-debt
          fi
