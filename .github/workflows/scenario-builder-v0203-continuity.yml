name: Scenario Builder v0.2.0.3 continuity fix

on:
  push:
    branches:
      - chatgpt/scenario-builder-v0.2.0.3-continuous-stages

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/scenario-builder-v0.2.0.3-continuous-stages
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply continuous stage transition fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          replace('src/App.tsx',
              """  const loadInstructorScenario = (scenario: InstructorScenarioSnapshot) => {\n    if (teachingSession.role === 'instructor') setSimulationPaused(true)\n    setWaveformFrozen(false)\n    setFrozenSamples(null)\n    scenarioClockOriginRef.current = simulationTimeRef.current\n""",
              """  const loadInstructorScenario = (\n    scenario: InstructorScenarioSnapshot,\n    options?: { pauseSimulation?: boolean; resetScenarioClock?: boolean },\n  ) => {\n    const pauseSimulation = options?.pauseSimulation ?? true\n    const resetScenarioClock = options?.resetScenarioClock ?? true\n    if (teachingSession.role === 'instructor' && pauseSimulation) setSimulationPaused(true)\n    setWaveformFrozen(false)\n    setFrozenSamples(null)\n    if (resetScenarioClock) scenarioClockOriginRef.current = simulationTimeRef.current\n""")

          replace('src/components/InstructorAccountControls.tsx',
              "  onLoadScenario: (scenario: InstructorScenarioSnapshot) => void\n",
              "  onLoadScenario: (scenario: InstructorScenarioSnapshot, options?: { pauseSimulation?: boolean; resetScenarioClock?: boolean }) => void\n")

          replace('src/components/InstructorAccountControls.tsx',
              "    onLoadScenario(nextScenario)\n    activateDynamicStage(preset, nextIndex, nextScenario, reason)\n",
              "    onLoadScenario(nextScenario, { pauseSimulation: false, resetScenarioClock: false })\n    activateDynamicStage(preset, nextIndex, nextScenario, reason)\n")

          replace('src/components/InstructorAccountControls.tsx',
              """    } else {\n      onLoadScenario(firstScenario)\n      activateDynamicStage(preset, 0, firstScenario)\n    }\n""",
              """    } else {\n      onLoadScenario(firstScenario, { pauseSimulation: false, resetScenarioClock: true })\n      activateDynamicStage(preset, 0, firstScenario, 'manual', 0)\n    }\n""")

          Path('src/scenario-builder/version.ts').write_text("export const SCENARIO_BUILDER_VERSION = '0.2.0.3'\n")
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit source changes
        run: |
          git checkout origin/main -- tsconfig.app.tsbuildinfo 2>/dev/null || true
          rm .github/workflows/scenario-builder-v0203-continuity.yml
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add -A
          git commit -m "Keep dynamic scenario stage transitions continuous"
          git push origin HEAD:chatgpt/scenario-builder-v0.2.0.3-continuous-stages
