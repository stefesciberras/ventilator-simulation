name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-edge-functions-production
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: meigiiqcrvwxcgapzxxi

jobs:
  deploy:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check deployment credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::GitHub Actions secret SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi

      - name: Deploy all Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          found=0
          for function_dir in supabase/functions/*; do
            [ -d "$function_dir" ] || continue
            function_name="$(basename "$function_dir")"
            echo "Deploying ${function_name} to ${SUPABASE_PROJECT_REF}"
            supabase functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_REF"
            found=1
          done

          if [ "$found" -eq 0 ]; then
            echo "::error::No Supabase Edge Functions were found under supabase/functions/."
            exit 1
          fi
