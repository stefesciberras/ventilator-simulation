name: Apply v0.26 ineffective triggering

on:
  push:
    branches:
      - chatgpt/v0.26-autopeep-ineffective-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.26-autopeep-ineffective-trigger

      - name: Apply source patch
        run: python3 scripts/apply-v026.py

      - name: Install
        run: npm install --no-package-lock

      - name: Build
        run: npm run build

      - name: Commit v0.26
        run: |
          rm scripts/apply-v026.py
          rm .github/workflows/apply-v026.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.26: model ineffective triggering from auto-PEEP"
          git push origin HEAD:chatgpt/v0.26-autopeep-ineffective-trigger
