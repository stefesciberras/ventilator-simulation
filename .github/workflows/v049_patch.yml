name: Apply v0.49 instructor refinements

on:
  push:
    branches:
      - chatgpt/v0.49-instructor-layout-alarm-silence

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply v0.49 instructor refinements') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.49-instructor-layout-alarm-silence
          fetch-depth: 0
      - name: Apply source patch
        run: python3 scripts/v049_patch.py
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Remove temporary patch harness
        run: |
          rm scripts/v049_patch.py
          rm .github/workflows/v049_patch.yml
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply v0.49 instructor refinements"
          git push origin HEAD:chatgpt/v0.49-instructor-layout-alarm-silence
