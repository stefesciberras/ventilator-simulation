name: Apply v0.33 Pmus profile
on:
  push:
    branches: [chatgpt/v0.33-pmus-profile]
    paths: [.github/workflows/apply-v033-pmus-profile.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.33-pmus-profile
      - name: Apply source changes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if text.count(old) < count:
                  raise SystemExit(f'{path}: marker not found: {old[:120]!r}')
              p.write_text(text.replace(old, new, count))

          # Extend patient settings with independently controllable contraction and relaxation times.
          replace('src/simulation/types.ts',
              '  effort: number\n  neuralInspiratoryTime: number\n',
              '  effort: number\n  neuralInspiratoryTime: number\n  effortRiseTime: number\n  effortRelaxationTime: number\n')

          # Defaults, smooth patient-setting transitions, and version.
          replace('src/App.tsx',
              'compliance: 60, resistance: 6, expiratoryResistance: 8, spontaneousRate: 12, effort: 5, neuralInspiratoryTime: 1, endExpiratoryOesophagealPressure: -5, co2Production: 250, deadSpaceVolume: 150,',
              'compliance: 60, resistance: 6, expiratoryResistance: 8, spontaneousRate: 12, effort: 5, neuralInspiratoryTime: 1, effortRiseTime: 0.3, effortRelaxationTime: 0.35, endExpiratoryOesophagealPressure: -5, co2Production: 250, deadSpaceVolume: 150,')
          replace('src/App.tsx',
              '    effort: lerp(from.effort, to.effort),\n    neuralInspiratoryTime: lerp(from.neuralInspiratoryTime, to.neuralInspiratoryTime),\n',
              '    effort: lerp(from.effort, to.effort),\n    neuralInspiratoryTime: lerp(from.neuralInspiratoryTime, to.neuralInspiratoryTime),\n    effortRiseTime: lerp(from.effortRiseTime, to.effortRiseTime),\n    effortRelaxationTime: lerp(from.effortRelaxationTime, to.effortRelaxationTime),\n')
          replace('src/App.tsx', '<span className="version">v0.32</span>', '<span className="version">v0.33</span>')

          # Patient presets and controls. Faster rise represents stronger neural drive without changing peak Pmus.
          replace('src/components/Controls.tsx',
              '    Normal: { compliance: 60, resistance: 6, expiratoryResistance: 8, spontaneousRate: 12, effort: 5, neuralInspiratoryTime: 1 },\n    ARDS: { compliance: 25, resistance: 8, expiratoryResistance: 10, spontaneousRate: 25, effort: 10, neuralInspiratoryTime: 0.8 },\n    COPD: { compliance: 80, resistance: 16, expiratoryResistance: 28, spontaneousRate: 18, effort: 8, neuralInspiratoryTime: 0.9 },\n    Asthma: { compliance: 70, resistance: 25, expiratoryResistance: 40, spontaneousRate: 24, effort: 11, neuralInspiratoryTime: 0.8 },',
              '    Normal: { compliance: 60, resistance: 6, expiratoryResistance: 8, spontaneousRate: 12, effort: 5, neuralInspiratoryTime: 1, effortRiseTime: 0.3, effortRelaxationTime: 0.35 },\n    ARDS: { compliance: 25, resistance: 8, expiratoryResistance: 10, spontaneousRate: 25, effort: 10, neuralInspiratoryTime: 0.8, effortRiseTime: 0.15, effortRelaxationTime: 0.2 },\n    COPD: { compliance: 80, resistance: 16, expiratoryResistance: 28, spontaneousRate: 18, effort: 8, neuralInspiratoryTime: 0.9, effortRiseTime: 0.25, effortRelaxationTime: 0.35 },\n    Asthma: { compliance: 70, resistance: 25, expiratoryResistance: 40, spontaneousRate: 24, effort: 11, neuralInspiratoryTime: 0.8, effortRiseTime: 0.15, effortRelaxationTime: 0.25 },')
          replace('src/components/Controls.tsx',
              '      <Slider label="Inspiratory effort" value={settings.effort} unit=" cmH₂O" min={0} max={20} onChange={(v) => patch({ effort: v })} />\n      <Slider label="Neural inspiratory time" value={settings.neuralInspiratoryTime} unit=" s" min={0.3} max={3} step={0.1} onChange={(v) => patch({ neuralInspiratoryTime: v })} />',
              '      <Slider label="Inspiratory effort" value={settings.effort} unit=" cmH₂O" min={0} max={20} onChange={(v) => patch({ effort: v })} />\n      <Slider label="Neural inspiratory time" value={settings.neuralInspiratoryTime} unit=" s" min={0.3} max={3} step={0.1} onChange={(v) => patch({ neuralInspiratoryTime: v })} />\n      <Slider label="Effort rise time" value={settings.effortRiseTime ?? 0.3} unit=" s" min={0.05} max={1.5} step={0.05} onChange={(v) => patch({ effortRiseTime: v })} />\n      <Slider label="Effort relaxation time" value={settings.effortRelaxationTime ?? 0.35} unit=" s" min={0.05} max={1.5} step={0.05} onChange={(v) => patch({ effortRelaxationTime: v })} />')

          # Replace the symmetric sin² effort with a rise / plateau / relaxation Pmus profile.
          old = '''function patientMusclePressure(t: number, patient: PatientSettings): number {\n  if (patient.spontaneousRate <= 0 || patient.effort <= 0) return 0\n  const cycle = 60 / patient.spontaneousRate\n  const phase = ((t % cycle) + cycle) % cycle\n  const neuralTi = Math.max(patient.neuralInspiratoryTime, 0.1)\n  if (phase >= neuralTi) return 0\n  const x = phase / neuralTi\n  return patient.effort * Math.sin(Math.PI * x) ** 2\n}\n'''
          new = '''function patientMusclePressure(t: number, patient: PatientSettings): number {\n  if (patient.spontaneousRate <= 0 || patient.effort <= 0) return 0\n  const cycle = 60 / patient.spontaneousRate\n  const phase = ((t % cycle) + cycle) % cycle\n  const neuralTi = Math.max(patient.neuralInspiratoryTime, 0.1)\n  if (phase >= neuralTi) return 0\n\n  // Active-breathing model: smooth contraction, optional plateau, then smooth relaxation.\n  // Rise and relaxation are specified independently because trigger delay depends strongly\n  // on dPmus/dt, not just on peak effort. If their requested durations exceed neural Ti,\n  // they are proportionally compressed and the plateau disappears.\n  let riseTime = clamp(patient.effortRiseTime ?? 0.3, 0.02, neuralTi)\n  let relaxationTime = clamp(patient.effortRelaxationTime ?? 0.35, 0.02, neuralTi)\n  const edgeTime = riseTime + relaxationTime\n  if (edgeTime > neuralTi) {\n    const scale = neuralTi / edgeTime\n    riseTime *= scale\n    relaxationTime *= scale\n  }\n  const relaxationStart = neuralTi - relaxationTime\n\n  if (phase < riseTime) {\n    const x = phase / Math.max(riseTime, 0.001)\n    const shape = 0.5 - 0.5 * Math.cos(Math.PI * x)\n    return patient.effort * shape\n  }\n\n  if (phase < relaxationStart) return patient.effort\n\n  const x = (phase - relaxationStart) / Math.max(relaxationTime, 0.001)\n  const shape = 0.5 + 0.5 * Math.cos(Math.PI * clamp(x, 0, 1))\n  return patient.effort * shape\n}\n'''
          replace('src/simulation/engine.ts', old, new)

      - name: Install
        run: npm install --no-package-lock
      - name: Build
        run: npm run build
      - name: Commit v0.33
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/Controls.tsx src/simulation/types.ts src/simulation/engine.ts
          git commit -m "v0.33: add physiologic Pmus effort profile"
          git push origin HEAD:chatgpt/v0.33-pmus-profile
