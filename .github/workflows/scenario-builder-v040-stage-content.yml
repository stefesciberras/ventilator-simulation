        run: |
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add src/instructorAccount.ts src/components/DynamicScenarioBuilder.tsx src/components/DynamicScenarioBuilder.css src/components/InstructorAccountControls.tsx src/account.css src/selfDirectedAssignments.ts src/App.tsx src/scenario-builder/version.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Scenario Builder v0.4.0 stage media and questions"
          git push origin HEAD:chatgpt/scenario-builder-v0.4.0-stage-content
