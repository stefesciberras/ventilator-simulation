name: Build v0.67 collapsible panels
on:
  push:
    branches:
      - chatgpt/v0.67-collapsible-panels
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.67-collapsible-panels
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply patch
        run: python scripts/v067_patch.py
      - name: Build
        run: npm run build
      - name: Semantic checks
        run: |
          grep -q "candidateJoinUrl && !simulatorExpanded" src/components/SessionPanel.tsx
          grep -q "instructor-dashboard.*panel-collapsed\|panel-collapsed.*instructor-dashboard" src/components/SessionPanel.tsx || grep -q "dashboardCollapsed ? 'panel-collapsed'" src/components/SessionPanel.tsx
          grep -q "eduvent.panel-collapsed" src/panelCollapse.ts
          grep -q "ventilator-settings-section.*panel-collapsed\|collapsed ? 'panel-collapsed'" src/components/Controls.tsx
          grep -q "patient-settings" src/components/Controls.tsx
          grep -q "APP_VERSION = '0.67'" src/diagnostics.ts
      - name: Remove temporary files
        run: |
          rm -f .github/workflows/v067_collapsible.yml scripts/v067_patch.py
          git checkout -- tsconfig.app.tsbuildinfo 2>/dev/null || true
      - name: Commit implementation
        run: |
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "v0.67 Add collapsible instructor panels"
          git push origin HEAD:chatgpt/v0.67-collapsible-panels
