name: Build v0.72 alarm recovery
on:
  push:
    branches:
      - chatgpt/v0.72-alarm-recovery
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply patch
        run: python scripts/v072_patch.py
      - name: Build
        run: npm run build
      - name: Semantic checks
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('src/App.tsx').read_text()
          eng = Path('src/simulation/engine.ts').read_text()
          assert 'previousApneaAlarmActiveRef' in app
          assert 'apneaJustResolved' in app
          assert "'oxygenFailure'" not in app.split('const staleApneaEpisodeKeys = new Set([',1)[1].split('])',1)[0]
          assert "availableDrivingPressure = ventilator.pressureControl - elasticPressure + pmus" in eng
          assert "flowLs = Math.max(0, availableDrivingPressure / Math.max(patient.resistance, 0.5))" in eng
          assert 'v0.72' in app
          print('semantic checks passed')
          PY
      - name: Remove temporary files
        run: rm -f .github/workflows/v072_build.yml scripts/v072_patch.py
      - name: Restore generated TypeScript build cache
        run: git checkout -- tsconfig.app.tsbuildinfo 2>/dev/null || true
      - name: Commit implementation
        run: |
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add src
          git commit -m "v0.72 Clear stale alarms when apnoea resolves"
          git push
