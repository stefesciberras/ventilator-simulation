name: v0.80.3 UI validate
on:
  push:
    branches: [chatgpt/v0.80.3-tabs-mobile-metrics]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply v0.80.3 patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          s = app.read_text()
          s = s.replace("  const [instructorSimulatorExpanded, setInstructorSimulatorExpanded] = useState(false)\n", "  const [instructorSimulatorExpanded, setInstructorSimulatorExpanded] = useState(false)\n  const [controlTab, setControlTab] = useState<'teaching' | 'vent' | 'patient' | 'physio'>('teaching')\n")
          start = s.find("        {teachingSession.role === 'candidate' && (\n          <div className=\"mobile-candidate-session-slot\">")
          if start != -1:
              end_marker = "        )}\n        {teachingSession.role === 'instructor' && ("
              end = s.find(end_marker, start)
              if end == -1: raise SystemExit('candidate slot end not found')
              s = s[:start] + "        {teachingSession.role === 'instructor' && (" + s[end+len(end_marker):]
          old = '''          <div className="alarm-slot" aria-live="polite">\n            {alarmLevel && (\n              <div className={`alarm-banner ${alarmLevel}`} role="alert">\n                <strong>{alarmLabels.join(' • ')}</strong>\n                {(alarmSilenced || teachingSession.candidateAlarmsSilent) && <span>ALARM SILENT</span>}\n              </div>\n            )}\n          </div>'''
          new = '''          <div className="alarm-row">\n            <div className="alarm-slot" aria-live="polite">\n              {alarmLevel && (\n                <div className={`alarm-banner ${alarmLevel}`} role="alert">\n                  <strong>{alarmLabels.join(' • ')}</strong>\n                  {(alarmSilenced || teachingSession.candidateAlarmsSilent) && <span>ALARM SILENT</span>}\n                </div>\n              )}\n            </div>\n            <button className="mobile-alarm-limits-button" type="button" disabled={teachingSession.candidateAlarmsLocked} onClick={() => setAlarmDialogOpen(true)}>Alarm limits</button>\n          </div>'''
          if old not in s: raise SystemExit('alarm slot block not found')
          s = s.replace(old, new)
          s = s.replace('              <div className="metrics-title">Measured</div>\n', '')
          panel_start = s.find('        <aside className="control-panel">')
          panel_end = s.find('        </aside>\n      </div>\n    </main>', panel_start)
          if panel_start == -1 or panel_end == -1: raise SystemExit('control panel block not found')
          replacement = '''        <aside className="control-panel tabbed-control-panel">\n          <nav className="control-tabs" role="tablist" aria-label="Simulator controls">\n            {(['teaching', 'vent', 'patient', 'physio'] as const).map((tab) => (\n              <button\n                key={tab}\n                type="button"\n                role="tab"\n                aria-selected={controlTab === tab}\n                className={controlTab === tab ? 'active' : ''}\n                onClick={() => setControlTab(tab)}\n              >{tab === 'teaching' ? 'Teaching' : tab === 'vent' ? 'Vent' : tab === 'patient' ? 'Patient' : 'Physio'}</button>\n            ))}\n          </nav>\n          <div className="control-tab-content">\n            {controlTab === 'teaching' && (\n              <div className="control-tab-pane teaching-tab-pane" role="tabpanel">\n                <SessionPanel\n                  role={teachingSession.role}\n                  simulatorExpanded={instructorSimulatorExpanded}\n                  onSimulatorExpandedChange={setInstructorSimulatorExpanded}\n                  connection={teachingSession.connection}\n                  localRuntimeConnection={teachingSession.localRuntimeConnection}\n                  localRuntimeUrl={teachingSession.localRuntimeUrl}\n                  runtimeTransportKind={teachingSession.runtimeTransportKind}\n                  session={teachingSession.session}\n                  members={teachingSession.members}\n                  error={teachingSession.error}\n                  recoverableInstructor={teachingSession.recoverableInstructor}\n                  recoverableCandidate={teachingSession.recoverableCandidate}\n                  currentScenario={currentInstructorScenario}\n                  onLoadScenario={loadInstructorScenario}\n                  onStartInstructor={startInstructorSession}\n                  onResumeInstructor={teachingSession.resumeInstructor}\n                  onJoinCandidate={teachingSession.joinCandidate}\n                  onResumeCandidate={teachingSession.resumeCandidate}\n                  onLeaveSession={teachingSession.leaveSession}\n                  onEndInstructorSession={teachingSession.endInstructorSession}\n                  onUpdatePolicy={teachingSession.updatePolicy}\n                  onBroadcastNow={teachingSession.broadcastNow}\n                />\n                <InstructorLiveRoom role={teachingSession.role} members={teachingSession.members} />\n              </div>\n            )}\n            {controlTab === 'vent' && (\n              <div className="control-tab-pane" role="tabpanel">\n                <fieldset className={`session-lock-fieldset ventilator-settings-fieldset ${teachingSession.candidateVentilatorLocked ? 'locked' : ''}`} disabled={teachingSession.candidateVentilatorLocked}>\n                  {teachingSession.candidateVentilatorLocked && <div className="session-control-lock-label">Instructor controlled</div>}\n                  <VentilatorControls collapsible={false} settings={ventilator} onChange={setVentilator} onReset={resetVentilator} fio2Override={effectiveVentilator.fio2} fio2BoostActive={oxygenBoost} />\n                </fieldset>\n              </div>\n            )}\n            {(controlTab === 'patient' || controlTab === 'physio') && (\n              <div className="control-tab-pane" role="tabpanel">\n                <fieldset className={`session-lock-fieldset patient-settings-fieldset ${teachingSession.candidatePatientLocked ? 'locked' : ''}`} disabled={teachingSession.candidatePatientLocked}>\n                  {teachingSession.candidatePatientLocked && <div className="session-control-lock-label">Instructor controlled</div>}\n                  <PatientControls view={controlTab === 'physio' ? 'physiology' : 'patient'} collapsible={false} settings={patient} onChange={setPatient} onReset={resetPatientRespiratory} onResetPhysiology={resetPatientPhysiology} transitionSeconds={patientTransitionSeconds} onTransitionSecondsChange={setPatientTransitionSeconds} showPatientEffort={patientEffortVisible} onShowPatientEffortChange={teachingSession.role === 'candidate' ? () => undefined : setShowPatientEffort} patientEffortLocked={teachingSession.role === 'candidate'} showSpO2Ceiling={teachingSession.role !== 'candidate'} />\n                </fieldset>\n              </div>\n            )}\n          </div>\n          <div className="disclaimer">Educational simulation only — not a medical device and not for clinical decision-making.</div>\n        </aside>'''
          s = s[:panel_start] + replacement + s[panel_end+len('        </aside>'):]
          app.write_text(s)

          controls = Path('src/components/Controls.tsx')
          c = controls.read_text()
          old_sig = "export function PatientControls({ settings, onChange, onReset, onResetPhysiology, transitionSeconds, onTransitionSecondsChange, showPatientEffort, onShowPatientEffortChange, patientEffortLocked = false, showSpO2Ceiling = true, collapsible = true }: { settings: PatientSettings; onChange: (next: PatientSettings) => void; onReset: () => void; onResetPhysiology: () => void; transitionSeconds: number; onTransitionSecondsChange: (seconds: number) => void; showPatientEffort: boolean; onShowPatientEffortChange: (value: boolean) => void; patientEffortLocked?: boolean; showSpO2Ceiling?: boolean; collapsible?: boolean }) {"
          new_sig = "export function PatientControls({ settings, onChange, onReset, onResetPhysiology, transitionSeconds, onTransitionSecondsChange, showPatientEffort, onShowPatientEffortChange, patientEffortLocked = false, showSpO2Ceiling = true, collapsible = true, view = 'both' }: { settings: PatientSettings; onChange: (next: PatientSettings) => void; onReset: () => void; onResetPhysiology: () => void; transitionSeconds: number; onTransitionSecondsChange: (seconds: number) => void; showPatientEffort: boolean; onShowPatientEffortChange: (value: boolean) => void; patientEffortLocked?: boolean; showSpO2Ceiling?: boolean; collapsible?: boolean; view?: 'patient' | 'physiology' | 'both' }) {"
          if old_sig not in c: raise SystemExit('patient signature not found')
          c = c.replace(old_sig, new_sig)
          c = c.replace('''      <div className="control-section-title">\n        <h2>Patient settings</h2>''', '''      {view !== 'physiology' && <div className="control-section-title">\n        <h2>Patient settings</h2>''', 1)
          c = c.replace('''        </div>\n      </div>\n      <div className="patient-respiratory-controls">''', '''        </div>\n      </div>}\n      {view !== 'physiology' && <div className="patient-respiratory-controls">''', 1)
          c = c.replace('''      </div>\n      <div className="patient-physiology-column">\n        <div className="control-section-title patient-physiology-title">''', '''      </div>}\n      {view !== 'patient' && <div className="patient-physiology-column">\n        <div className="control-section-title patient-physiology-title">''', 1)
          c = c.replace('''      <Slider label="Dead space volume" value={settings.deadSpaceVolume ?? 150} unit=" mL" min={50} max={400} step={10} onChange={(v) => patch({ deadSpaceVolume: v })} />\n      </div>\n    </section>''', '''      <Slider label="Dead space volume" value={settings.deadSpaceVolume ?? 150} unit=" mL" min={50} max={400} step={10} onChange={(v) => patch({ deadSpaceVolume: v })} />\n      </div>}\n    </section>''')
          controls.write_text(c)

          Path('src/mobile-metrics.css').write_text('''/* v0.80.3 compact mobile measured-value rail */\n@media (max-width: 680px) {\n  .screen-body { grid-template-columns: minmax(0, 1fr) 124px; align-items: stretch; }\n  .waveforms { min-width: 0; padding-left: 7px; padding-right: 7px; }\n  .waveforms.four-traces .waveform-card { height: 132px; }\n  .metrics-panel { display: flex; flex-direction: column; min-width: 0; border-top: 0; border-left: 1px solid #253139; }\n  .metrics-title, .metrics-actions { display: none !important; }\n  .metric { flex: 1 1 0; min-height: 0; padding: 5px 6px; display: grid; grid-template-columns: minmax(0,1fr) auto auto; align-items: center; column-gap: 3px; text-align: right; border-right: 0; }\n  .metric > span { display: block; text-align: left; font-size: 8px; line-height: 1.05; letter-spacing: .03em; }\n  .metric > strong { margin: 0; font-size: 17px; line-height: 1; }\n  .metric > small { display: block; margin: 0; font-size: 6.5px; line-height: 1; white-space: nowrap; }\n  .metric:nth-of-type(3n + 1) { border-right: 0; }\n  .metrics-spacer { display: none; }\n  .gas-metric { flex: 2 1 0; display: flex; flex-direction: column; padding: 0; }\n  .gas-metric-item { flex: 1 1 0; min-height: 0; padding: 5px 6px; display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 3px; }\n  .gas-metric-item + .gas-metric-item { border-left: 0; border-top: 1px solid #26343c; }\n  .gas-metric-item > span { text-align: left; font-size: 8px; }\n  .gas-metric-item > div { display: flex; flex-direction: row; justify-content: flex-end; align-items: baseline; gap: 3px; }\n  .gas-metric-item strong { font-size: 17px; }\n  .gas-metric-item small { font-size: 6.5px; }\n  .cursor-hint { flex: 0 0 auto; margin-top: 0; padding: 5px 3px; }\n  .alarm-row { display: flex; width: 100%; align-items: stretch; border-bottom: 1px solid #26343c; }\n  .alarm-slot { flex: 1 1 auto; min-width: 0; }\n  .alarm-banner { width: 100%; min-height: 34px; height: 100%; }\n  .mobile-alarm-limits-button { display: block; flex: 0 0 86px; border-radius: 0; border-top: 0; border-bottom: 0; border-right: 0; padding: 5px 6px; font-size: 9px; font-weight: 700; white-space: nowrap; }\n  .tabbed-control-panel { order: -2; }\n}\n@media (max-width: 400px) {\n  .screen-body { grid-template-columns: minmax(0, 1fr) 112px; }\n  .metric { padding-left: 4px; padding-right: 4px; }\n  .mobile-alarm-limits-button { flex-basis: 80px; }\n}\n''')

          style = Path('src/styles.css')
          st = style.read_text()
          st += '''\n\n/* v0.80.3 tabbed settings navigation */\n.control-tabs { position: sticky; top: -15px; z-index: 20; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 4px; margin: -15px -15px 12px; padding: 10px 10px 8px; background: rgba(14,20,25,.98); border-bottom: 1px solid #2d3d46; }\n.control-tabs button { min-width: 0; padding: 8px 5px; border-radius: 7px; color: #91a8b2; font-size: 10px; font-weight: 750; text-transform: uppercase; letter-spacing: .04em; }\n.control-tabs button.active { color: #dff7ff; border-color: #69c8e8; background: #18313c; }\n.control-tab-content { min-width: 0; }\n.control-tab-pane > .session-lock-fieldset { margin: 0; }\n.control-tab-pane .control-section { border-bottom: 0; padding-bottom: 4px; }\n.patient-section .patient-physiology-column > .patient-physiology-title { margin-top: 0; }\n.mobile-alarm-limits-button { display: none; }\n.alarm-row { width: 100%; }\n@media (max-width: 680px) {\n  .control-panel { padding-top: 15px; }\n  .control-tabs { top: -15px; }\n}\n'''
          style.write_text(st)

          Path('src/appVersion.ts').write_text("export const APP_VERSION = '0.80.3'\n")
          PY
      - name: Verify source expectations
        run: |
          grep -q "control-tabs" src/App.tsx
          grep -q "view={controlTab === 'physio'" src/App.tsx
          grep -q "mobile-alarm-limits-button" src/App.tsx
          grep -q "APP_VERSION = '0.80.3'" src/appVersion.ts
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit implementation and remove temporary workflow
        run: |
          rm .github/workflows/v0803-ui-validate.yml
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add src/App.tsx src/components/Controls.tsx src/styles.css src/mobile-metrics.css src/appVersion.ts .github/workflows/v0803-ui-validate.yml
          git commit -m "Implement v0.80.3 tabbed controls and compact mobile metrics"
          git push
