name: Build v0.70 CO2 clock autoscale

on:
  push:
    branches:
      - chatgpt/v0.70-co2-clock-autoscale

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply patch
        run: python scripts/v070_patch.py
      - name: Build
        run: npm run build
      - name: Semantic checks
        run: |
          python - <<'PY'
          from pathlib import Path
          eng = Path('src/simulation/engine.ts').read_text()
          app = Path('src/App.tsx').read_text()
          wave = Path('src/components/Waveform.tsx').read_text()
          styles = Path('src/styles.css').read_text()
          diag = Path('src/diagnostics.ts').read_text()

          assert 'co2BufferCapacityL = Math.max(15, pbw * 0.55)' in eng
          assert 'elapsedExpiration < 8' in eng
          assert 'Math.max(50, roundedUpToTen(largestMagnitude))' in wave
          assert "signal === 'pressure' || signal === 'co2'" in wave
          assert "? 30" in wave
          assert "signal === 'volume'" in wave and '? 200' in wave
          assert 'scenarioClockOriginRef.current = simulationTimeRef.current' in app
          assert 'formatSimulationClock(scenarioElapsedTime)' in app
          assert 'simulation-clock' in styles
          assert "APP_VERSION = '0.70'" in diag
          assert "appVersion: '0.70'" in app
          assert 'v0.70' in app

          pbw = 50 + 0.91 * (170 - 152.4)
          slope = 0.863 * 250 / (pbw * 0.55)
          assert 5.7 < slope < 6.3, slope
          print(f'teaching apnoeic CO2 slope at 170 cm male, VCO2 250: {slope:.2f} mmHg/min')
          PY
      - name: Remove temporary files
        run: |
          rm -f .github/workflows/v070_build.yml scripts/v070_patch.py
      - name: Restore generated TypeScript build cache
        run: git checkout HEAD -- tsconfig.app.tsbuildinfo 2>/dev/null || true
      - name: Commit implementation
        run: |
          git config user.name 'stefesciberras'
          git config user.email '43134239+stefesciberras@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'v0.70 Refine CO2 washout clock and waveform scales'
            git push
          fi
