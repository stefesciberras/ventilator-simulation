name: Temporary v0.81.3 UI and scenario logs

on:
  push:
    branches:
      - chatgpt/v0.81.3-ui-scenario-logs

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.81.3-ui-scenario-logs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply v0.81.3 patches
        shell: bash
        run: |
          python .github/tmp_v0813_patch.py
          python .github/tmp_v0813_controls.py
          python .github/tmp_v0813_hook.py
          python .github/tmp_v0813_css.py
          npm ci
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/appVersion.ts src/diagnostics.ts src/components/InstructorAccountControls.tsx src/session/useTeachingSession.ts src/account.css src/styles.css
          git commit -m "Prepare v0.81.3 UI and scenario diagnostics"
          git push origin HEAD:chatgpt/v0.81.3-ui-scenario-logs
      - name: Validate committed tree
        shell: bash
        run: npm run build
