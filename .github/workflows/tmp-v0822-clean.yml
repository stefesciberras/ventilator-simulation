name: Temporary v0.82.2 cleanup
on:
  push:
    branches: [chatgpt/v0.82.2-chestwall-ards-severity]
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.82.2-chestwall-ards-severity
          fetch-depth: 0
      - name: Restore generated build metadata and commit cleanup
        shell: bash
        run: |
          git checkout origin/main -- tsconfig.app.tsbuildinfo
          rm .github/workflows/tmp-v0822-clean.yml
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add -A
          git commit -m "Clean v0.82.2 generated build metadata"
          git push origin HEAD:chatgpt/v0.82.2-chestwall-ards-severity
