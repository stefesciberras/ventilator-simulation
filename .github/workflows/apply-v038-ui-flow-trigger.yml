name: Apply v0.38 UI and flow trigger delay
on:
  push:
    branches: [chatgpt/v0.38-ui-flow-trigger-delay]
    paths: [.github/workflows/apply-v038-ui-flow-trigger.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.38-ui-flow-trigger-delay
      - name: Apply source changes
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/components/Controls.tsx')
          text = p.read_text()
          replacements = [
              ("  onChange: (value: number) => void\n}", "  onChange: (value: number) => void\n  disabled?: boolean\n}"),
              ("function Slider({ label, value, unit, min, max, step = 1, displayValue, onChange }: SliderProps) {", "function Slider({ label, value, unit, min, max, step = 1, displayValue, onChange, disabled = false }: SliderProps) {"),
              ('<label className="control-row">', '<label className={`control-row ${disabled ? \'disabled\' : \'\'}`}>'),
              ('<input type="range" min={min} max={max} step={step} value={value} onChange={(e) => onChange(Number(e.target.value))} />', '<input type="range" min={min} max={max} step={step} value={value} disabled={disabled} onChange={(e) => onChange(Number(e.target.value))} />'),
          ]
          for old, new in replacements:
              if old not in text: raise SystemExit(f'Controls marker not found: {old[:40]}')
              text = text.replace(old, new, 1)
          modes = "  const modes: VentilatorMode[] = ['VC-AC', 'PC-AC', 'PSV', 'SIMV-VC', 'SIMV-PC', 'VG-PC', 'APRV', 'BIPAP']\n"
          if modes not in text: raise SystemExit('modes marker not found')
          text = text.replace(modes, modes + "  const zeroPressureSupport = (settings.mode === 'PSV' || isSimvMode(settings.mode)) && settings.pressureSupport <= 0.001\n", 1)
          slider_replacements = [
              ('<Slider label="Flow trigger" value={settings.flowTriggerSensitivity ?? 2} unit=" L/min" min={0.5} max={10} step={0.5} onChange={(v) => patch({ flowTriggerSensitivity: v })} />', '<Slider label="Flow trigger" value={settings.flowTriggerSensitivity ?? 2} unit=" L/min" min={0.5} max={10} step={0.5} disabled={zeroPressureSupport} onChange={(v) => patch({ flowTriggerSensitivity: v })} />'),
              ('<Slider label="Pressure trigger" value={settings.triggerSensitivity} unit=" cmH₂O below PEEP" min={0.5} max={8} step={0.5} onChange={(v) => patch({ triggerSensitivity: v })} />', '<Slider label="Pressure trigger" value={settings.triggerSensitivity} unit=" cmH₂O below PEEP" min={0.5} max={8} step={0.5} disabled={zeroPressureSupport} onChange={(v) => patch({ triggerSensitivity: v })} />'),
              ('<Slider label="Expiratory trigger (ETS)" value={settings.terminationSensitivity} unit="% peak flow" min={5} max={80} step={5} onChange={(v) => patch({ terminationSensitivity: v })} />', '<Slider label="Expiratory trigger (ETS)" value={settings.terminationSensitivity} unit="% peak flow" min={5} max={80} step={5} disabled={zeroPressureSupport} onChange={(v) => patch({ terminationSensitivity: v })} />'),
          ]
          for old, new in slider_replacements:
              if old not in text: raise SystemExit(f'Slider marker not found: {old[:40]}')
              text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path('src/App.tsx')
          text = p.read_text()
          icon_marker = "\nfunction calculateMeasuredIERatio(samples: Sample[]): number | null {"
          diagnostic_icon = "\n".join([
              "",
              "function DiagnosticIcon({ copied }: { copied: boolean }) {",
              "  return copied ? (",
              "    <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4 4L19 7\" fill=\"none\" stroke=\"currentColor\" strokeWidth=\"2.2\" strokeLinecap=\"round\" strokeLinejoin=\"round\" /></svg>",
              "  ) : (",
              "    <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\">",
              "      <rect x=\"4.5\" y=\"4.5\" width=\"15\" height=\"15\" rx=\"2.5\" fill=\"none\" stroke=\"currentColor\" strokeWidth=\"1.7\" />",
              "      <path d=\"M7.5 13h2l1.4-4 2.2 7 1.5-4H17\" fill=\"none\" stroke=\"currentColor\" strokeWidth=\"1.7\" strokeLinecap=\"round\" strokeLinejoin=\"round\" />",
              "    </svg>",
              "  )",
              "}",
              "",
              "function calculateMeasuredIERatio(samples: Sample[]): number | null {",
          ])
          if icon_marker not in text: raise SystemExit('diagnostic icon insertion marker not found')
          text = text.replace(icon_marker, diagnostic_icon, 1)
          old_status = '<div className="status-cluster"><span className={`status-dot ${frozen ? \'paused\' : \'\'}`} />{frozen ? \'SIMULATION PAUSED\' : \'SIMULATION ACTIVE\'} <span className="version">v0.37</span></div>'
          new_status = "\n".join([
              '<div className="status-cluster">',
              "          <span className={`status-dot ${frozen ? 'paused' : ''}`} />",
              "          <span>{frozen ? 'SIMULATION PAUSED' : 'SIMULATION ACTIVE'}</span>",
              "          <button",
              "            className={`top-diagnostic-button ${diagnosticCopied ? 'active copied' : ''}`}",
              '            type="button"',
              "            onClick={copyDiagnostics}",
              "            title={diagnosticCopied ? 'Diagnostic JSON copied' : 'Copy settings and visible waveform as diagnostic JSON'}",
              "            aria-label={diagnosticCopied ? 'Diagnostic JSON copied' : 'Copy diagnostic JSON'}",
              "          ><DiagnosticIcon copied={diagnosticCopied} /></button>",
              '          <span className="version">v0.38</span>',
              '        </div>',
          ])
          if old_status not in text: raise SystemExit('top status marker not found')
          text = text.replace(old_status, new_status, 1)
          old_metrics = "\n".join([
              '              <Metric label="Pmean" value={measures.meanPressure.toFixed(1)} unit="cmH₂O" />',
              '              <Metric label="EtCO₂" value={endTidalCO2 == null ? \'—\' : endTidalCO2.toFixed(0)} unit="mmHg" />',
              '              <Metric label="I:E measured" value={measuredIERatio == null ? \'—\' : `1:${measuredIERatio.toFixed(1)}`} unit="" />',
          ]) + "\n"
          new_metrics = "\n".join([
              '              <Metric label="Pmean" value={measures.meanPressure.toFixed(1)} unit="cmH₂O" />',
              '              <Metric label="I:E measured" value={measuredIERatio == null ? \'—\' : `1:${measuredIERatio.toFixed(1)}`} unit="" />',
              '              <div className="metrics-spacer" aria-hidden="true" />',
              '              <Metric label="EtCO₂" value={endTidalCO2 == null ? \'—\' : endTidalCO2.toFixed(0)} unit="mmHg" />',
          ]) + "\n"
          if old_metrics not in text: raise SystemExit('metrics marker not found')
          text = text.replace(old_metrics, new_metrics, 1)
          old_diag = "            <button className={`hardware-button diagnostic-button ${diagnosticCopied ? 'active blue' : ''}`} onClick={copyDiagnostics} title=\"Copy current settings and visible raw waveform as diagnostic JSON\" aria-label=\"Copy diagnostic JSON\">{diagnosticCopied ? 'Copied' : 'Diagnostic'}</button>\n"
          if old_diag not in text: raise SystemExit('bottom diagnostic marker not found')
          text = text.replace(old_diag, '', 1)
          if "appVersion: '0.37'" not in text: raise SystemExit('app version marker not found')
          text = text.replace("appVersion: '0.37'", "appVersion: '0.38'", 1)
          p.write_text(text)

          p = Path('src/styles.css')
          text = p.read_text()
          css_replacements = [
              ('.status-dot.paused { background: #e8b94e; box-shadow: 0 0 12px rgba(232,185,78,.75); }\n', '.status-dot.paused { background: #e8b94e; box-shadow: 0 0 12px rgba(232,185,78,.75); }\n.top-diagnostic-button { flex: 0 0 34px; width: 34px; height: 34px; min-width: 34px; padding: 6px; display: grid; place-items: center; border-radius: 50%; color: #91a8b2; background: #141f25; border-color: #3c505b; }\n.top-diagnostic-button svg { width: 20px; height: 20px; }\n.top-diagnostic-button:hover:not(:disabled) { color: #c9eaf4; border-color: #6a8998; background: #1b2b33; }\n.top-diagnostic-button.copied { color: #8ee6ff; border-color: #53c8ed; background: #173542; }\n'),
              ('.metric small { margin-left: 4px; font-size: 8px; color: #768891; }\n', '.metric small { margin-left: 4px; font-size: 8px; color: #768891; }\n.metrics-spacer { flex: 0 0 12px; min-height: 12px; border-bottom: 1px solid #26343c; background: #091014; }\n'),
              ('input[type="range"] { width: 100%; accent-color: #61bedd; }\n', 'input[type="range"] { width: 100%; accent-color: #61bedd; }\n.control-row.disabled { opacity: .38; }\n.control-row.disabled input[type="range"] { cursor: not-allowed; filter: grayscale(1); }\n'),
              ('  .metrics-title { grid-column: 1 / -1; }\n', '  .metrics-title { grid-column: 1 / -1; }\n  .metrics-spacer { grid-column: 1 / -1; width: 100%; }\n'),
          ]
          for old, new in css_replacements:
              if old not in text: raise SystemExit(f'CSS marker not found: {old[:30]}')
              text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path('src/simulation/engine.ts')
          text = p.read_text()
          engine_replacements = [
              ('  expiratoryTriggerReady: boolean\n', '  expiratoryTriggerReady: boolean\n  flowTriggerDetectedAt: number | null\n'),
              ('    expiratoryTriggerReady: true,\n', '    expiratoryTriggerReady: true,\n    flowTriggerDetectedAt: null,\n'),
              ('  state.expiratoryTriggerReady = true\n  state.peakExpiratoryFlowMagnitude = 0\n', '  state.expiratoryTriggerReady = true\n  state.flowTriggerDetectedAt = null\n  state.peakExpiratoryFlowMagnitude = 0\n'),
              ('  const triggerRefractoryPeriod = 0.12\n  const expiratoryTriggerFraction = 0.25\n', '  const triggerRefractoryPeriod = 0.12\n  const flowTriggerResponseDelay = 0.15\n  const expiratoryTriggerFraction = 0.25\n'),
          ]
          for old, new in engine_replacements:
              if old not in text: raise SystemExit(f'Engine marker not found: {old[:35]}')
              text = text.replace(old, new, 1)
          old_trigger = "\n".join([
              '  const pressureTriggerLevel = ventilator.peep - pressureTriggerSensitivity',
              "  const triggerSignalMet = ventilator.triggerType === 'flow'",
              '    ? predictedPatientFlowLmin >= flowTriggerSensitivity',
              '    : predictedAirwayPressure <= pressureTriggerLevel',
          ]) + "\n"
          new_trigger = "\n".join([
              '  const pressureTriggerLevel = ventilator.peep - pressureTriggerSensitivity',
              "  const rawTriggerSignalMet = ventilator.triggerType === 'flow'",
              '    ? predictedPatientFlowLmin >= flowTriggerSensitivity',
              '    : predictedAirwayPressure <= pressureTriggerLevel',
              '  const triggerDetectionEligible = !state.breathActive && !state.inspiratoryHoldActive && !state.expiratoryHoldActive',
              '  let triggerSignalMet = rawTriggerSignalMet',
              '',
              "  if (ventilator.triggerType === 'flow') {",
              '    if (!triggerDetectionEligible) {',
              '      state.flowTriggerDetectedAt = null',
              '      triggerSignalMet = false',
              '    } else {',
              '      if (rawTriggerSignalMet && state.flowTriggerDetectedAt == null) state.flowTriggerDetectedAt = t',
              '      triggerSignalMet = state.flowTriggerDetectedAt != null && t - state.flowTriggerDetectedAt >= flowTriggerResponseDelay',
              '    }',
              '  } else {',
              '    state.flowTriggerDetectedAt = null',
              '  }',
          ]) + "\n"
          if old_trigger not in text: raise SystemExit('trigger block not found')
          text = text.replace(old_trigger, new_trigger, 1)
          breath_old = "    state.expiratoryTriggerReady = false\n\n    if (mode === 'VC-AC')"
          breath_new = "    state.expiratoryTriggerReady = false\n    state.flowTriggerDetectedAt = null\n\n    if (mode === 'VC-AC')"
          if breath_old not in text: raise SystemExit('breath-start marker not found')
          text = text.replace(breath_old, breath_new, 1)
          p.write_text(text)

      - name: Install
        run: npm install --no-package-lock
      - name: Build
        run: npm run build
      - name: Commit v0.38
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/Controls.tsx src/styles.css src/simulation/engine.ts
          git commit -m "v0.38: refine measured UI and flow trigger response"
          git push origin HEAD:chatgpt/v0.38-ui-flow-trigger-delay
