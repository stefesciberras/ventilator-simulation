name: Verify v0.82.6.1 mobile drag fix

on:
  push:
    branches:
      - chatgpt/v0.82.6.1-ui-refinements
    paths:
      - .github/workflows/v0.82.6.1-mobile-drag-fix.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.82.6.1-ui-refinements
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/fix_prompt_mobile_transform.py
      - run: npm ci
      - run: npm run build
      - name: Commit verified mobile drag fix
        run: |
          rm scripts/fix_prompt_mobile_transform.py
          rm .github/workflows/v0.82.6.1-mobile-drag-fix.yml
          git checkout -- tsconfig.app.tsbuildinfo || true
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep candidate prompt anchored on narrow screens"
          git push origin HEAD:chatgpt/v0.82.6.1-ui-refinements
