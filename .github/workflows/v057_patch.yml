name: Apply v0.57 patient physiology patch
on:
  push:
    branches: [chatgpt/v0.57-height-pbw]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        run: python scripts/v057_patch.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Revert generated TypeScript build info
        run: git checkout -- tsconfig.tsbuildinfo 2>/dev/null || true
      - name: Remove temporary patch harness
        run: rm -f scripts/v057_patch.py .github/workflows/v057_patch.yml
      - name: Commit patched sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "v0.57 Add height-based PBW and physiological patient settings"
          git push
# rerun after interpolation compatibility fix
