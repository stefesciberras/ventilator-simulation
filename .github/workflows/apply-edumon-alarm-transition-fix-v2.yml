name: Apply EDUMON alarm scope and transition fix v2
on:
  push:
    branches: [fix/edumon-alarm-scope-patient-transition]
    paths:
      - 'scripts/apply-edumon-alarm-transition-fix-v2.mjs'
      - '.github/workflows/apply-edumon-alarm-transition-fix-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/edumon-alarm-scope-patient-transition
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-edumon-alarm-transition-fix-v2.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit implementation and remove temporary tooling
        run: |
          rm -f scripts/apply-edumon-alarm-transition-fix.mjs scripts/apply-edumon-alarm-transition-fix-v2.mjs
          rm -f .github/workflows/apply-edumon-alarm-transition-fix.yml .github/workflows/apply-edumon-alarm-transition-fix-v2.yml
          git config user.name 'stefesciberras'
          git config user.email '43134239+stefesciberras@users.noreply.github.com'
          git add -A
          git commit -m 'Fix EDUMON alarm modal scope and patient transitions'
          git push origin HEAD:fix/edumon-alarm-scope-patient-transition
