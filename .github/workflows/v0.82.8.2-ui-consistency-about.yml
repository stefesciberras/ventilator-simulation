name: Apply and verify v0.82.8.2 UI consistency and About
on:
  push:
    branches:
      - chatgpt/v0.82.8.2-ui-consistency-about
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/apply-v08282.py
      - run: npm ci
      - run: npm run build
      - name: Commit applied changes
        run: |
          rm .github/scripts/apply-v08282.py
          rm .github/workflows/v0.82.8.2-ui-consistency-about.yml
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add src/App.tsx src/appVersion.ts src/styles.css src/teaching/TeachingMediaPanel.tsx src/teaching/TeachingMediaPanel.css src/teaching/TeachingWorkspace.tsx src/teaching/teaching.css .github/scripts/apply-v08282.py .github/workflows/v0.82.8.2-ui-consistency-about.yml
          git commit -m "v0.82.8.2 align teaching UI and add About"
          git push
