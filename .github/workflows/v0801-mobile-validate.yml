name: v0.80.1 mobile validate

on:
  push:
    branches:
      - chatgpt/v0.80.1-mobile-controls
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v0.80.1 patch
        run: python3 scripts/patch_v0801.py
      - name: Verify requested UI changes
        run: |
          grep -q "APP_VERSION = '0.80.1'" src/appVersion.ts
          grep -q "FreezeWaveformIcon" src/App.tsx
          grep -q "hold-label-mobile" src/App.tsx
          grep -q "mobile-candidate-session-slot" src/App.tsx
          grep -q "candidate-mobile-collapsed" src/components/SessionPanel.tsx
          grep -q "unit: string" src/components/InteractiveVentilatorStrip.tsx
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit validated implementation and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/patch_v0801.py .github/workflows/v0801-mobile-validate.yml
          git add src/App.tsx src/appVersion.ts src/components/SessionPanel.tsx src/components/InteractiveVentilatorStrip.tsx src/interactive-vent-controls.css src/session.css src/styles.css
          git commit -m "v0.80.1 refine mobile candidate and ventilator controls"
          git push
