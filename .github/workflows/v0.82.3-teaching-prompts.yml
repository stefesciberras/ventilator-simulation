name: Build v0.82.3 teaching prompts

on:
  push:
    branches:
      - chatgpt/v0.82.3-teaching-prompts

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.82.3-teaching-prompts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Wire teaching prompt UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()

          old = "import { InstructorLiveRoom, SessionPanel } from './components/SessionPanel'\n"
          new = old + "import { TeachingPromptInstructorPanel, TeachingPromptOverlay, useTeachingPrompts } from './components/TeachingPrompts'\n"
          assert old in text
          text = text.replace(old, new, 1)

          marker = "  })\n\n  const candidateWaveformOptions = useMemo("
          assert marker in text
          text = text.replace(marker, "  })\n\n  const teachingPrompts = useTeachingPrompts(teachingSession.role, teachingSession.session?.id ?? null)\n\n  const candidateWaveformOptions = useMemo(", 1)

          main_marker = '    <main className="app-shell">\n'
          assert main_marker in text
          overlay = '''    <main className="app-shell">\n      <TeachingPromptOverlay\n        role={teachingSession.role}\n        prompt={teachingPrompts.activePrompt}\n        myResponse={teachingPrompts.myResponse}\n        busy={teachingPrompts.busy}\n        error={teachingPrompts.error}\n        onSubmit={teachingPrompts.submitResponse}\n      />\n'''
          text = text.replace(main_marker, overlay, 1)

          teaching_marker = '''                  onBroadcastNow={teachingSession.broadcastNow}\n                />\n                <div ref={setDynamicScenarioRuntimeHost} className="teaching-scenario-runtime-host" />'''
          assert teaching_marker in text
          teaching_replacement = '''                  onBroadcastNow={teachingSession.broadcastNow}\n                />\n                <TeachingPromptInstructorPanel\n                  role={teachingSession.role}\n                  activePrompt={teachingPrompts.activePrompt}\n                  responses={teachingPrompts.responses}\n                  candidateCount={teachingSession.members.filter((member) => member.role === 'candidate').length}\n                  busy={teachingPrompts.busy}\n                  error={teachingPrompts.error}\n                  onPresent={teachingPrompts.presentPrompt}\n                  onClose={teachingPrompts.closePrompt}\n                />\n                <div ref={setDynamicScenarioRuntimeHost} className="teaching-scenario-runtime-host" />'''
          text = text.replace(teaching_marker, teaching_replacement, 1)
          app.write_text(text)

          component = Path('src/components/TeachingPrompts.tsx')
          c = component.read_text()
          old_cleanup = '''  useEffect(() => {\n    void supabase.removeChannel(promptChannelRef.current as RealtimeChannel).catch(() => undefined)\n    void supabase.removeChannel(responseChannelRef.current as RealtimeChannel).catch(() => undefined)\n    promptChannelRef.current = null\n    responseChannelRef.current = null\n'''
          new_cleanup = '''  useEffect(() => {\n    if (promptChannelRef.current) void supabase.removeChannel(promptChannelRef.current)\n    if (responseChannelRef.current) void supabase.removeChannel(responseChannelRef.current)\n    promptChannelRef.current = null\n    responseChannelRef.current = null\n'''
          assert old_cleanup in c
          c = c.replace(old_cleanup, new_cleanup, 1)

          old_hook = '''  const [options, setOptions] = useState(['', '', '', ''])\n  if (role !== 'instructor') return null\n\n  const counts = useMemo(() => {'''
          new_hook = '''  const [options, setOptions] = useState(['', '', '', ''])\n\n  const counts = useMemo(() => {'''
          assert old_hook in c
          c = c.replace(old_hook, new_hook, 1)
          return_marker = '''  }, [responses])\n\n  const submit = async () => {'''
          assert return_marker in c
          c = c.replace(return_marker, '''  }, [responses])\n\n  if (role !== 'instructor') return null\n\n  const submit = async () => {''', 1)
          component.write_text(c)

          Path('src/appVersion.ts').write_text("export const APP_VERSION = '0.82.3.0'\n")
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit verified implementation
        run: |
          rm .github/workflows/v0.82.3-teaching-prompts.yml
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add src/App.tsx src/appVersion.ts src/components/TeachingPrompts.tsx .github/workflows/v0.82.3-teaching-prompts.yml
          git commit -m "feat: present live teaching prompts and polls"
          git push origin HEAD:chatgpt/v0.82.3-teaching-prompts
