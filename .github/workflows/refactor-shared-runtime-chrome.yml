name: Refactor shared runtime chrome
on:
  push:
    branches: [edusim/shared-runtime-chrome]
    paths:
      - scripts/refactor-shared-runtime-chrome.mjs
      - .github/workflows/refactor-shared-runtime-chrome.yml
jobs:
  refactor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edusim/shared-runtime-chrome
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/refactor-shared-runtime-chrome.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit refactor and remove temporary tooling
        run: |
          rm scripts/refactor-shared-runtime-chrome.mjs
          rm .github/workflows/refactor-shared-runtime-chrome.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Share About diagnostics and timing controls across simulators"
          git push
