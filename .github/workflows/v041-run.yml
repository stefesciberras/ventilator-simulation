name: v041 run
"on":
  push:
    branches:
      - chatgpt/v0.41-expanded-alarms
    paths:
      - .github/scripts/v041_patch.py
      - .github/workflows/v041-run.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.41-expanded-alarms
      - name: Apply patch
        run: python .github/scripts/v041_patch.py
      - name: Install
        run: npm install --no-package-lock
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/v041_patch.py .github/workflows/v041-run.yml
          git add -A
          git commit -m "v0.41: expand ventilator alarm limits"
          git push origin HEAD:chatgpt/v0.41-expanded-alarms
