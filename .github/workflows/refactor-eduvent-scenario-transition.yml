name: Refactor EDUVENT scenario transition

on:
  push:
    branches:
      - edusim/shared-teaching-scenario-runtime

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edusim/shared-teaching-scenario-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/refactor-eduvent-scenario-transition.mjs
      - name: Commit refactor and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/InstructorAccountControls.tsx
          git rm scripts/refactor-eduvent-scenario-transition.mjs .github/workflows/refactor-eduvent-scenario-transition.yml
          git commit -m "Use shared EDUSIM scenario transition resolver in EDUVENT"
          git push
