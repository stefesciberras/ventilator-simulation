name: Studio clinical colours v0.11.3
on:
  push:
    branches: [chatgpt/studio-v0.11.3-clinical-colours]
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/studio-v0.11.3-clinical-colours
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/apply-clinical-section-colours-v0113.py
      - run: npm ci
      - run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scenario-builder/modules/edumon/definition.ts src/scenario-builder/modules/edumon/authoringAdapter.tsx src/scenario-builder/ProfileEditor.tsx src/scenario-builder/ScenarioBuilderApp.tsx src/scenario-builder/clinicalSections.css src/scenario-builder/version.ts
          git commit -m "LoppjuSIM-Studio v0.11.3 colour clinical sections"
          git push
