name: v0.77.5 pause state cleanup

on:
  push:
    branches:
      - chatgpt/v0.77.5-pause-state-cleanup

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.77.5-pause-state-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply v0.77.5 patch
        run: python scripts/patch_v0775.py
      - name: Verify pause state cleanup
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat src/appVersion.ts)" = "export const APP_VERSION = '0.77.5'"
          ! grep -q "getPauseButton\|isSimulationPausedInDom\|setSimulationPausedInDom\|MutationObserver" src/session/useTeachingSession.ts
          grep -q "simulationPaused: frozen" src/App.tsx
          grep -q "candidatePauseLocked" src/session/useTeachingSession.ts
          grep -q "candidatePauseLocked" src/App.tsx
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit integrated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No integrated source changes to commit"
          else
            git commit -m "v0.77.5 Use explicit React pause state"
            git push origin HEAD:chatgpt/v0.77.5-pause-state-cleanup
          fi
