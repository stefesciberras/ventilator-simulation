name: Build v0.65 compact gas metrics

on:
  push:
    branches:
      - chatgpt/v0.65-compact-gas-metrics

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.65-compact-gas-metrics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply v0.65 patch
        run: python scripts/apply_v065_metrics.py
      - name: Build
        run: npm run build
      - name: Compact gas metric checks
        run: |
          grep -q 'function GasMetric' src/App.tsx
          grep -q 'gas-metric-item co2' src/App.tsx
          grep -q 'gas-metric-item spo2' src/App.tsx
          grep -q 'v0.65' src/App.tsx
          grep -q 'gas-metric-item.co2' src/styles.css
          grep -q 'gas-metric-item.spo2' src/styles.css
      - name: Remove temporary patch files
        run: |
          rm -f scripts/apply_v065_metrics.py
          rm -f .github/workflows/v065_compact_metrics.yml
          git checkout -- tsconfig.app.tsbuildinfo 2>/dev/null || true
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'v0.65 Compact EtCO2 and SpO2 display'
            git push origin HEAD:chatgpt/v0.65-compact-gas-metrics
          fi
