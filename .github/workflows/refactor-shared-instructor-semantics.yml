name: Refactor shared instructor semantics
on:
  push:
    branches: [edusim/shared-instructor-teaching-semantics]
    paths:
      - 'scripts/refactor_shared_instructor_semantics.py'
      - '.github/workflows/refactor-shared-instructor-semantics.yml'
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edusim/shared-instructor-teaching-semantics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply refactor
        run: python scripts/refactor_shared_instructor_semantics.py
      - run: npm ci
      - run: npm run build
      - name: Commit refactor and remove temporary tooling
        run: |
          rm scripts/refactor_shared_instructor_semantics.py .github/workflows/refactor-shared-instructor-semantics.yml
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add -A
          git commit -m "Share instructor libraries display and alarm semantics"
          git push origin HEAD:edusim/shared-instructor-teaching-semantics
