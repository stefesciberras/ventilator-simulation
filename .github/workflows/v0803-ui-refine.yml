name: v0.80.3 UI refine
on:
  push:
    branches: [chatgpt/v0.80.3-mobile-alarm-tabs]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0.80.3 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          old="  const [instructorSimulatorExpanded, setInstructorSimulatorExpanded] = useState(false)\n"
          assert old in s
          s=s.replace(old, old+"  const [controlTab, setControlTab] = useState<'teaching' | 'vent' | 'patient' | 'physio'>('teaching')\n",1)
          old='        <aside className="control-panel">\n'
          new='''        <aside className={`control-panel control-tab-${controlTab}`}>
          <nav className="control-tabs" aria-label="Control sections">
            {(['teaching', 'vent', 'patient', 'physio'] as const).map((tab) => (
              <button key={tab} type="button" className={controlTab === tab ? 'selected' : ''} onClick={() => setControlTab(tab)}>
                {tab === 'teaching' ? 'Teaching' : tab === 'vent' ? 'Vent' : tab === 'patient' ? 'Patient' : 'Physio'}
              </button>
            ))}
          </nav>
'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('src/appVersion.ts')
          p.write_text(p.read_text().replace("0.80.2","0.80.3"))

          p=Path('src/styles.css')
          s=p.read_text()
          s += r'''

/* v0.80.3 tabbed control sections */
.control-tabs {
  position: sticky;
  top: 0;
  z-index: 20;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 5px;
  margin: -15px -15px 12px;
  padding: 8px;
  border-bottom: 1px solid #2b3a43;
  background: rgba(12, 19, 24, .96);
  backdrop-filter: blur(8px);
}
.control-tabs button {
  min-width: 0;
  padding: 8px 6px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .04em;
}
.control-tabs button.selected {
  color: #dff7ff;
  border-color: #68bddc;
  background: #193744;
}
.control-panel.control-tab-teaching > .ventilator-settings-fieldset,
.control-panel.control-tab-teaching > .patient-settings-fieldset { display: none; }
.control-panel.control-tab-vent > .session-panel,
.control-panel.control-tab-vent > .patient-settings-fieldset,
.control-panel.control-tab-vent > .instructor-live-room { display: none; }
.control-panel.control-tab-patient > .session-panel,
.control-panel.control-tab-patient > .ventilator-settings-fieldset,
.control-panel.control-tab-patient > .instructor-live-room { display: none; }
.control-panel.control-tab-physio > .session-panel,
.control-panel.control-tab-physio > .ventilator-settings-fieldset,
.control-panel.control-tab-physio > .instructor-live-room { display: none; }
.control-panel.control-tab-patient .patient-physiology-column { display: none !important; }
.control-panel.control-tab-physio .patient-respiratory-controls { display: none !important; }
.control-panel.control-tab-physio .patient-section > .control-section-title { display: none !important; }
.control-panel.control-tab-patient .patient-section,
.control-panel.control-tab-physio .patient-section { margin-top: 0; }
@media (max-width: 680px) {
  .control-tabs { margin: -15px -15px 10px; gap: 3px; padding: 6px; }
  .control-tabs button { padding: 7px 3px; font-size: 9px; }
  .control-panel.control-tab-teaching > .candidate-session-panel { display: none; }
}
'''
          p.write_text(s)

          p=Path('src/mobile-metrics.css')
          s=p.read_text()
          s += r'''

/* v0.80.3 compact mobile monitoring rail */
@media (max-width: 680px) {
  .screen-body { grid-template-columns: minmax(0, 1fr) 118px; }
  .waveforms { padding-left: 7px; padding-right: 7px; }
  .waveforms.four-traces .waveform-card { height: 132px; }

  .metrics-panel {
    position: relative;
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding-top: 34px;
    border-top: 0;
    border-left: 1px solid #253139;
  }
  .metrics-title { display: none; }
  .metrics-actions {
    position: absolute;
    top: 0;
    right: 0;
    z-index: 7;
    width: 82px;
    height: 34px;
    display: block;
    padding: 3px;
    border: 0;
    background: #10181d;
  }
  .metrics-actions button {
    width: 100%;
    min-height: 28px;
    height: 28px;
    padding: 3px 4px;
    font-size: 8px;
    white-space: nowrap;
  }
  .waveforms .alarm-banner {
    position: relative;
    z-index: 6;
    width: calc(100% + 118px - 82px);
    min-height: 34px;
    padding: 6px 9px;
    margin-right: calc(-118px + 82px);
    font-size: 10px;
  }

  .metrics-panel > .metric:not(.gas-metric) {
    flex: 1 1 0;
    min-height: 0;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 6px;
    text-align: right;
  }
  .metric > span {
    flex: 1 1 auto;
    display: block;
    min-width: 0;
    text-align: left;
    font-size: 8px;
    letter-spacing: .03em;
  }
  .metric > strong {
    flex: 0 0 auto;
    margin: 0;
    font-size: 17px;
    line-height: 1;
  }
  .metric > small {
    flex: 0 0 auto;
    display: block;
    margin: 0;
    max-width: 34px;
    font-size: 6.5px;
    line-height: 1.05;
    text-align: left;
  }
  .metrics-spacer { flex: 0 0 4px; min-height: 4px; }
  .gas-metric {
    flex: 2 1 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 0;
  }
  .gas-metric-item {
    flex: 1 1 0;
    min-height: 0;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 6px;
  }
  .gas-metric-item > span {
    flex: 1 1 auto;
    text-align: left;
    font-size: 8px;
  }
  .gas-metric-item > div {
    flex: 0 0 auto;
    display: flex;
    flex-direction: row;
    align-items: baseline;
    gap: 3px;
  }
  .gas-metric-item strong { font-size: 17px; line-height: 1; }
  .gas-metric-item small { font-size: 6.5px; }
  .gas-metric-item + .gas-metric-item { border-left: 0; border-top: 1px solid #26343c; }
  .cursor-hint { flex: 0 0 auto; }
}
@media (max-width: 400px) {
  .screen-body { grid-template-columns: minmax(0, 1fr) 108px; }
  .waveforms .alarm-banner {
    width: calc(100% + 108px - 78px);
    margin-right: calc(-108px + 78px);
  }
  .metrics-actions { width: 78px; }
}
'''
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify patch
        run: |
          grep -q "control-tab-" src/App.tsx
          grep -q "0.80.3" src/appVersion.ts
          grep -q "compact mobile monitoring rail" src/mobile-metrics.css
      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/v0803-ui-refine.yml
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add src/App.tsx src/appVersion.ts src/styles.css src/mobile-metrics.css .github/workflows/v0803-ui-refine.yml
          git commit -m "v0.80.3 refine mobile alarms metrics and control tabs"
          git push
