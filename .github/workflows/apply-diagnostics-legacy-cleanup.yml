name: Apply diagnostics legacy cleanup

on:
  push:
    branches: [refactor/diagnostics-legacy-cleanup-final2]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/diagnostics-legacy-cleanup-final2
      - run: python scripts/apply-diagnostics-legacy-cleanup.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit finalized refactor
        run: |
          rm -f scripts/apply-diagnostics-legacy-cleanup.py
          rm -f .github/workflows/apply-diagnostics-legacy-cleanup.yml
          rm -f .github/workflows/audit-diagnostics-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract shared diagnostics and remove legacy scenario UI"
          git push origin HEAD:refactor/diagnostics-legacy-cleanup-final2
