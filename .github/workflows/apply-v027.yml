name: Apply v0.27 waveform options

on:
  push:
    branches:
      - chatgpt/v0.27-waveform-options

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.27-waveform-options
      - name: Apply source patch
        run: |
          echo 'PLACEHOLDER' > /tmp/patch.b64
          base64 -d /tmp/patch.b64 > /tmp/patch.py
          python /tmp/patch.py
      - name: Install
        run: npm install --no-package-lock
      - name: Build
        run: npm run build
      - name: Commit v0.27
        run: |
          rm -f .github/workflows/apply-v027.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "v0.27: add selectable CO2 and oesophageal waveforms"
          git push origin HEAD:chatgpt/v0.27-waveform-options
