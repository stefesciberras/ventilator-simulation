name: Apply v0.83.0.47 APRV holds and SIMV triggering

on:
  push:
    branches:
      - chatgpt/v0.83.0.47-aprv-holds-simv-triggering
    paths:
      - .github/workflows/apply-v0.83.0.47-aprv-holds-simv-triggering.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.83.0.47-aprv-holds-simv-triggering
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/apply-v0.83.0.47-aprv-holds-simv-triggering.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit transformed source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/Controls.tsx src/simulation/engineLegacy.ts src/appVersion.ts scripts/core-regression.mjs
          git diff --cached --quiet && exit 0
          git commit -m "v0.83.0.47 restore APRV holds and SIMV triggering"
          git push origin HEAD:chatgpt/v0.83.0.47-aprv-holds-simv-triggering
