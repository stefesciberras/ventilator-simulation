name: Temporary v0.81.7 validation

on:
  push:
    branches:
      - chatgpt/v0.81.7-profiles-speed-smoothing

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.81.7-profiles-speed-smoothing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply v0.81.7 changes
        run: |
          python .github/tmp_v0817_patch.py
          npm ci
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/appVersion.ts src/components/Controls.tsx src/patientProfiles.ts src/simulationSpeed.ts src/session/localRuntimeTransport.ts src/session/useTeachingSession.ts src/styles.css
          git commit -m "Implement v0.81.7 profiles speed and measurement smoothing"
          git push
      - name: Validate committed tree
        run: npm run build
