name: Verify v0.82.7.0 teaching marking
on:
  push:
    branches:
      - chatgpt/v0.82.7.0-marking
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.82.7.0-marking
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply marking implementation
        run: python scripts/implement_teaching_marking.py
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit verified implementation
        run: |
          git config user.name "stefesciberras"
          git config user.email "43134239+stefesciberras@users.noreply.github.com"
          git add src supabase/migrations/20261017_teaching_prompt_answer_release.sql
          if ! git diff --cached --quiet; then
            git commit -m "feat: add marked MCQs and delayed answer release"
            git push origin HEAD:chatgpt/v0.82.7.0-marking
          fi
